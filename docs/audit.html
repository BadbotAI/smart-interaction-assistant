<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%231DA1F2'/%3E%3Crect x='10.5' y='3.6' width='9.6' height='7.3' rx='2.7' fill='none' stroke='%23fff' stroke-width='1.5' opacity='0.75'/%3E%3Cpath d='M3.4 12a3.7 3.7 0 0 1 3.7-3.7h6a3.7 3.7 0 0 1 3.7 3.7v2.3a3.7 3.7 0 0 1-3.7 3.7H9.5l-3.1 2.6c-.55.46-1.3.07-1.3-.64v-2.4A3.7 3.7 0 0 1 3.4 14.3z' fill='%23fff'/%3E%3Ccircle cx='7.4' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='10.25' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='13.1' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3C/svg%3E">
<title>操作日志 · 智能交互平台</title>
<link rel="stylesheet" href="./shared.css?v=fbd4f67c">
<link rel="prefetch" href="./audit.html"><link rel="prefetch" href="./cards.html"><link rel="prefetch" href="./dashboard.html"><link rel="prefetch" href="./design.html"><link rel="prefetch" href="./embed-demo.html"><link rel="prefetch" href="./index.html"><link rel="prefetch" href="./library.html"><link rel="prefetch" href="./playground.html"><link rel="prefetch" href="./products.html">
</head>
<body class="has-side">
<div class="page">
  <div class="page-head"><div class="page-title">操作日志</div></div>
  <div style="display:flex;align-items:center;margin-bottom:10px">
    <span class="muted" id="auditCount"></span>
    <div style="flex:1"></div>
    <button class="btn small" id="dlBtn"></button>
  </div>
  <div class="card" style="padding:0">
    <div id="auditBox"></div>
  </div>
</div>

<script>window.SIA_PLATFORM="ia";</script>
<script src="./mock_data.js?v=72192081"></script>
<script src="./mock_api.js?v=035e1e8c"></script>
<script src="./tokens.js?v=360e29ec"></script>
<script src="./ui.js?v=33285b39"></script>
<script>
UI.nav("audit");
const { el } = UI;

const ACTION_NAMES = {
  card_publish: "发布配置", card_offline: "下线配置", card_delete: "删除配置",
  card_rollback: "回滚配置", card_restore_draft: "载入历史版本为草稿", card_republish_same: "原样重新上线",
  echo_toggle: "切换回显", policy_update: "更新路由规则", policy_rollback: "回滚路由规则",
  model_register: "添加模型", model_status_change: "变更模型状态", model_set_default: "设默认兜底",
  credential_delete: "删除凭证并暂停", export_csv: "导出明细", profile_rebuild: "更新画像",
  brand_activate: "切换组件风格", brand_delete: "删除组件风格", label_review: "标签复核",
  unmask_trace: "解除脱敏",
  policy_create: "新增路由策略", policy_delete: "删除路由策略", policy_duplicate: "复制路由策略",
  scene_add: "添加业务场景", scene_delete: "删除业务场景",
  bank_question_delete: "删除数据集题目", bank_question_relabel: "更改题目场景",
  bank_scene_replace: "替换场景数据集", apikey_create: "创建 API Key", apikey_delete: "删除 API Key",
  judge_model_set: "配置 Judge 模型", model_thinking: "切换思考模式", model_rename: "编辑模型", model_delete: "删除模型",
  model_profile_data: "导入画像数据", bank_import: "导入数据集", bank_import_failed: "导入数据集失败",
  bank_eval_pending: "评测回填", bank_staged_commit: "并入回流数据", bank_staged_discard: "移除回流数据",
  brand_import: "导入组件风格", label_source_toggle: "切换信号源", card_refs_upgrade: "升级配置引用",
  ab_create: "创建 AB 实验", ab_stop: "停止 AB 实验",
};

function fmtDetail(d) {
  if (!d || typeof d !== "object") return "";
  return Object.entries(d).map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join(" · ");
}

document.getElementById("dlBtn").append(UI.icon("download", 14), "导出 CSV");
let allAudit = [];
document.getElementById("dlBtn").onclick = () => {
  const lines = [["时间", "操作人", "动作", "详情"].join(",")];
  allAudit.forEach(r => lines.push([
    UI.fmtTs(r.ts), r.actor || "", ACTION_NAMES[r.action] || r.action,
    JSON.stringify(fmtDetail(r.detail)),
  ].join(",")));
  const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "操作日志.csv";
  a.click();
  URL.revokeObjectURL(a.href);
  UI.toast("已导出操作日志");
};
let shown = 50;
async function load() {
  const { audit } = await UI.api("/api/audit?limit=200");
  allAudit = audit;
  document.getElementById("auditCount").textContent = `共 ${audit.length} 条（最近 200 条内）`;
  const box = document.getElementById("auditBox");
  box.innerHTML = "";
  if (!audit.length) {
    box.appendChild(el("div", { class: "empty-state" }, [
      el("div", { class: "empty-title" }, ["还没有审计记录"]),
      el("div", {}, ["发布配置、调整策略等关键操作后会出现在这里"]),
    ]));
    return;
  }
  box.appendChild(el("table", { class: "data" }, [
    el("thead", {}, [el("tr", {}, ["时间", "操作人", "动作", "对象与详情"].map(h => el("th", { class: h === "对象与详情" ? "w-main" : "" }, [h])))]),
    el("tbody", {}, audit.slice(0, shown).map(r => el("tr", {}, [
      el("td", { class: "num", style: "white-space:nowrap" }, [UI.fmtTs(r.ts)]),
      el("td", {}, [r.actor || "-"]),
      el("td", {}, [ACTION_NAMES[r.action] || r.action]),
      el("td", { class: "muted num w-main", style: "max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap", title: fmtDetail(r.detail) }, [fmtDetail(r.detail)]),
    ]))),
  ]));
  if (audit.length > shown) {
    box.appendChild(el("div", { style: "text-align:center;padding:10px" }, [
      el("button", { class: "btn small", onclick: () => { shown += 50; load(); } }, [`显示更多（还有 ${audit.length - shown} 条）`]),
    ]));
  }
}
load().catch(e => UI.toast("加载失败：" + e.message, true));
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});</script>
</body>
</html>
