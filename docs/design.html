UI.nav("design");
const { el } = UI;
document.getElementById("demoHelp").appendChild(UI.help("与线上同一套渲染器；风格预览后此处实时更新，提交不产生数据"));


let brands = [];                 // /api/brands 返回的预设 + 已导入
let products = [];               // 用于统计每个风格被哪些产品使用
let previewFile = "brand-tokens.default.json";   // 当前预览中的风格

// ---------- 组件示例（真实场景数据） ----------
const SCENES = {
  "select.single": { name: "文本选择器", q: "我要开发票", reply: "好的，请确认发票类型。", prompt: "开哪种发票？",
    config: { options: ["专票", "普票"], recommended_default: "普票" } },
  "select.card": { name: "卡片选择器", q: "帮我选个运输方案", reply: "两个方案供你选择：", prompt: "选择运输方案",
    config: { options: ["海运直达", "海铁联运"], recommended_default: "海运直达",
      option_meta: { "海运直达": { desc: "35 天 · 成本低" }, "海铁联运": { desc: "26 天 · 快 9 天" } } } },
  "rank.priority": { name: "优先级排序器", q: "这批货怎么安排比较好", reply: "请把你的诉求按重要程度排个序：", prompt: "哪个对你最重要？",
    config: { options: ["时效最快", "成本最低", "风险最小"] } },
  "matrix.compare+select": { name: "表格选择器", q: "对比一下这几家供应商", reply: "按价格、时效、合规评估如下：", prompt: "选定供应商",
    config: { options: ["中远供应链", "环球捷运"], dimensions: ["价格", "时效", "合规"] } },
  "scale.likert": { name: "评分器", q: "谢谢，问题解决了", reply: "不客气。", prompt: "这次服务满意吗？",
    config: { likert: { left: "很不满意", right: "很满意", from: 1, to: 5 } } },
  "form.structured": { name: "表单收集工具", q: "我要退货", reply: "请补充以下信息，我来为你登记。", prompt: "退货登记",
    config: { fields: [{ key: "order_no", label: "订单号", required: true }, { key: "phone", label: "联系电话", required: true }] } },
  "slider.range": { name: "数值选择器", q: "帮我做个采购预算", reply: "先确认一下预算范围。", prompt: "预算上限（万元）",
    config: { slider: { min: 0, max: 100, unit: "万元" } } },
  "input.followup": { name: "备注填写器", q: "送货有点要求", reply: "好的，请留下送货备注：", prompt: "送货备注",
    config: { placeholder: "例如：周五前送到，放前台即可" } },
  "picker.datetime": { name: "日期选择器", q: "帮我约个提货时间", reply: "好的，请选择提货日期：", prompt: "期望提货日期", config: {} },
  "picker.timerange": { name: "时间段选择器", q: "什么时候方便上门取件", reply: "请选择方便的时间段：", prompt: "取件时间段", config: { display: "time" } },
  "picker.location": { name: "地址卡片", q: "这批货送到仓库", reply: "请确认收货地点：", prompt: "收货地点",
    config: { options: ["上海仓", "宁波舟山港", "青岛港"] } },
  "upload.file": { name: "文件上传器", q: "报关材料给你", reply: "请上传相关单据：", prompt: "上传报关单",
    config: { placeholder: "请上传报关单或合同文件（PDF / Excel）" } },
  "upload.image": { name: "图片上传器", q: "货有点破损，我拍了照片", reply: "请上传破损部位的照片：", prompt: "上传破损照片",
    config: { placeholder: "请拍摄或上传清晰照片" } },
  "commerce.order": { name: "商品下单器", q: "这批设备怕震，帮我加固一下", reply: "推荐以下增值服务，可直接下单：", prompt: "选择增值服务",
    config: { options: ["木箱加固", "运输保价"],
      option_meta: { "木箱加固": { desc: "出口级木箱，防潮防震", price: 120, price_original: 150, sales: 2300, tags: ["防潮"] },
                     "运输保价": { desc: "按货值 0.3% 投保", price: 50, price_original: 60, sales: 5100, tags: ["全额赔付"] } } } },
  "entry.link": { name: "入口跳转器", q: "还有什么优惠活动吗", reply: "为你找到两个专区：", prompt: "",
    config: { options: ["神券团购专区", "增值服务商城"],
      option_meta: { "神券团购专区": { desc: "咖啡茶饮 5 折起" }, "增值服务商城": { desc: "加固 · 保价 · 耗材" } } } },
  "suggest.followup": { name: "追问引导器", q: "帮我查一下这票货到哪了", reply: "这票货已到宁波舟山港中转，预计后天送达。", prompt: "你可能还想问",
    config: { options: ["为什么会延误", "预计什么时候能到", "帮我催一下这票货"] } },
};

function buildEnvelope(ct, config, prompt) {
  const params = { prompt: ct === "entry.link" ? (prompt || "") : (prompt || "请选择"), submit_label: ct === "commerce.order" ? "去下单" : "提交", reply_text: "", echo_results: false };
  if (config.options) { params.options = config.options; params.recommended_default = config.recommended_default || null; }
  if (config.option_meta) params.option_meta = config.option_meta;
  if (config.option_actions) params.option_actions = config.option_actions;
  if (ct === "matrix.compare+select") {
    params.dimensions = config.dimensions || ["价格", "时效"];
    params.values = (params.options || []).map((o, i) => params.dimensions.map((d, j) => Math.round((5 + ((i * 3 + j * 2) % 40) / 10) * 10) / 10));
  }
  if (ct === "scale.likert") params.likert = config.likert;
  if (ct === "form.structured") params.fields = config.fields;
  if (ct === "input.followup" || ct === "picker.location" || ct === "upload.file") params.placeholder = config.placeholder || "";
  if (ct === "slider.range") { const s = config.slider || {}; params.min = s.min ?? 0; params.max = s.max ?? 100; params.unit = s.unit || ""; }
  return { schema_version: "1.0.0", render_id: "ds-" + Math.random().toString(36).slice(2), component_type: ct,
    semantic_category: "collect", trigger_source: "model_tool_call", card_ref: null, params, group_mode: null, degraded_text: params.prompt };
}
const previewCtx = { sendEvent: () => {}, onCollectSubmit: () => UI.toast("预览不产生数据"), onControl: () => {}, titleInBubble: true };

// 单组件预览：下拉选组件，选一个看一个
const TRACK_ENV = { schema_version: "1.0.0", render_id: "ds-track", component_type: "track.map",
  semantic_category: "present", trigger_source: "model_tool_call", card_ref: null, group_mode: null,
  degraded_text: "物流轨迹", params: { title: "物流轨迹",
    current: { name: "宁波舟山港中转场", addr: "浙江省宁波市北仑区港区大道", lat: 29.935, lon: 121.844,
               status_text: "运输中", updated_text: "2 小时前更新" },
    nodes: [
      { time: "08-25 09:12", text: "已揽收（上海仓）", state: "done" },
      { time: "08-26 21:40", text: "干线运输中，到达宁波舟山港中转场", state: "current" },
      { time: "", text: "到达目的地网点，安排派送", state: "todo" },
    ] } };
let demoCt = "select.single";
function renderDemos() {
  const boxOne = document.getElementById("demoOne");
  boxOne.innerHTML = "";
  let node, sc;
  if (demoCt === "track.map") {
    sc = { q: "帮我查一下这票货到哪了", reply: "这票货正在干线运输，预计后天送达：" };
    try { node = Components.render(TRACK_ENV, previewCtx); } catch (e) { node = el("div", { class: "muted" }, ["暂不支持预览"]); }
  } else {
    sc = SCENES[demoCt];
    try { node = Components.render(buildEnvelope(demoCt, sc.config, sc.prompt), previewCtx); }
    catch (e) { node = el("div", { class: "muted" }, ["暂不支持预览"]); }
  }
  boxOne.appendChild(UI.chatMock({ question: sc.q, reply: sc.reply, node, prompt: demoCt === "track.map" ? "" : (sc.prompt || "") }));
}
function mountDemoControls() {
  document.getElementById("compSelMount").appendChild(UI.fancySelect({
    value: demoCt, width: "170px",
    options: [...Object.entries(SCENES).map(([ct, sc]) => [ct, sc.name]), ["track.map", "物流轨迹卡"]],
    onChange: (v) => { demoCt = v; renderDemos(); },
  }));
}

// ---------- 导入 / 编辑品牌风格：弹窗建卡片（名称 + 风格代码），创建后出现在列表，可编辑 / 删除 ----------
function brandDialog(existing, onClose) {
  const grid = document.getElementById("brandGrid");
  const host = document.getElementById("styleEditor");
  const COLORS = [
    ["Sky 蓝", "#1DA1F2", "#E9F1FB"], ["靛蓝", "#4F5BD5", "#EBEDFB"], ["翡翠绿", "#17A673", "#E4F5EF"],
    ["珊瑚橙", "#FF6B4A", "#FFEDE8"], ["琥珀金", "#D97706", "#FBF0DE"], ["石墨黑", "#334155", "#E8ECF1"],
  ];
  const RADII = [["直角", 4, 4], ["微圆", 10, 8], ["标准", 16, 12], ["圆润", 22, 16]];
  const BGS = [["纯白", "#FFFFFF", "#F7F8F8"], ["浅灰", "#F5F7FA", "#EDF1F5"], ["米白", "#FBF8F3", "#F3EEE6"]];
  const INKS = [["深灰", "#0F1B26"], ["纯黑", "#111111"]];
  const SIZES = [["标准", "13px"], ["偏大", "14px"]];
  const q0 = new URLSearchParams(location.search);
  const opts = { color: Number(q0.get("c")) || 0, radius: q0.get("r") != null ? Number(q0.get("r")) : 2, bg: 0, ink: 0, size: 0 };
  let mode = "options";
  let baseTokens = null;
  let codeApplied = null;

  function buildTokens() {
    const t = JSON.parse(JSON.stringify(baseTokens));
    const [, primary, weak] = COLORS[opts.color];
    const [, rc, rk] = RADII[opts.radius];
    const [, page, surface] = BGS[opts.bg];
    t.color = { ...t.color, primary, primary_weak: weak, bg_page: page, bg_surface: surface, text_primary: INKS[opts.ink][1] };
    t.radius = { ...(t.radius || {}), card: rc + "px", control: rk + "px", chip: "999px" };
    t.font = { ...(t.font || {}), size_base: SIZES[opts.size][1] };
    t.chart = { ...(t.chart || {}), categorical: [primary, ...((t.chart || {}).categorical || []).slice(1)] };
    t._options = { ...opts };
    return t;
  }
  const applyPreview = () => { try { Brand.apply(buildTokens()); renderDemos(); } catch (e) {} };

  const nameIn = el("input", { type: "text", maxlength: "20", value: existing?.brand_name || "", placeholder: "例如：远洋港航品牌风格" });
  const nameErr = el("div", { class: "field-error" });
  nameIn.oninput = () => nameErr.textContent = "";
  const err = el("div", { class: "field-error" });
  const codeTa = el("textarea", { spellcheck: "false", rows: 12,
    style: "font-family:var(--font-mono);font-size:var(--font-small);line-height:1.6;width:100%" });
  function parseCode() {
    err.textContent = "";
    let tokens;
    try { tokens = JSON.parse(codeTa.value); } catch (e) { err.textContent = "风格代码不是合法 JSON。（" + e.message + "）"; return null; }
    const color = tokens.color || {};
    const missing = ["primary", "bg_page", "bg_surface", "text_primary"].filter(k => !color[k]);
    if (missing.length) { err.textContent = "color 缺少必需项：" + missing.join(", "); return null; }
    return tokens;
  }

  // 选项面板
  const swRow = el("div", { class: "sw-row" }, COLORS.map(([nm, c], i) =>
    el("button", { type: "button", class: "sw" + (opts.color === i ? " on" : ""), title: nm, style: `background:${c}`,
      onclick: (e) => { opts.color = i; swRow.querySelectorAll(".sw").forEach((n, j) => n.classList.toggle("on", j === i)); applyPreview(); } })));
  const segRow = (items, key, labelOf) => {
    const box = el("div", { class: "segmented" });
    items.forEach((it, i) => box.appendChild(el("button", { type: "button", class: "seg" + (opts[key] === i ? " active" : ""),
      onclick: () => { opts[key] = i; box.querySelectorAll(".seg").forEach((n, j) => n.classList.toggle("active", j === i)); applyPreview(); } },
      [labelOf ? labelOf(it) : it[0]])));
    return box;
  };
  const optPanel = el("div", {}, [
    el("div", { class: "field" }, [el("span", { class: "label-text" }, ["主要配色"]), swRow]),
    el("div", { class: "field" }, [el("span", { class: "label-text" }, ["圆角"]), segRow(RADII, "radius")]),
    el("div", { class: "field" }, [el("span", { class: "label-text" }, ["组件底色"]), segRow(BGS, "bg")]),
    el("div", { class: "grid cols-2" }, [
      el("div", { class: "field" }, [el("span", { class: "label-text" }, ["正文字色"]), segRow(INKS, "ink")]),
      el("div", { class: "field" }, [el("span", { class: "label-text" }, ["字号"]), segRow(SIZES, "size")]),
    ]),
    el("div", { class: "muted", style: "font-size:var(--font-caption)" }, ["调整任一选项，右侧组件预览即时更新"]),
  ]);
  // 代码面板
  const codePanel = el("div", { hidden: true }, [
    el("div", { style: "display:flex;align-items:center;gap:8px;margin-bottom:6px" }, [
      el("span", { class: "label-text", style: "margin:0" }, ["风格代码（design token JSON）"]),
      el("div", { style: "flex:1" }),
      el("button", { class: "btn small ghost", type: "button", onclick: () => {
        const t = JSON.parse(JSON.stringify(baseTokens));
        t.brand_id = "my-brand"; t.brand_name = nameIn.value.trim() || "我的品牌风格";
        delete t._options;
        codeTa.value = JSON.stringify(t, null, 2); err.textContent = "";
      } }, ["填入示例"]),
      el("button", { class: "btn small primary", type: "button", onclick: () => {
        const t = parseCode();
        if (!t) return;
        codeApplied = t;
        Brand.apply(t); renderDemos();
        UI.toast("已应用到右侧预览");
      } }, ["应用"]),
    ]),
    codeTa,
    el("div", { class: "muted", style: "font-size:var(--font-caption);margin-top:4px" }, ["点「应用」把代码效果打到右侧预览器"]),
  ]);
  const modeTabs = el("div", { class: "segmented", style: "margin-bottom:14px" },
    [["options", "选项配置"], ["code", "代码导入"]].map(([k, nm]) =>
      el("button", { type: "button", class: "seg" + (mode === k ? " active" : ""), onclick: (e) => {
        mode = k;
        modeTabs.querySelectorAll(".seg").forEach(n => n.classList.remove("active"));
        e.currentTarget.classList.add("active");
        optPanel.hidden = k !== "options"; codePanel.hidden = k !== "code";
        if (k === "options") applyPreview();
      } }, [nm])));

  function close() {
    host.hidden = true; host.innerHTML = "";
    grid.style.display = "";
    Brand.load(previewFile).then(() => renderDemos()).catch(() => {});
    onClose && onClose();
  }
  host.innerHTML = "";
  host.appendChild(el("div", { class: "style-ed" }, [
    el("div", { style: "font-weight:700;margin-bottom:12px" }, [existing ? `编辑「${existing.brand_name}」` : "新建组件风格"]),
    el("label", { class: "field" }, [el("span", { class: "label-text req" }, ["风格名称"]), nameIn, nameErr]),
    modeTabs, optPanel, codePanel, err,
    el("div", { style: "display:flex;justify-content:flex-end;gap:10px;margin-top:14px;border-top:1px solid var(--border);padding-top:12px" }, [
      el("button", { class: "btn", onclick: close }, ["取消"]),
      el("button", { class: "btn primary", onclick: async (e) => {
        const name = nameIn.value.trim();
        if (!name) { nameErr.textContent = "请填写风格名称"; nameIn.focus(); return; }
        let tokens;
        if (mode === "options") tokens = buildTokens();
        else { tokens = parseCode(); if (!tokens) return; }
        tokens.brand_name = name;
        let bid = existing ? existing.brand_id : ((tokens.brand_id || "").trim() || "brand-" + Math.random().toString(36).slice(2, 6));
        if (!existing && brands.find(b => b.brand_id === bid)) bid = bid + "-" + Math.random().toString(36).slice(2, 5);
        await UI.withBusy(e.currentTarget, async () => {
          try {
            await UI.api("/api/brands", { method: "POST", body: { brand_id: bid, brand_name: name, tokens } });
            brands = (await UI.api("/api/brands")).brands;
            const saved = brands.find(b => b.brand_id === bid);
            if (saved) previewFile = saved.file;
            host.hidden = true; host.innerHTML = ""; grid.style.display = "";
            renderBrands(); renderDemos();
            UI.toast(existing ? "风格已更新" : "风格已创建，在「产品管理」里配给产品即可生效");
            onClose && onClose();
          } catch (e2) { err.textContent = e2.data?.error || e2.message; }
        }, "保存中……");
      } }, [existing ? "保存修改" : "保存风格"]),
    ]),
  ]));
  grid.style.display = "none"; host.hidden = false;

  // 初始化：取默认 token 作底；编辑时回填（有 _options 走选项模式，否则代码模式）
  (async () => {
    try { baseTokens = await (await fetch("./brand/brand-tokens.default.json")).json(); }
    catch (e) { baseTokens = { color: {}, chart: {} }; }
    if (existing) {
      try {
        const t = await (await fetch("./brand/" + existing.file)).json();
        if (t._options) {
          Object.assign(opts, t._options);
          swRow.querySelectorAll(".sw").forEach((n, j) => n.classList.toggle("on", j === opts.color));
          [[RADII, "radius"], [BGS, "bg"], [INKS, "ink"], [SIZES, "size"]].forEach(() => {});
          // 重建选项行的激活态
          optPanel.querySelectorAll(".segmented").forEach((seg, idx) => {
            const key = ["radius", "bg", "ink", "size"][idx];
            seg.querySelectorAll(".seg").forEach((n, j) => n.classList.toggle("active", j === opts[key]));
          });
          applyPreview();
        } else {
          mode = "code";
          modeTabs.querySelectorAll(".seg").forEach((n, j) => n.classList.toggle("active", j === 1));
          optPanel.hidden = true; codePanel.hidden = false;
          codeTa.value = JSON.stringify(t, null, 2);
          Brand.apply(t); renderDemos();
        }
      } catch (e) {}
    } else applyPreview();
  })();
}

// ---------- 风格预设 ----------


function renderBrands() {
  const grid = document.getElementById("brandGrid");
  grid.innerHTML = "";
  brands.forEach(b => {
    const users = products.filter(p => p.brand_file === b.file);
    const isSel = b.file === previewFile;
    const editBtn = (b.brand_id !== "default")
      ? el("span", { class: "sel-ico del-ico", style: "right:38px" }, [UI.iconBtn("edit", "编辑此风格", (e) => {
          e?.stopPropagation?.();
          brandDialog(b);
        })])
      : null;
    const delBtn = (b.brand_id !== "default")
      ? el("span", { class: "sel-ico del-ico" }, [UI.iconBtn("trash", "删除此风格", async (e) => {
          e?.stopPropagation?.();
          const ok = await UI.confirm("删除风格", `删除「${b.brand_name || b.file}」？使用它的产品将回退到默认风格，不可恢复。`, { okText: "删除", danger: true });
          if (!ok) return;
          try {
            await UI.api("/api/brands/delete", { method: "POST", body: { file: b.file } });
            brands = (await UI.api("/api/brands")).brands;
            renderBrands(); UI.toast("已删除");
          } catch (err) { UI.toast(err.data?.error || err.message, true); }
        })])
      : null;
    const cardEl = el("div", {
      class: "brand-card" + (isSel ? " selected" : ""), role: "radio", "aria-checked": isSel ? "true" : "false", tabindex: "0",
      onclick: () => previewBrand(b),
      onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); previewBrand(b); } },
    }, [
      editBtn, delBtn,
      el("div", { class: "bname" }, [b.brand_name || b.file,
        users.length ? el("span", { class: "chip blue", title: "使用中的产品：" + users.map(p => p.name).join("、") }, [`${users.length} 个产品使用`]) : null]),
      el("div", { class: "bsub" }, [b.brand_id === "default" ? "平台默认风格" : "已导入的品牌风格"]),
    ]);
    if (delBtn) delBtn.onclick = (e) => e.stopPropagation();
    if (editBtn) editBtn.onclick = (e) => e.stopPropagation();
    grid.appendChild(cardEl);
  });
  // 新增入口：列表末尾一张虚线卡，点击弹出导入编辑（保存后成为正式卡片）
  const addCard = el("div", { class: "brand-card add-card", role: "button", tabindex: "0" }, [
    el("div", { class: "bname" }, [UI.icon("plus", 14), "新增组件风格"]),
    el("div", { class: "bsub" }, ["选项配置，或粘贴风格代码导入"]),
  ]);
  const openAdd = () => brandDialog(null);
  addCard.onclick = openAdd;
  addCard.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openAdd(); } };
  grid.appendChild(addCard);
}

async function previewBrand(b) {
  try {
    const tokens = await (await fetch("./brand/" + b.file)).json();
    Brand.apply(tokens);
    previewFile = b.file;
    renderBrands(); renderDemos();
  } catch (e) { UI.toast("加载风格失败：" + e.message, true); }
}


// 初始化
(async function init() {
  await new Promise(r => { const t = setInterval(() => { if (Brand.get()) { clearInterval(t); r(); } }, 60); setTimeout(() => { clearInterval(t); r(); }, 2500); });
  try { brands = (await UI.api("/api/brands")).brands; } catch (e) { brands = []; }
  try { products = (await UI.api("/api/products")).products || []; } catch (e) { products = []; }
  renderBrands();
  mountDemoControls();
  renderDemos();
  // 走查深链：?new=1 直接打开风格编辑器
  if (new URLSearchParams(location.search).get("new")) brandDialog(null);
})();
</script>
