function buildEnvelope(ct, config, prompt) {
  const params = { prompt: ct === "entry.link" ? (prompt || "") : (prompt || "请选择"), submit_label: ct === "commerce.order" ? "去下单" : "提交", reply_text: "", echo_results: false };
  if (config.options) { params.options = config.options; params.recommended_default = config.recommended_default || null; }
  if (config.option_meta) params.option_meta = config.option_meta;
  if (config.option_actions) params.option_actions = config.option_actions;
  if (ct === "matrix.compare+select") {
    params.dimensions = config.dimensions || ["价格", "时效"];
    params.values = (params.options || []).map((o, i) => params.dimensions.map((d, j) => Math.round((5 + ((i * 3 + j * 2) % 40) / 10) * 10) / 10));
  }
  if (ct === "scale.likert") params.likert = config.likert;
  if (ct === "form.structured") params.fields = config.fields;
  if (ct === "input.followup" || ct === "picker.location" || ct === "upload.file") params.placeholder = config.placeholder || "";
  if (ct === "slider.range") { const s = config.slider || {}; params.min = s.min ?? 0; params.max = s.max ?? 100; params.unit = s.unit || ""; }
  return { schema_version: "1.0.0", render_id: "ds-" + Math.random().toString(36).slice(2), component_type: ct,

      ? el("span", { class: "sel-ico del-ico" }, [UI.iconBtn("trash", "删除此主题", async (e) => {
          e?.stopPropagation?.();
          const ok = await UI.confirm("删除主题", `删除「${b.brand_name || b.file}」？使用它的产品将回退到默认主题，不可恢复。`, { okText: "删除", danger: true });
          if (!ok) return;
          try {
            await UI.api("/api/brands/delete", { method: "POST", body: { file: b.file } });
            brands = (await UI.api("/api/brands")).brands;
            renderBrands(); UI.emit("brands-changed"); UI.toast("已删除");
          } catch (err) { UI.toast(err.data?.error || err.message, true); }
        })])
      : null;
    const cardEl = el("div", {
      class: "brand-card" + (isSel ? " selected" : ""), role: "radio", "aria-checked": isSel ? "true" : "false", tabindex: "0",
      onclick: () => previewBrand(b),
      onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); previewBrand(b); } },
    }, [
      editBtn, delBtn,
      el("div", { class: "bname" }, [b.brand_name || b.file,
        users.length ? el("span", { class: "chip blue", title: "使用中的产品：" + users.map(p => p.name).join("、") }, [`${users.length} 个产品使用`]) : null]),
      el("div", { class: "bsub" }, [b.brand_id === "default" ? "平台默认主题" : "自定义主题"]),
    ]);
    if (delBtn) delBtn.onclick = (e) => e.stopPropagation();
    if (editBtn) editBtn.onclick = (e) => e.stopPropagation();
    grid.appendChild(cardEl);
  });
}

function usedByCount(file) { return (products || []).filter(p => p.brand_file === file).length; }

async function previewBrand(b) {
  try {
    const tokens = await (await fetch("./brand/" + b.file)).json();
    Brand.apply(tokens);
    previewFile = b.file;
    renderBrands(); renderDemos();
  } catch (e) { UI.toast("加载风格失败：" + e.message, true); }
}


// 初始化
(async function init() {
  await new Promise(r => { const t = setInterval(() => { if (Brand.get()) { clearInterval(t); r(); } }, 60); setTimeout(() => { clearInterval(t); r(); }, 2500); });
  try { brands = (await UI.api("/api/brands")).brands; } catch (e) { brands = []; }
  try { products = (await UI.api("/api/products")).products || []; } catch (e) { products = []; }
  renderBrands();
  const nb = document.getElementById("newBrandBtn");
  nb.disabled = false;
  nb.onclick = () => brandDialog(null);
  mountDemoControls();
  renderDemos();
  // 走查深链：?new=1 直接打开风格编辑器
  if (new URLSearchParams(location.search).get("new")) brandDialog(null);
})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});</script>
