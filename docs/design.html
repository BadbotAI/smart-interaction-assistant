function buildEnvelope(ct, config, prompt) {
  const params = { prompt: ct === "entry.link" ? (prompt || "") : (prompt || "请选择"), submit_label: ct === "commerce.order" ? "去下单" : "提交", reply_text: "", echo_results: false };
  if (config.options) { params.options = config.options; params.recommended_default = config.recommended_default || null; }
  if (config.option_meta) params.option_meta = config.option_meta;
  if (config.option_actions) params.option_actions = config.option_actions;
  if (ct === "matrix.compare+select") {
    params.dimensions = config.dimensions || ["价格", "时效"];
    params.values = (params.options || []).map((o, i) => params.dimensions.map((d, j) => Math.round((5 + ((i * 3 + j * 2) % 40) / 10) * 10) / 10));
  }
  if (ct === "scale.likert") params.likert = config.likert;
  if (ct === "form.structured") params.fields = config.fields;
  if (ct === "input.followup" || ct === "picker.location" || ct === "upload.file") params.placeholder = config.placeholder || "";
  if (ct === "slider.range") { const s = config.slider || {}; params.min = s.min ?? 0; params.max = s.max ?? 100; params.unit = s.unit || ""; }
  return { schema_version: "1.0.0", render_id: "ds-" + Math.random().toString(36).slice(2), component_type: ct,
    semantic_category: "collect", trigger_source: "model_tool_call", card_ref: null, params, group_mode: null, degraded_text: params.prompt };
}

    { name: "松绿", light: { primary: "#1E7A50", primary_weak: "#E7F4EC", accent: "#A87F2C", ring: "#1E7A50",
        bg_page: "#FFFFFF", bg_surface: "#F7FAF8", border: "#DEE9E1",
        text_primary: "#182720", text_secondary: "#4C5F55", text_muted: "#7E8F86",
        success: "#1E7A50", warning: "#C98A0B", danger: "#DC4C4C" },
      dark: { primary: "#34A873", primary_weak: "#10291D", accent: "#C3A050", ring: "#34A873",
        bg_page: "#0E1512", bg_surface: "#16211B", border: "#283A2F",
        text_primary: "#EAF3EE", text_secondary: "#A2B8AB", text_muted: "#6D8277",
        success: "#34A873", warning: "#DCA43B", danger: "#ED6A6A" },
      chart: ["#1E7A50", "#A87F2C", "#4C6FE7", "#C74E68", "#58A08C"] },
  ];
  const COLOR_GROUPS = [
    ["品牌色", [["primary", "主色"], ["primary_weak", "主色弱底"], ["accent", "强调色"], ["ring", "焦点环"]]],
    ["界面色", [["bg_page", "画布底色"], ["bg_surface", "卡片面"], ["border", "描边"]]],
    ["文字色", [["text_primary", "正文"], ["text_secondary", "次级"], ["text_muted", "辅助"]]],
    ["状态色", [["success", "成功"], ["warning", "警告"], ["danger", "危险"]]],
  ];
  const RADII = [["直角", 2, 2], ["轻微", 8, 6], ["标准", 16, 12], ["圆润", 22, 16], ["全圆", 28, 22]];
  const FONTS = [
    ["现代黑体", '-apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif'],
    ["典雅宋体", '"Songti SC", "STSong", "SimSun", serif'],
    ["圆润友好", '"Yuanti SC", "PingFang SC", "Microsoft YaHei", sans-serif'],
    ["极客等宽", '"SF Mono", "JetBrains Mono", Consolas, monospace'],
  ];
  const WEIGHTS = [["常规", "400"], ["中等", "500"], ["半粗", "600"]];
  const SIZES = [["12px", "12px"], ["13px", "13px"], ["14px", "14px"], ["15px", "15px"]];
  const SHADOWS = [["无", "none"], ["轻", "0 1px 3px rgba(15,27,38,.08)"], ["中", "0 4px 12px rgba(15,27,38,.12)"], ["重", "0 8px 24px rgba(15,27,38,.18)"]];
  const DENSITIES = [["紧凑", "compact"], ["标准", "regular"], ["宽松", "loose"]];

  const q0 = new URLSearchParams(location.search);
  const opts = { preset: Number(q0.get("c")) || 0, radius: q0.get("r") != null ? Number(q0.get("r")) : 2,
    font: 0, weight: 0, size: 1, shadow: 1, density: 1 };
  let editMode = "light";                 // 当前编辑的明暗模式
  // token 状态：明暗两套 + 图表序列（预设整套填充；之后任意 token 可单独细调）
  let tok = null;
  function loadPreset(i) {
    const pz = THEME_PRESETS[i];
    tok = { light: { ...pz.light }, dark: { ...pz.dark }, chart: [...pz.chart] };
  }
  loadPreset(opts.preset);
  let baseTokens = null;

  function buildTokens() {
    const t = JSON.parse(JSON.stringify(baseTokens));
    const [, rc, rk] = RADII[opts.radius];
    t.color = { ...t.color, ...tok.light };
    t.color_dark = { ...tok.dark };       // 明暗双份：SDK 出包与预览按模式取
    t.radius = { ...(t.radius || {}), card: rc + "px", control: rk + "px", chip: "999px" };
    t.font = { ...(t.font || {}), family: FONTS[opts.font][1], weight_base: WEIGHTS[opts.weight][1], size_base: SIZES[opts.size][1] };
    t.shadow = SHADOWS[opts.shadow][1];
    t.density = DENSITIES[opts.density][1];
    t.chart = { ...(t.chart || {}), categorical: [...tok.chart, ...((t.chart || {}).categorical || []).slice(5)] };
    t._options = { ...opts };
    return t;
  }
  const applyPreview = () => {
    try {
      const t = buildTokens();
      if (editMode === "dark") t.color = { ...t.color, ...t.color_dark };
      Brand.apply(t); renderDemos();
    } catch (e) {}
  };

  const nameIn = el("input", { type: "text", maxlength: "20", value: existing?.brand_name || "", placeholder: "例如：远洋港航品牌风格" });
  const nameErr = el("div", { class: "field-error" });
  nameIn.oninput = () => nameErr.textContent = "";
  const err = el("div", { class: "field-error" });

  // —— 预设选择（整套起步） ——
  const palGrid = el("div", { class: "pal-grid" });
  function drawPals() {
    palGrid.innerHTML = "";
    THEME_PRESETS.forEach((pz, i) => {
      const c0 = editMode === "dark" ? pz.dark : pz.light;
      palGrid.appendChild(el("button", { type: "button",
        class: "pal-card" + (opts.preset === i ? " on" : "") + (editMode === "dark" ? " dark" : ""), title: pz.name + "（点击应用整套，之后可逐项微调）",
        onclick: () => { opts.preset = i; loadPreset(i); drawPals(); drawTokens(); applyPreview(); } }, [
        el("div", { class: "pal-name" }, [pz.name]),
        el("div", { class: "pal-row" }, [c0.primary, c0.primary_weak, c0.accent, c0.success, c0.danger, c0.bg_page].map(cx => el("i", { style: `background:${cx}` }))),
      ]));
    });
  }
  drawPals();

  // —— 明暗模式 tab（编辑与预览联动） ——
  const modeSeg = el("div", { class: "segmented" });
  function drawModeSeg() {
    modeSeg.innerHTML = "";
    [["light", "浅色模式"], ["dark", "深色模式"]].forEach(([k, nm]) => modeSeg.appendChild(el("button", {
      type: "button", class: "seg" + (editMode === k ? " active" : ""),
      onclick: () => { editMode = k; drawModeSeg(); drawPals(); drawTokens(); applyPreview(); } }, [nm])));
  }
  drawModeSeg();

  // —— 逐 token 细颗粒度编辑（Figma 式：分组 · 色块 + HEX 双向同步） ——
  const tokenPanel = el("div", {});
  function drawTokens() {
    tokenPanel.innerHTML = "";
    const cur = tok[editMode];
    COLOR_GROUPS.forEach(([gname, items]) => {
      const rows = el("div", { class: "tok-rows" });
      items.forEach(([key, label]) => {
        const val = cur[key] || "#000000";
        const ci = el("input", { type: "color", value: /^#([0-9a-f]{6})$/i.test(val) ? val : "#000000", class: "tok-chip", title: label });
        const hex = el("input", { type: "text", value: val, class: "tok-hex", spellcheck: "false", maxlength: "7" });
        ci.oninput = () => { cur[key] = ci.value; hex.value = ci.value; applyPreview(); };
        hex.onchange = () => {
          let v = hex.value.trim();
          if (/^[0-9a-f]{6}$/i.test(v)) v = "#" + v;
          if (/^#[0-9a-f]{6}$/i.test(v)) { cur[key] = v; ci.value = v; applyPreview(); }
          else { hex.value = cur[key]; UI.toast("请输入合法 HEX 色值，如 #1DA1F2", true); }
        };
        rows.appendChild(el("div", { class: "tok-row" }, [ci,
          el("span", { class: "tok-name" }, [label]),
          el("span", { class: "tok-key num" }, [key]), hex]));
      });
      tokenPanel.appendChild(el("details", { class: "tok-group", ...(gname === "品牌色" ? { open: "" } : {}) }, [
        el("summary", {}, [gname]), rows]));
    });
    // 图表序列色（明暗共用）
    const rows = el("div", { class: "tok-rows" });
    tok.chart.forEach((cx, i) => {
      const ci = el("input", { type: "color", value: cx, class: "tok-chip" });
      const hex = el("input", { type: "text", value: cx, class: "tok-hex", spellcheck: "false", maxlength: "7" });
      ci.oninput = () => { tok.chart[i] = ci.value; hex.value = ci.value; applyPreview(); };
      hex.onchange = () => {
        let v = hex.value.trim();
        if (/^[0-9a-f]{6}$/i.test(v)) v = "#" + v;
        if (/^#[0-9a-f]{6}$/i.test(v)) { tok.chart[i] = v; ci.value = v; applyPreview(); }
        else hex.value = tok.chart[i];
      };
      rows.appendChild(el("div", { class: "tok-row" }, [ci,
        el("span", { class: "tok-name" }, ["序列 " + (i + 1)]),
        el("span", { class: "tok-key num" }, ["chart-" + (i + 1)]), hex]));
    });
    tokenPanel.appendChild(el("details", { class: "tok-group" }, [
      el("summary", {}, ["图表序列色（展示类组件用）"]), rows]));
  }
  drawTokens();

  // —— 圆角 / 字体 / 字重 / 字号 / 阴影 / 密度（沿用可视化控件） ——
  const radLab = el("span", { class: "rad-lab" }, [RADII[opts.radius][0]]);
  const radIn = el("input", { type: "range", min: "0", max: String(RADII.length - 1), step: "1", value: String(opts.radius) });
  const radFill = () => radIn.style.setProperty("--fill", (Number(radIn.value) / (RADII.length - 1) * 100) + "%");
  radFill();
  radIn.oninput = () => { opts.radius = Number(radIn.value); radLab.textContent = RADII[opts.radius][0]; radFill(); applyPreview(); };
  const radTicks = el("div", { class: "rad-ticks" }, RADII.map(() => el("span", {})));
  const wBox = el("div", { class: "fs-cards" });
  const sBox = el("div", { class: "fs-cards" });
  function drawFsCards() {
    wBox.innerHTML = ""; sBox.innerHTML = "";
    WEIGHTS.forEach(([nm, w], i) => wBox.appendChild(el("button", { type: "button",
      class: "fs-card" + (opts.weight === i ? " on" : ""),
      onclick: () => { opts.weight = i; drawFsCards(); applyPreview(); } }, [
      el("span", { class: "fs-demo", style: `font-weight:${w}` }, ["永A"]),
      el("span", { class: "fs-name" }, [nm]),
    ])));
    SIZES.forEach(([nm, sz], i) => sBox.appendChild(el("button", { type: "button",
      class: "fs-card" + (opts.size === i ? " on" : ""),
      onclick: () => { opts.size = i; drawFsCards(); applyPreview(); } }, [
      el("span", { class: "fs-demo", style: `font-size:${sz}` }, ["永A"]),
      el("span", { class: "fs-name" }, [nm]),
    ])));
  }
  drawFsCards();
  const shadowSeg = el("div", { class: "segmented" });
  const densSeg = el("div", { class: "segmented" });
  function drawSegs() {
    shadowSeg.innerHTML = ""; densSeg.innerHTML = "";
    SHADOWS.forEach(([nm], i) => shadowSeg.appendChild(el("button", { type: "button",
      class: "seg" + (opts.shadow === i ? " active" : ""),
      onclick: () => { opts.shadow = i; drawSegs(); applyPreview(); } }, [nm])));
    DENSITIES.forEach(([nm], i) => densSeg.appendChild(el("button", { type: "button",
      class: "seg" + (opts.density === i ? " active" : ""),
      onclick: () => { opts.density = i; drawSegs(); applyPreview(); } }, [nm])));
  }
  drawSegs();

  function segRowFonts() {
    const box = el("div", { class: "segmented" });
    FONTS.forEach((it, i) => box.appendChild(el("button", { type: "button", class: "seg" + (opts.font === i ? " active" : ""),
      onclick: () => { opts.font = i; box.querySelectorAll(".seg").forEach((n, j) => n.classList.toggle("active", j === i)); applyPreview(); } },
      [it[0]])));
    return box;
  }
  const optPanel = el("div", {}, [
    el("div", { class: "field" }, [
      el("div", { style: "display:flex;align-items:center;gap:10px;margin-bottom:6px" }, [
        el("span", { class: "label-text", style: "margin:0" }, ["主题预设",
          UI.help("整套语义 token 起步（含明暗两份色板与图表序列色）；选中后任意 token 可在下方逐项微调")]),
        el("div", { style: "flex:1" }),
        modeSeg,
      ]),
      palGrid,
    ]),
    el("div", { class: "field" }, [el("span", { class: "label-text" }, ["颜色 token",
      UI.help("Figma 式细颗粒度：每个语义 token 独立可改（色块或 HEX），当前编辑" + "模式随上方明暗切换")]), tokenPanel]),
    el("div", { class: "field" }, [el("span", { class: "label-text" }, ["圆角"]),
      el("div", { class: "rad-row" }, [el("div", { class: "rad-track-wrap" }, [radIn, radTicks]), radLab])]),
    el("div", { class: "field" }, [el("span", { class: "label-text" }, ["字体"]), segRowFonts()]),
    el("div", { class: "field" }, [el("span", { class: "label-text" }, ["正文字重"]), wBox]),
    el("div", { class: "field" }, [el("span", { class: "label-text" }, ["正文字号"]), sBox]),
    el("div", { class: "form-grid" }, [
      el("div", { class: "field" }, [el("span", { class: "label-text" }, ["阴影",
        UI.help("组件卡片的投影档位；组件级可再覆盖")]), shadowSeg]),
      el("div", { class: "field" }, [el("span", { class: "label-text" }, ["密度",
        UI.help("组件内边距与行距的整体缩放：紧凑 / 标准 / 宽松")]), densSeg]),
    ]),
  ]);
  // v2：品牌风格只走选项定义（代码导入下线）
  const modeTabs = el("div", {});

  function close() {
    host.hidden = true; host.innerHTML = "";
    document.getElementById("editorCard").hidden = true;
    document.getElementById("libCollapsed").hidden = true;
    grid.style.display = "";
    window._editingStyle = false;
    Brand.load(previewFile).then(() => renderDemos()).catch(() => {});
    onClose && onClose();
  }
  host.innerHTML = "";
  host.appendChild(el("div", { class: "style-ed" }, [
    el("div", { style: "font-weight:700;margin-bottom:12px" }, [existing ? `编辑「${existing.brand_name}」` : "新建组件风格"]),
    el("label", { class: "field" }, [el("span", { class: "label-text req" }, ["风格名称"]), nameIn, nameErr]),
    modeTabs, optPanel, err,
    el("div", { style: "display:flex;justify-content:flex-end;gap:10px;margin-top:14px;border-top:1px solid var(--border);padding-top:12px" }, [
      el("button", { class: "btn", onclick: close }, ["取消"]),
      el("button", { class: "btn primary", onclick: async (e) => {
        const name = nameIn.value.trim();
        if (!name) { nameErr.textContent = "请填写风格名称"; nameIn.focus(); return; }
        const tokens = buildTokens();
        tokens.brand_name = name;
        // 新建一律生成新 id：baseTokens 克隆自当前预览品牌，其 brand_id（如 default）绝不能继承——否则覆盖既有风格
        let bid = existing ? existing.brand_id : "brand-" + Math.random().toString(36).slice(2, 8);
        if (!existing && brands.find(b => b.brand_id === bid)) bid = bid + "-" + Math.random().toString(36).slice(2, 5);
        await UI.withBusy(e.currentTarget, async () => {
          try {
            await UI.api("/api/brands", { method: "POST", body: { brand_id: bid, brand_name: name, tokens } });
            brands = (await UI.api("/api/brands")).brands;
            const saved = brands.find(b => b.brand_id === bid);
            if (saved) previewFile = saved.file;
            host.hidden = true; host.innerHTML = "";
            document.getElementById("editorCard").hidden = true;
            document.getElementById("libCollapsed").hidden = true;
            grid.style.display = "";
            window._editingStyle = false;
            renderBrands(); renderDemos();
            UI.toast(existing ? "风格已更新" : "风格已创建，在「产品管理」里配给产品即可生效");
            onClose && onClose();
          } catch (e2) { err.textContent = e2.data?.error || e2.message; }
        }, "保存中……");
      } }, [existing ? "保存修改" : "保存风格"]),
    ]),
  ]));
  grid.style.display = "none";
  document.getElementById("libCollapsed").hidden = false;
  document.getElementById("editorCard").hidden = false;
  host.hidden = false;
  window._editingStyle = true;

  // 初始化：取默认 token 作底；编辑时回填（有 _options 走选项模式，否则代码模式）
  (async () => {
    try { baseTokens = await (await fetch("./brand/brand-tokens.default.json")).json(); }
    catch (e) { baseTokens = { color: {}, chart: {} }; }
    if (existing) {
      try {
        const t = await (await fetch("./brand/" + existing.file)).json();
        if (t._options && t._options.palette !== undefined) {
          Object.assign(opts, t._options);
          drawPals(); drawFsCards();
          radIn.value = String(opts.radius); radLab.textContent = RADII[opts.radius][0]; radFill();
          optPanel.querySelectorAll(".field").forEach(f => {
            const lab = f.querySelector(".label-text");
            if (lab && lab.textContent === "字体") f.querySelectorAll(".seg").forEach((n, j) => n.classList.toggle("active", j === opts.font));
          });
          applyPreview();
        } else {
          // 旧代码导入的风格：无选项快照，按默认选项进入编辑（保存后转为选项定义）
          Brand.apply(t); renderDemos();
        }
      } catch (e) {}
    } else { applyPreview(); setTimeout(applyPreview, 900); }
  })();
}

// ---------- 风格预设 ----------


function renderBrands() {
  const grid = document.getElementById("brandGrid");
  grid.innerHTML = "";
  brands.forEach(b => {
    const users = products.filter(p => p.brand_file === b.file);
    const isSel = b.file === previewFile;
    const editBtn = (b.brand_id !== "default")
      ? el("span", { class: "sel-ico del-ico", style: "right:38px" }, [UI.iconBtn("edit", "编辑此风格", (e) => {
          e?.stopPropagation?.();
          brandDialog(b);
        })])
      : null;
    const delBtn = (b.brand_id !== "default")
      ? el("span", { class: "sel-ico del-ico" }, [UI.iconBtn("trash", "删除此风格", async (e) => {
          e?.stopPropagation?.();
          const ok = await UI.confirm("删除风格", `删除「${b.brand_name || b.file}」？使用它的产品将回退到默认风格，不可恢复。`, { okText: "删除", danger: true });
          if (!ok) return;
          try {
            await UI.api("/api/brands/delete", { method: "POST", body: { file: b.file } });
            brands = (await UI.api("/api/brands")).brands;
            renderBrands(); UI.toast("已删除");
          } catch (err) { UI.toast(err.data?.error || err.message, true); }
        })])
      : null;
    const cardEl = el("div", {
      class: "brand-card" + (isSel ? " selected" : ""), role: "radio", "aria-checked": isSel ? "true" : "false", tabindex: "0",
      onclick: () => previewBrand(b),
      onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); previewBrand(b); } },
    }, [
      editBtn, delBtn,
      el("div", { class: "bname" }, [b.brand_name || b.file,
        users.length ? el("span", { class: "chip blue", title: "使用中的产品：" + users.map(p => p.name).join("、") }, [`${users.length} 个产品使用`]) : null]),
      el("div", { class: "bsub" }, [b.brand_id === "default" ? "平台默认风格" : "已导入的品牌风格"]),
    ]);
    if (delBtn) delBtn.onclick = (e) => e.stopPropagation();
    if (editBtn) editBtn.onclick = (e) => e.stopPropagation();
    grid.appendChild(cardEl);
  });
  // 新增入口：列表末尾一张虚线卡，点击弹出导入编辑（保存后成为正式卡片）
  const addCard = el("div", { class: "brand-card add-card", role: "button", tabindex: "0" }, [
    el("div", { class: "bname" }, [UI.icon("plus", 14), "新增组件风格"]),
    el("div", { class: "bsub" }, ["全选项定义：配色 / 明暗 / 圆角 / 字体 / 阴影 / 密度"]),
  ]);
  const openAdd = () => brandDialog(null);
  addCard.onclick = openAdd;
  addCard.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openAdd(); } };
  grid.appendChild(addCard);
}

function usedByCount(file) { return (products || []).filter(p => p.brand_file === file).length; }

async function previewBrand(b) {
  try {
    const tokens = await (await fetch("./brand/" + b.file)).json();
    Brand.apply(tokens);
    previewFile = b.file;
    renderBrands(); renderDemos();
  } catch (e) { UI.toast("加载风格失败：" + e.message, true); }
}


// 初始化
(async function init() {
  await new Promise(r => { const t = setInterval(() => { if (Brand.get()) { clearInterval(t); r(); } }, 60); setTimeout(() => { clearInterval(t); r(); }, 2500); });
  try { brands = (await UI.api("/api/brands")).brands; } catch (e) { brands = []; }
  try { products = (await UI.api("/api/products")).products || []; } catch (e) { products = []; }
  renderBrands();
  mountDemoControls();
  renderDemos();
  // 走查深链：?new=1 直接打开风格编辑器
  if (new URLSearchParams(location.search).get("new")) brandDialog(null);
})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});</script>
</body>
