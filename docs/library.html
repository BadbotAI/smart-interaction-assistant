<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%231DA1F2'/%3E%3Crect x='10.5' y='3.6' width='9.6' height='7.3' rx='2.7' fill='none' stroke='%23fff' stroke-width='1.5' opacity='0.75'/%3E%3Cpath d='M3.4 12a3.7 3.7 0 0 1 3.7-3.7h6a3.7 3.7 0 0 1 3.7 3.7v2.3a3.7 3.7 0 0 1-3.7 3.7H9.5l-3.1 2.6c-.55.46-1.3.07-1.3-.64v-2.4A3.7 3.7 0 0 1 3.4 14.3z' fill='%23fff'/%3E%3Ccircle cx='7.4' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='10.25' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='13.1' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3C/svg%3E">
<title>组件库 · 智能交互平台</title>
<link rel="stylesheet" href="./shared.css?v=07b455bd">
<link rel="prefetch" href="./audit.html"><link rel="prefetch" href="./cards.html"><link rel="prefetch" href="./dashboard.html"><link rel="prefetch" href="./design.html"><link rel="prefetch" href="./embed-demo.html"><link rel="prefetch" href="./index.html"><link rel="prefetch" href="./library.html"><link rel="prefetch" href="./playground.html"><link rel="prefetch" href="./products.html">
<style>
  .tpl-card { display: flex; flex-direction: column; gap: 8px; }
  .tpl-head { display: flex; align-items: center; gap: 8px; }
  .tpl-name { font-weight: 700; font-size: var(--font-title); }
  .tpl-name-link { border: none; background: none; padding: 0; cursor: pointer; color: var(--text-primary); font-family: inherit; }
  .tpl-name-link:hover { color: var(--primary); text-decoration: underline; text-underline-offset: 3px; }
  .tpl-desc { color: var(--text-secondary); font-size: var(--font-base); line-height: 1.6; }
  .tpl-preview { background: var(--bg-sunken); border-radius: 10px; padding: 14px; height: 230px; overflow: hidden; position: relative; }
  .tpl-preview::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 44px;
    background: linear-gradient(transparent, var(--bg-sunken)); pointer-events: none; }
  .tpl-card { height: 400px; }
  .tpl-desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 44px; }
  .lib-detail-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .lib-detail-grid { display: grid; grid-template-columns: minmax(320px, 460px) 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .lib-detail-grid { grid-template-columns: 1fr; } }
  .tpl-schema pre { margin: 0; background: var(--bg-sunken); border-radius: 8px; padding: 10px 12px;
    font-size: var(--font-caption); line-height: 1.55; white-space: pre-wrap; overflow-x: auto; max-height: 260px; overflow-y: auto; }
  .tpl-actions { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
</style>
</head>
<body class="has-side">
<div class="page">
  <div class="page-head" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div class="page-title">组件库</div>
    <span class="muted">平台提供的泛化组件模板：与业务解耦，注册给大模型后由模型决定何时使用；接入方式见「产品与接入」</span>
    <div style="flex:1"></div>
  </div>
  <div id="libBody"></div>
</div>

<script>window.SIA_PLATFORM="ia";</script>
<script src="./mock_data.js?v=4e1d04a5"></script>
<script src="./mock_api.js?v=13eb79e0"></script>
<script src="./tokens.js?v=21c3b631"></script>
<script src="./ui.js?v=e112e89b"></script>
<script src="./components.js?v=aed14e9a"></script>
<script>
UI.nav("library");
const { el } = UI;

// 每类模板的示例信封参数：让管理员不读 schema 也能看到组件长什么样
const DEMO_PARAMS = {
  select: { component_type: "select.single", params: { prompt: "请选择处理方式（候选项由模型按对话动态给出）",
    options: ["加急催办", "改约送达时间", "申请赔付"], submit_label: "确认" } },
  form: { component_type: "form.structured", params: { prompt: "请补充以下信息（字段在平台定死）",
    fields: [{ key: "contact_name", label: "联系人", type: "text", required: true },
             { key: "contact_phone", label: "联系方式", type: "text", required: true }], submit_label: "提交" } },
  confirm: { component_type: "control.confirm", params: { prompt: "确认取消本次订单？该操作不可撤销。", submit_label: "确认执行" } },
  feedback: { component_type: "feedback.binary", params: { dimensions: [
    { key: "accuracy", label: "答得准确吗" }, { key: "helpful", label: "对你有帮助吗" }] } },
  preference: { component_type: "feedback.preference", params: { candidates: [
    { alias: "方案 A", label: "方案 A", content: "优先保证时效：改走直达线路，成本上浮约 8%。" },
    { alias: "方案 B", label: "方案 B", content: "优先控制成本：维持现有线路，预计多用 2 天。" }] } },
  table: { component_type: "table", params: { title: "分区域概览", columns: ["区域", "数量", "环比"],
    rows: [["华东", "352", "2.3%"], ["华南", "332", "1.5%"], ["华北", "372", "3.2%"]] } },
  trend: { component_type: "chart.line", params: { title: "近半年走势", categories: ["4月", "5月", "6月", "7月", "8月", "9月"],
    series: [{ name: "金额（万元）", values: [122, 165, 148, 161, 178, 190] }] } },
  bar: { component_type: "chart.bar", params: { title: "分区域对比", categories: ["华东", "华南", "华北", "西南"],
    series: [{ name: "数量", values: [352, 332, 372, 222] }] } },
  pie: { component_type: "chart.pie", params: { title: "构成占比", slices: [
    { label: "华东", value: 42 }, { label: "华南", value: 27 }, { label: "华北", value: 22 }, { label: "其他", value: 9 }] } },
  metric: { component_type: "metric.card", params: { label: "本月累计金额", value: "1,286", unit: "万元", delta: "4.2%", baseline: "对比上月同期" } },
  timeline: { component_type: "timeline", params: { title: "处理进度", events: [
    { ts: "09:20", title: "已受理", desc: "工单创建" }, { ts: "10:05", title: "处理中", desc: "已分派专员跟进" }, { ts: "14:30", title: "待确认", desc: "方案已发出" }] } },
  steps: { component_type: "steps", params: { title: "操作指引", steps: ["填写申请信息", "上传相关凭证", "等待审核", "查收处理结果"], current_index: 1 } },
};

let __cards = [];
function liveInstOf(t) {
  return __cards.find(c => c.status === "published" && (t.component_types.includes(c.component_type)
    || (t.type === "select" && String(c.component_type).startsWith("select."))
    || (t.type === "trend" && c.component_type === "chart.line")
    || (t.type === "bar" && c.component_type === "chart.bar")
    || (t.type === "pie" && c.component_type === "chart.pie")
    || (t.type === "metric" && c.component_type === "metric.card")));
}
function liveIdOf(t) { const c = liveInstOf(t); return c ? c.card_id : null; }
function liveCountOf(t) {
  return __cards.filter(c => c.status === "published" && (t.component_types.includes(c.component_type)
    || (t.type === "select" && String(c.component_type).startsWith("select."))
    || (t.type === "trend" && c.component_type === "chart.line")
    || (t.type === "bar" && c.component_type === "chart.bar")
    || (t.type === "pie" && c.component_type === "chart.pie")
    || (t.type === "metric" && c.component_type === "metric.card"))).length;
}
function liveNameOf(t) { const c = liveInstOf(t); return c ? c.name : null; }

const previewCtx = { sendEvent: () => {}, onCollectSubmit: () => UI.toast("示例预览：提交不生效"), onControl: () => {}, titleInBubble: true };

function tplCard(t) {
  const demo = DEMO_PARAMS[t.type];
  const previewBox = el("div", { class: "tpl-preview" });
  try {
    const env = { schema_version: "1.0.0", render_id: "lib-" + t.type, component_type: demo.component_type,
      semantic_category: t.interactive ? "collect" : "present", trigger_source: "library_preview",
      card_ref: null, params: demo.params };
    previewBox.appendChild(Components.render(env, previewCtx));
  } catch (e) { previewBox.appendChild(el("div", { class: "muted" }, ["示例预览暂不可用"])); }
  return el("div", { class: "card tpl-card" }, [
    el("div", { class: "tpl-head" }, [
      el("button", { class: "tpl-name tpl-name-link", type: "button", title: "查看组件详情",
        onclick: () => { location.hash = "d-" + t.type; } }, [t.label]),
      el("span", { class: "chip " + (t.interactive ? "blue" : "gray") }, [t.interactive ? "交互 · 有提交" : "展示 · 无提交"]),
      el("div", { style: "flex:1" }),
      liveCountOf(t) ? el("span", { class: "muted", style: "font-size:var(--font-caption)",
        title: "当前产品基于该模板的实例，可在组件工作台编辑" }, [`已建 ${liveCountOf(t)} 个`]) : null,
      el("a", { class: "btn small primary", href: "./cards.html?new=1&ct=" + encodeURIComponent(t.component_types[0]) }, ["从模板创建"]),
    ]),
    el("div", { class: "tpl-desc" }, [t.desc]),
    previewBox,
  ]);
}

// ---------- 组件详情：大预览 + 参数 schema + 提交回传结构 + 平台固定项 ----------
function renderDetail(t) {
  const box = document.getElementById("libBody");
  box.innerHTML = "";
  const demo = DEMO_PARAMS[t.type];
  const previewBox = el("div", { class: "tpl-preview", style: "height:auto;overflow:visible" });
  previewBox.style.setProperty("padding", "18px");
  try {
    const env = { schema_version: "1.0.0", render_id: "libd-" + t.type, component_type: demo.component_type,
      semantic_category: t.interactive ? "collect" : "present", trigger_source: "library_preview",
      card_ref: null, params: demo.params };
    previewBox.appendChild(Components.render(env, previewCtx));
  } catch (e) { previewBox.appendChild(el("div", { class: "muted" }, ["示例预览暂不可用"])); }
  const pre = obj => el("pre", { class: "num", style: "margin:0;background:var(--bg-sunken);border-radius:8px;padding:10px 12px;font-size:var(--font-caption);line-height:1.55;white-space:pre-wrap;overflow:auto;max-height:340px" },
    [JSON.stringify(obj, null, 2)]);
  const secTitle = (t2, hint) => el("div", { style: "font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:6px" },
    [t2, hint ? UI.help(hint) : null]);
  box.appendChild(el("div", { class: "lib-detail-head" }, [
    el("button", { class: "btn small", onclick: () => { location.hash = t.interactive ? "" : "present"; } }, ["返回组件库"]),
    el("span", { class: "tpl-name", style: "font-size:20px" }, [t.label]),
    el("span", { class: "chip " + (t.interactive ? "blue" : "gray") }, [t.interactive ? "交互 · 有提交" : "展示 · 无提交"]),
    el("span", { class: "muted num" }, [t.component_types[0]]),
    el("div", { style: "flex:1" }),
    liveCountOf(t) ? el("span", { class: "muted", style: "font-size:var(--font-caption)" }, [`当前产品已建 ${liveCountOf(t)} 个实例`]) : null,
    el("a", { class: "btn primary", href: "./cards.html?new=1&ct=" + encodeURIComponent(t.component_types[0]) }, ["从模板创建"]),
  ]));
  box.appendChild(el("div", { class: "muted", style: "margin:0 0 14px;max-width:62em" }, [t.desc]));
  box.appendChild(el("div", { class: "lib-detail-grid" }, [
    el("div", { class: "card" }, [secTitle("示例效果", "内容来自示例参数；实际运行时由模型按参数 schema 填入"), previewBox]),
    el("div", {}, [
      el("div", { class: "card", style: "margin-bottom:12px" }, [
        secTitle("参数 schema", "模型调用本组件时要填的参数（注册表原文）"), pre(t.params_schema)]),
      t.interactive && t.submit_schema ? el("div", { class: "card", style: "margin-bottom:12px" }, [
        secTitle("提交回传结构", "用户点提交后回传给 agent 的数据"), pre(t.submit_schema)]) : null,
      el("div", { class: "card" }, [
        secTitle("示例调用", "模型返回的组件调用长这样，前端交给 SIA.render 渲染"),
        pre({ component_id: liveIdOf(t) || "<实例 ID：从模板创建后生成>", params: demo.params }),
        liveIdOf(t) ? el("div", { class: "muted", style: "margin-top:6px" }, ["component_id 已填入当前产品「" + (liveNameOf(t) || "") + "」实例，可直接复制使用"]) : null]),
    ]),
  ]));
}

let catalogCache = null;
let libTab = location.hash === "#present" ? "present" : "interact";
async function boot() {
  const box = document.getElementById("libBody");
  if (!catalogCache) {
    UI.loading(box);
    catalogCache = (await UI.api("/api/components/catalog")).catalog;
    try { __cards = ((await UI.api("/api/cards")).cards) || []; } catch (e) {}
  }
  const dm = (location.hash || "").match(/^#d-([a-z]+)$/);
  if (dm) {
    const t = catalogCache.find(x => x.type === dm[1]);
    if (t) { renderDetail(t); return; }
  }
  if (location.hash === "#present") libTab = "present";
  else if (!location.hash) libTab = "interact";
  box.innerHTML = "";
  const interact = catalogCache.filter(t => t.interactive);
  const present = catalogCache.filter(t => !t.interactive);
  const tabBar = el("div", { class: "tab-bar", style: "margin-bottom:12px" },
    [["interact", `交互类组件（${interact.length}）`], ["present", `展示类组件（${present.length}）`]].map(([k, nm]) =>
      el("button", { type: "button", class: "tab" + (libTab === k ? " active" : ""), onclick: () => {
        libTab = k; history.replaceState(null, "", location.pathname + (k === "present" ? "#present" : ""));
        boot();
      } }, [nm])));
  box.appendChild(tabBar);
  box.appendChild(el("div", { class: "muted", style: "margin:0 0 10px" }, [libTab === "interact"
    ? "必有提交按钮——用户点提交才与后端交互；提交数据按各卡「提交回传结构」回传给 agent"
    : "无提交——把模型的长文本翻译成结构化可视化，随回答直接渲染"]));
  box.appendChild(el("div", { class: "grid cols-2" }, (libTab === "interact" ? interact : present).map(tplCard)));
}
window.addEventListener("hashchange", () => boot().catch(e => UI.toast("加载失败：" + e.message, true)));
boot().catch(e => UI.toast("加载失败：" + e.message, true));
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});</script>
</body>
</html>
