<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231DA1F2'/%3E%3Cpath d='M14 18h36a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H31l-9 9v-9h-8a2 2 0 0 1-2-2V20a2 2 0 0 1 2-2z' fill='%23fff'/%3E%3Ccircle cx='24' cy='29' r='3.2' fill='%231DA1F2'/%3E%3Ccircle cx='32' cy='29' r='3.2' fill='%231DA1F2'/%3E%3Ccircle cx='40' cy='29' r='3.2' fill='%231DA1F2'/%3E%3C/svg%3E">
<title>组件库 · 智能交互平台</title>
<link rel="stylesheet" href="./shared.css">
<link rel="prefetch" href="./cards.html"><link rel="prefetch" href="./library.html"><link rel="prefetch" href="./router.html"><link rel="prefetch" href="./dashboard.html"><link rel="prefetch" href="./design.html">
<style>
  /* 组件卡：等高（网格拉伸 + 弹性中区），头部承载创建入口，底部为样式切换 */
  .tpl-card { display: flex; flex-direction: column; gap: 10px; height: 100%; }
  .tpl-card .head { display: flex; align-items: center; gap: 8px; min-height: 30px; }
  .tpl-card .head .name { font-weight: 700; font-size: var(--font-title); }
  .tpl-card .tpl-sub { font-size: var(--font-small); color: var(--text-muted); margin: -4px 0 2px; }
  .tpl-card .mock-area { flex: 1; min-height: 320px; display: flex; flex-direction: column; }
  .tpl-card .mock-area .chat-mock { flex: 1; }
  #tplGrid { align-items: stretch; }
  /* 自绘类型筛选：分段胶囊 */
  .lib-sticky { position: sticky; top: 0; z-index: 30; background: var(--bg-page); padding: 14px 0 10px; margin-bottom: 0; }
  .cat-seg { display: inline-flex; gap: 4px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .cat-seg button { border: none; background: transparent; border-radius: 999px; padding: 4px 14px; font-size: var(--font-base); color: var(--text-secondary); font-weight: 600; }
  .cat-seg button:hover { color: var(--text-primary); }
  .cat-seg button.on { background: var(--primary); color: #fff; }
</style>
</head>
<body>
<div class="page">
  <div class="page-head lib-sticky" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div class="page-title">组件库</div>
    <span class="muted" id="tplCount"></span>
    <div style="flex:1"></div>
    <input type="text" id="tplSearch" placeholder="搜索组件或场景" style="max-width:200px" aria-label="搜索组件">
    <div class="cat-seg" id="catSeg" role="tablist"></div>
    <a class="btn primary" href="./cards.html?new=1">新建交互配置</a>
  </div>

  <div class="grid cols-2" id="tplGrid" style="margin-top:6px"></div>
</div>

<script src="./mock_data.js"></script>
<script src="./mock_api.js"></script>
<script src="./tokens.js"></script>
<script src="./ui.js"></script>
<script src="./components.js"></script>
<script>
UI.nav("library");
const { el } = UI;

// 用户视角的一句话描述（名称下方常显；配置细节仍在 ⓘ 里）
const SUBTITLES = {
  "select.single": "适用于在几个明确选项中选一个的场景，如发票类型确认",
  "select.card": "适用于方案、套餐等需要图文对比后决策的场景",
  "rank.priority": "适用于收集优先级排序的场景，如诉求重要程度",
  "matrix.compare+select": "适用于多候选按指标对比后选定的场景，如供应商比选",
  "scale.likert": "适用于满意度、认可度等打分评价场景",
  "form.structured": "表单式一次收集多个字段，如退货登记",
  "slider.range": "适用于在区间内取一个数的场景，如预算上限",
  "input.followup": "适用于收集一段自由文字的场景，如送货备注",
  "picker.datetime": "适用于约定某个日期的场景，如提货日期",
  "picker.timerange": "适用于约定起止时间段的场景，如上门取件",
  "picker.location": "把配置好的仓库 / 门店地址推给用户确认",
  "upload.file": "适用于收取单据文件的场景，如报关单、合同",
  "upload.image": "适用于收取照片凭证的场景，如破损核赔",
  "commerce.order": "适用于增值服务、商品的直接下单场景",
  "entry.link": "适用于导流到专区、活动或服务页的场景",
  "track.map": "适用于展示货物实时位置与轨迹的场景",
};

const SCENES = {
  "select.single": { cat: "选择", q: "我要开发票", reply: "好的，请确认发票类型。", prompt: "开哪种发票？",
    config: { options: ["专票", "普票"], recommended_default: "普票", option_meta: { "专票": { desc: "增值税专用发票，可抵扣" }, "普票": { desc: "增值税普通发票" } } } },
  "select.multi": { cat: "选择", q: "我的货延误了", reply: "很抱歉，我们已记录该异常。", prompt: "需要我们做什么？可多选",
    config: { options: ["加急催办", "改约送达时间", "申请赔付"], option_meta: { "加急催办": { desc: "24 小时内联系承运商提速" }, "改约送达时间": { desc: "重新预约送达窗口" }, "申请赔付": { desc: "按合同条款发起赔付" } } } },
  "select.card": { cat: "选择", q: "帮我选个运输方案", reply: "两个方案供你选择：", prompt: "选择运输方案",
    config: { options: ["海运直达", "海铁联运"], recommended_default: "海运直达",
      option_meta: { "海运直达": { desc: "35 天 · 成本低，适合不赶时间" }, "海铁联运": { desc: "26 天 · 快 9 天，成本略高" } } } },
  "rank.priority": { cat: "选择", q: "这批货怎么安排比较好", reply: "请把你的诉求按重要程度排个序：", prompt: "哪个对你最重要？",
    config: { options: ["时效最快", "成本最低", "风险最小"] } },
  "matrix.compare+select": { cat: "选择", q: "对比一下这几家供应商", reply: "按价格、时效、合规评估如下：", prompt: "选定供应商",
    config: { options: ["中远供应链", "环球捷运"], dimensions: ["价格", "时效", "合规"] } },
  "scale.likert": { cat: "评价", q: "谢谢，问题解决了", reply: "不客气。", prompt: "这次服务满意吗？",
    config: { likert: { left: "很不满意", right: "很满意", from: 1, to: 5 } } },
  "form.structured": { cat: "填写", q: "我要退货", reply: "请补充以下信息，我来为你登记。", prompt: "退货登记",
    config: { fields: [{ key: "order_no", label: "订单号", required: true }, { key: "phone", label: "联系电话", required: true }] } },
  "input.followup": { cat: "填写", q: "送货有点要求", reply: "好的，请留下送货备注：", prompt: "送货备注",
    config: { placeholder: "例如：周五前送到，放前台即可" } },
  "slider.range": { cat: "填写", q: "帮我做个采购预算", reply: "先确认一下预算范围。", prompt: "预算上限（万元）",
    config: { slider: { min: 0, max: 100, unit: "万元" } } },
  "picker.datetime": { cat: "填写", q: "帮我约个提货时间", reply: "好的，请选择提货日期：", prompt: "期望提货日期", config: {} },
  "picker.timerange": { cat: "填写", q: "什么时候方便上门取件", reply: "请选择方便的时间段：", prompt: "取件时间段", config: { display: "time" } },
  "picker.location": { cat: "填写", q: "这批货送到仓库", reply: "请确认收货地点：", prompt: "收货地点",
    config: { options: ["上海仓", "宁波舟山港", "青岛港"] } },
  "upload.file": { cat: "填写", q: "报关材料给你", reply: "请上传相关单据：", prompt: "上传报关单",
    config: { placeholder: "请上传报关单或合同文件（PDF / Excel）" } },
  "upload.image": { cat: "填写", q: "货有点破损，我拍了照片", reply: "请上传破损部位的照片，我们据此核定赔付：", prompt: "上传破损照片",
    config: { placeholder: "请拍摄或上传清晰照片" } },
  "entry.link": { cat: "引导", q: "还有什么优惠活动吗", reply: "为你找到两个专区，点击直达：", prompt: "",
    config: { options: ["神券团购专区", "增值服务商城"],
      option_meta: { "神券团购专区": { desc: "咖啡茶饮 5 折起，限时领券" }, "增值服务商城": { desc: "加固 · 保价 · 包装耗材" } },
      option_actions: { "神券团购专区": { api: "https://www.example-scm.com/coupon" }, "增值服务商城": { api: "https://www.example-scm.com/vas" } } } },
  "commerce.order": { cat: "交易", q: "这批设备怕震，帮我加固一下", reply: "推荐以下增值服务，可直接下单：", prompt: "选择增值服务",
    config: { options: ["木箱加固", "运输保价"],
      option_meta: { "木箱加固": { desc: "出口级木箱，防潮防震，适合精密设备", price: 120, price_original: 150, sales: 2300, tags: ["防潮", "承重加强"] },
                     "运输保价": { desc: "按货值 0.3% 投保，破损丢失全额赔付", price: 50, price_original: 60, sales: 5100, tags: ["全额赔付"] } } } },
  "suggest.followup": { cat: "引导", q: "帮我查一下这票货到哪了", reply: "这票货已到宁波舟山港中转，预计后天送达。", prompt: "你可能还想问",
    config: { options: ["为什么会延误", "预计什么时候能到", "帮我催一下这票货"],
      option_actions: { "帮我催一下这票货": { prompt: "生成催办工单" } } } },
};

function buildEnvelope(ct, config, prompt, display) {
  const params = { prompt: ct === "entry.link" ? (prompt || "") : (prompt || "请选择"), submit_label: ct === "commerce.order" ? "去下单" : "提交", reply_text: "", echo_results: false };
  if (display) params.display = display;
  if (config.options) { params.options = config.options; params.recommended_default = config.recommended_default || null; }
  if (config.option_meta) params.option_meta = config.option_meta;
  if (config.option_actions) params.option_actions = config.option_actions;
  if (ct === "matrix.compare+select") {
    params.dimensions = config.dimensions || ["价格", "时效"];
    params.values = (params.options || []).map((o, i) => params.dimensions.map((d, j) => Math.round((5 + ((i * 3 + j * 2) % 40) / 10) * 10) / 10));
  }
  if (ct === "scale.likert") params.likert = config.likert;
  if (ct === "form.structured") params.fields = config.fields;
  if (ct === "input.followup" || ct === "picker.location" || ct === "upload.file") params.placeholder = config.placeholder || "";
  if (ct === "slider.range") { const s = config.slider || {}; params.min = s.min ?? 0; params.max = s.max ?? 100; params.unit = s.unit || ""; }
  return { schema_version: "1.0.0", render_id: "lib-" + Math.random().toString(36).slice(2), component_type: ct,
    semantic_category: "collect", trigger_source: "model_tool_call", card_ref: null,
    params, group_mode: null, degraded_text: params.prompt };
}
const previewCtx = { sendEvent: () => {}, onCollectSubmit: () => UI.toast("预览不产生数据"), onControl: () => {}, titleInBubble: true };

function gotoCreate(ct, config, prompt, description) {
  localStorage.setItem("config_prefill", JSON.stringify({ component_type: ct, config: config || {}, prompt: prompt || "", description: description || "" }));
  location.href = "./cards.html?new=1";
}

// ---------- 自绘类型筛选（分段胶囊） ----------
let catNow = "";
const CATS = [["", "全部"], ["选择", "选择类"], ["评价", "评价类"], ["填写", "填写类"], ["引导", "引导类"], ["交易", "交易类"], ["呈现", "呈现类"]];
function renderCatSeg() {
  const seg = document.getElementById("catSeg");
  seg.innerHTML = "";
  CATS.forEach(([key, name]) => seg.appendChild(el("button", {
    class: key === catNow ? "on" : "", role: "tab", "aria-selected": key === catNow ? "true" : "false",
    onclick: () => { catNow = key; renderCatSeg(); renderTpl(); },
  }, [name])));
}

// ---------- 陈列：等高卡片，单一默认样式 ----------
let allTemplates = [];
function renderTpl() {
  const kw = document.getElementById("tplSearch").value.trim().toLowerCase();
  const grid = document.getElementById("tplGrid");
  grid.innerHTML = "";
  const shown = allTemplates.filter(t => {
    const sc = SCENES[t.component_type] || {};
    if (catNow && sc.cat !== catNow) return false;
    if (!kw) return true;
    return [t.name, t.desc, t.component_type, sc.q, sc.prompt].join(" ").toLowerCase().includes(kw);
  });
  const showPresent = PRESENT_SHOWCASE.filter(t => {
    if (catNow && t.scene.cat !== catNow) return false;
    if (!kw) return true;
    return [t.name, t.desc, t.component_type, t.scene.q].join(" ").toLowerCase().includes(kw);
  });
  document.getElementById("tplCount").textContent = kw || catNow ? `${shown.length + showPresent.length} / ${allTemplates.length + PRESENT_SHOWCASE.length} 类` : `${allTemplates.length + PRESENT_SHOWCASE.length} 类交互组件`;
  if (!shown.length && !showPresent.length) {
    grid.appendChild(el("div", { class: "empty-state", style: "grid-column:1/-1" }, [
      el("div", { class: "empty-title" }, ["没有匹配的组件"]),
      el("button", { class: "btn small", style: "margin-top:8px", onclick: () => {
        document.getElementById("tplSearch").value = ""; catNow = ""; renderCatSeg(); renderTpl();
      } }, ["清空筛选"]),
    ]));
    return;
  }
  shown.forEach(t => {
    const sc = SCENES[t.component_type] || { q: "", reply: "", prompt: "", config: t.default_config };
    const mockArea = el("div", { class: "mock-area" });
    let node;
    try { node = Components.render(buildEnvelope(t.component_type, sc.config, sc.prompt, null), previewCtx); }
    catch (e) { node = el("div", { class: "muted" }, ["暂不支持预览"]); }
    mockArea.appendChild(UI.chatMock({ question: sc.q, reply: sc.reply, node, prompt: sc.prompt || "" }));
    grid.appendChild(el("div", { class: "card tpl-card" }, [
      el("div", { class: "head" }, [
        el("span", { class: "name" }, [t.name]),
        el("span", { class: "chip gray" }, [(sc.cat || "采集") + "类"]),
        el("div", { style: "flex:1" }),
        el("button", { class: "btn small primary", onclick: () => gotoCreate(t.component_type, sc.config, sc.prompt, sc.q) }, [UI.icon("plus", 14), "创建配置"]),
      ]),
      SUBTITLES[t.component_type] ? el("div", { class: "tpl-sub" }, [SUBTITLES[t.component_type]]) : null,
      mockArea,
    ]));
  });
  showPresent.forEach(t => {
    let node;
    try { node = Components.render(t.envelope, previewCtx); }
    catch (e) { node = el("div", { class: "muted" }, ["暂不支持预览"]); }
    grid.appendChild(el("div", { class: "card tpl-card" }, [
      el("div", { class: "head" }, [
        el("span", { class: "name" }, [t.name]),
        el("span", { class: "chip gray" }, ["呈现类"]),
        el("div", { style: "flex:1" }),
        el("span", { class: "chip blue", title: "由模型返回的数据驱动渲染，无需在工作台配置" }, ["模型数据驱动"]),
      ]),
      SUBTITLES[t.component_type] ? el("div", { class: "tpl-sub" }, [SUBTITLES[t.component_type]]) : null,
      el("div", { class: "mock-area" }, [UI.chatMock({ question: t.scene.q, reply: t.scene.reply, node, prompt: t.envelope.params.title || "" })]),
    ]));
  });
}
document.getElementById("tplSearch").oninput = UI.debounce(renderTpl, 200);
renderCatSeg();

// 呈现类展示（模型数据驱动，不走「创建配置」）
const PRESENT_SHOWCASE = [
  { component_type: "track.map", name: "物流轨迹卡", desc: "查件时由 AI 带出：地图定位货物当前位置 + 节点时间线，用户不需要任何操作",
    scene: { cat: "呈现", q: "帮我查一下这票货到哪了", reply: "这票货正在干线运输，当前位于宁波舟山港中转场，预计后天送达：" },
    envelope: { schema_version: "1.0.0", render_id: "lib-track", component_type: "track.map",
      semantic_category: "present", trigger_source: "model_tool_call", card_ref: null, group_mode: null,
      degraded_text: "物流轨迹", params: {
        title: "物流轨迹",
        current: { name: "宁波舟山港中转场", addr: "浙江省宁波市北仑区港区大道", lat: 29.935, lon: 121.844,
                   status_text: "运输中", updated_text: "2 小时前更新" },
        nodes: [
          { time: "08-25 09:12", text: "已揽收（上海仓）", state: "done" },
          { time: "08-26 21:40", text: "干线运输中，到达宁波舟山港中转场", state: "current" },
          { time: "", text: "到达目的地网点，安排派送", state: "todo" },
          { time: "", text: "签收", state: "todo" },
        ] } } },
];
UI.api("/api/templates").then(({ templates }) => { allTemplates = templates; renderTpl(); })
  .catch(e => UI.toast("加载失败：" + e.message, true));
</script>
</body>
</html>
