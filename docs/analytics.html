<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>数据分析 · 智能交互平台</title>

<link rel="prefetch" href="./analytics.html"><link rel="prefetch" href="./audit.html"><link rel="prefetch" href="./cards.html"><link rel="prefetch" href="./design.html"><link rel="prefetch" href="./embed-demo.html"><link rel="prefetch" href="./index.html"><link rel="prefetch" href="./products.html">
<style>
  .an-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .an-kpi { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .an-kpi .k { font-size: var(--font-caption); color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
  .an-kpi .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .an-kpi .v small { font-size: 13px; font-weight: 500; color: var(--text-muted); margin-left: 3px; }
  .an-kpi .s { font-size: var(--font-caption); color: var(--text-muted); margin-top: 2px; }
  .an-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 1100px) { .an-grid { grid-template-columns: 1fr; } }
  .an-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .an-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .an-head .t { font-weight: 700; font-size: 15px; }
  .an-head .d { font-size: var(--font-caption); color: var(--text-muted); }
  /* 漏斗：三段横条 + 转化率 */
  .fn-row { display: flex; align-items: center; gap: 12px; padding: 7px 0; }
  .fn-name { width: 68px; flex: none; font-size: var(--font-small); color: var(--text-secondary); }
  .fn-track { flex: 1; height: 26px; background: var(--bg-sunken); border-radius: 7px; overflow: hidden; }
  .fn-fill { height: 100%; border-radius: 7px; background: var(--primary); display: flex; align-items: center;
    padding-left: 10px; color: #fff; font-size: var(--font-caption); font-weight: 600; min-width: 44px; }
  .fn-fill.s2 { background: color-mix(in srgb, var(--primary) 72%, var(--bg-elevated)); }
  .fn-fill.s3 { background: color-mix(in srgb, var(--primary) 48%, var(--bg-elevated)); color: var(--text-primary); }
  .fn-rate { width: 76px; flex: none; text-align: right; font-size: var(--font-small); color: var(--text-muted);
    font-variant-numeric: tabular-nums; }
  .fn-drop { font-size: var(--font-caption); color: var(--text-muted); padding: 2px 0 2px 80px; }
  /* 选项分布 */
  .od-group { padding: 10px 0; border-top: 1px solid var(--border); }
  .od-group:first-child { border-top: none; padding-top: 0; }
  .od-title { font-size: var(--font-small); font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .od-row { display: flex; align-items: center; gap: 10px; padding: 3px 0; }
  .od-label { width: 116px; flex: none; font-size: var(--font-small); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .od-track { flex: 1; height: 16px; background: var(--bg-sunken); border-radius: 5px; overflow: hidden; }
  .od-fill { height: 100%; background: var(--primary); border-radius: 5px; }
  .od-fill.rec { background: var(--success); }
  .od-pct { width: 74px; flex: none; text-align: right; font-size: var(--font-caption); color: var(--text-secondary);
    font-variant-numeric: tabular-nums; }
  /* 两大模块的分区标题 */
  .an-sec { margin: 4px 0 12px; display: flex; align-items: baseline; gap: 10px; }
  .an-sec h2 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .an-sec .d { font-size: var(--font-caption); color: var(--text-muted); }
  .an-sec-line { height: 1px; background: var(--border); margin: 22px 0 18px; }
  /* 单组件分析的筛选行 */
  .an-filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 14px; }
  .an-filters .fl { font-size: var(--font-caption); color: var(--text-muted); }
  .an-range-custom { display: flex; align-items: center; gap: 6px; }
  .an-range-custom input[type=date] { height: 32px; padding: 4px 8px; }
  .an-inst-row { cursor: pointer; }
  .an-inst-row:hover td { background: var(--bg-surface); }
  .an-inst-row.on td { background: var(--primary-weak); }
  .an-empty { color: var(--text-muted); font-size: var(--font-small); padding: 18px 0; text-align: center; }
  .an-legend { display: flex; gap: 14px; justify-content: center; margin-top: 6px; font-size: var(--font-caption); color: var(--text-secondary); }
  .an-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .an-legend .s1 { background: var(--primary); }
  .an-legend .s2 { background: color-mix(in srgb, var(--primary) 45%, var(--bg-elevated)); }
</style>
</head>
<body class="has-side">
<div class="page">
  <div class="page-head" style="display:flex;align-items:center;gap:12px">
    <div class="page-title">数据分析</div>
    <div style="flex:1"></div>
    <span id="rangeMount"></span>
  </div>
  <div class="tabbar" id="anTabs"></div>
  <div id="anOverall"></div>
  <div id="anSingle" hidden></div>
</div>

<script>window.SIA_PLATFORM="ia";</script>
<script src="./mock_data.js?v=e878e660"></script>
<script src="./mock_api.js?v=5ebc21e8"></script>
<script src="./tokens.js?v=e25ac88c"></script>
<script src="./ui.js?v=cc016c4c"></script>
<script>
UI.nav("analytics");
const { el } = UI;

const CT_CN = (ct) => UI.ctName(ct);
const pct = (v) => v == null ? "-" : v + "%";

function kpiCard(k, v, unit, sub, hint) {
  return el("div", { class: "an-kpi" }, [
    el("div", { class: "k" }, [k, hint ? UI.help(hint) : null]),
    el("div", { class: "v" }, [String(v), unit ? el("small", {}, [unit]) : null]),
    sub ? el("div", { class: "s" }, [sub]) : null,
  ]);
}

function funnelCard(o) {
  const f = o.funnel;
  const max = Math.max(...f.map(x => x.value), 1);
  const rows = [];
  f.forEach((st, i) => {
    rows.push(el("div", { class: "fn-row" }, [
      el("div", { class: "fn-name" }, [st.step]),
      el("div", { class: "fn-track" }, [
        el("div", { class: "fn-fill s" + (i + 1), style: `width:${Math.max(6, st.value / max * 100)}%` },
          [String(st.value)]),
      ]),
    ]));
    if (i < f.length - 1) {
      rows.push(el("div", { class: "fn-drop" }, [`↓ 流失率 ${pct(st.drop_rate)}`]));
    }
  });
  return el("div", { class: "an-card" }, [
    el("div", { class: "an-head" }, [el("span", { class: "t" }, ["使用漏斗"]),
      el("span", { class: "d" }, ["组件渲染出来之后，用户是否真的用了它"])]),
    ...rows,
  ]);
}

function trendCard(o) {
  const t = o.trend || [];
  if (!t.length) return el("div", { class: "an-card" }, [
    el("div", { class: "an-head" }, [el("span", { class: "t" }, ["每日曝光与提交"])]),
    el("div", { class: "an-empty" }, ["该时间范围内没有事件"])]);
  return el("div", { class: "an-card" }, [
    el("div", { class: "an-head" }, [el("span", { class: "t" }, ["每日曝光与提交"]),
      el("span", { class: "d" }, [`${t[0].day} 至 ${t[t.length - 1].day}`])]),
    (() => {
      // UI.lineChart(container, opts)：先建容器再画
      const host = el("div", { style: "min-height:200px" });
      requestAnimationFrame(() => {
        UI.lineChart(host, {
          labels: t.map(x => x.day.slice(5)),
          series: [{ name: "曝光", values: t.map(x => x.rendered) },
                   { name: "提交", values: t.map(x => x.submitted) }],
          height: 190, valueLabels: false,
        });
      });
      return host;
    })(),
    el("div", { class: "an-legend" }, [
      el("span", {}, [el("i", { class: "lg-dot s1" }), "曝光"]),
      el("span", {}, [el("i", { class: "lg-dot s2" }), "提交"]),
    ]),
  ]);
}

function byTypeCard(rows) {
  if (!rows.length) return el("div", { class: "an-card" }, [
    el("div", { class: "an-head" }, [el("span", { class: "t" }, ["按组件类型"])]),
    el("div", { class: "an-empty" }, ["暂无数据"])]);
  return el("div", { class: "an-card" }, [
    el("div", { class: "an-head" }, [el("span", { class: "t" }, ["按组件类型"]),
      el("span", { class: "d" }, ["哪类组件更容易被用户完成"])]),
    el("div", { style: "overflow-x:auto" }, [
      el("table", { class: "data" }, [
        el("thead", {}, [el("tr", {}, ["组件", "曝光", "开始操作", "提交", "交互率", "完成率"]
          .map(h => el("th", {}, [h])))]),
        el("tbody", {}, rows.map(r => el("tr", {}, [
          el("td", {}, [CT_CN(r.component_type)]),
          el("td", { class: "num" }, [String(r.rendered)]),
          el("td", { class: "num" }, [String(r.started)]),
          el("td", { class: "num" }, [String(r.submitted)]),
          el("td", { class: "num muted" }, [r.rendered ? pct(r.interact_rate) : "-"]),
          el("td", { class: "num" }, [r.rendered ? pct(r.complete_rate) : "-"]),
        ]))),
      ]),
    ]),
  ]);
}

function optionsCard(groups) {
  if (!groups.length) return el("div", { class: "an-card" }, [
    el("div", { class: "an-head" }, [el("span", { class: "t" }, ["用户选了什么"])]),
    el("div", { class: "an-empty" }, ["还没有带选项的提交记录"])]);
  return el("div", { class: "an-card" }, [
    el("div", { class: "an-head" }, [el("span", { class: "t" }, ["用户选了什么"]),
      el("span", { class: "d" }, ["同一组候选项的选择分布，绿色为 AI 推荐项"])]),
    ...groups.map(g => el("div", { class: "od-group" }, [
      el("div", { class: "od-title" }, [CT_CN(g.component_type),
        el("span", { class: "muted", style: "font-weight:400" }, [`${g.total} 次提交`])]),
      ...g.dist.map(d => el("div", { class: "od-row" }, [
        el("div", { class: "od-label", title: d.label }, [d.label]),
        el("div", { class: "od-track" }, [
          el("div", { class: "od-fill" + (d.recommended ? " rec" : ""), style: `width:${Math.max(2, d.pct)}%` })]),
        el("div", { class: "od-pct" }, [`${d.count} 次 · ${d.pct}%`]),
      ])),
    ])),
  ]);
}

function instancesCard(rows) {
  if (!rows.length) return el("div", { class: "an-card" }, [
    el("div", { class: "an-head" }, [el("span", { class: "t" }, ["组件实例排行"])]),
    el("div", { class: "an-empty" }, ["还没有能归到具体实例的事件（需要 SDK 回传 card_id）"])]);
  return el("div", { class: "an-card" }, [
    el("div", { class: "an-head" }, [el("span", { class: "t" }, ["组件实例排行"]),
      el("span", { class: "d" }, ["曝光最多的实例，完成率低的值得优先优化"])]),
    el("div", { style: "overflow-x:auto" }, [
      el("table", { class: "data" }, [
        el("thead", {}, [el("tr", {}, ["实例", "状态", "曝光", "提交", "完成率"].map(h => el("th", {}, [h])))]),
        el("tbody", {}, rows.map(r => el("tr", {
          class: "an-inst-row" + (r.card_id === pickState.card_id ? " on" : ""),
          title: "查看这个实例的数据",
          onclick: () => { pickState.card_id = r.card_id; pickState.cleared = false; loadSingle(); },
        }, [
          el("td", {}, [r.name]),
          el("td", {}, [el("span", { class: "chip " + (r.status === "published" ? "blue" : "gray") },
            [{ published: "已上线", offline: "已下线", draft: "草稿", deleted: "已删除" }[r.status] || r.status])]),
          el("td", { class: "num" }, [String(r.rendered)]),
          el("td", { class: "num" }, [String(r.submitted)]),
          el("td", { class: "num" }, [pct(r.complete_rate)]),
        ]))),
      ]),
    ]),
  ]);
}

// ---------- 时间范围：预设 + 自定义起止 ----------
const range = { days: 30, start: "", end: "" };
const rangeQS = () => range.start || range.end
  ? `start=${range.start}&end=${range.end}` : `days=${range.days}`;
const rangeLabel = () => range.start || range.end
  ? `${range.start || "最早"} 至 ${range.end || "今天"}` : `近 ${range.days} 天`;

// ---------- 模块一：整体交互情况 ----------
async function loadOverall() {
  const box = document.getElementById("anOverall");
  UI.loading(box);
  const [o, bt] = await Promise.all([
    UI.api(`/api/analytics/overview?${rangeQS()}`),
    UI.api(`/api/analytics/by-type?${rangeQS()}`).catch(() => ({ rows: [] })),
  ]);
  box.innerHTML = "";
  const k = o.kpi;
  if (!k.rendered) {
    box.appendChild(el("div", { class: "an-card" }, [
      el("div", { class: "empty-state" }, [
        el("div", { class: "empty-title" }, ["这段时间还没有组件事件"]),
        el("div", {}, ["组件在真实对话里被渲染、提交后，数据会自动出现在这里；也可以换一个更长的时间范围。"]),
      ]),
    ]));
    return;
  }
  box.appendChild(el("div", { class: "an-kpis" }, [
    kpiCard("曝光", k.rendered, "次", rangeLabel(), "组件被渲染进对话的次数（card_rendered 事件）"),
    kpiCard("提交", k.submitted, "次", `完成率 ${pct(k.complete_rate)}`, "用户点提交的次数（card_submitted 事件）"),
    kpiCard("交互率", pct(k.interact_rate), "", "曝光后有操作的比例", "用户至少点了一下（card_interaction_started）"),
    kpiCard("推荐采纳率", k.rec_accept_rate == null ? "-" : pct(k.rec_accept_rate), "",
      k.rec_sample ? `${k.rec_sample} 次带推荐的提交` : "暂无带推荐项的提交",
      "用户直接接受 AI 推荐项、没有改选的比例"),
  ]));
  box.appendChild(el("div", { class: "an-grid" }, [
    el("div", {}, [funnelCard(o)]),
    el("div", {}, [trendCard(o)]),
  ]));
  box.appendChild(byTypeCard(bt.rows || []));
}

// ---------- 模块二：单组件数据分析 ----------
const pickState = { product: "", ct: "", card_id: "", cleared: false };
let FILTERS = { products: [], component_types: [], cards: [] };

function filterBar() {
  const bar = el("div", { class: "an-filters" });
  const prodOpts = [["", "全部产品"], ...FILTERS.products.map(p => [p.product_id, p.name])];
  const ctPool = FILTERS.component_types;
  const ctOpts = [["", "全部组件类型"], ...ctPool.map(c => [c.component_type, CT_CN(c.component_type)])];
  const cardPool = FILTERS.cards.filter(c => !pickState.ct || c.component_type === pickState.ct);
  const cardOpts = [["", "全部实例"], ...cardPool.map(c => [c.card_id, c.name])];
  bar.append(
    el("span", { class: "fl" }, ["筛选"]),
    UI.fancySelect({ value: pickState.product, width: "180px", options: prodOpts,
      onChange: (v) => { pickState.product = v; loadSingle(); } }),
    UI.fancySelect({ value: pickState.ct, width: "180px", options: ctOpts,
      onChange: (v) => { pickState.ct = v; pickState.card_id = ""; loadSingle(); } }),
    UI.fancySelect({ value: pickState.card_id, width: "220px", options: cardOpts,
      onChange: (v) => { pickState.card_id = v; loadSingle(); } }),
  );
  if (pickState.product || pickState.ct || pickState.card_id) {
    bar.appendChild(el("button", { class: "btn small ghost", type: "button", onclick: () => {
      pickState.product = pickState.ct = pickState.card_id = "";
      pickState.cleared = true; loadSingle();
    } }, ["清除筛选"]));
  }
  return bar;
}

async function loadSingle() {
  const box = document.getElementById("anSingle");
  UI.loading(box);
  const ins = await UI.api(
    `/api/analytics/instances?${rangeQS()}&product=${pickState.product}&ct=${pickState.ct}`)
    .catch(() => ({ rows: [] }));
  // 不选任何条件时，默认落到「当前时间范围里曝光最多」的实例——
  // 否则这一屏跟「整体交互情况」长得一模一样，而且默认项不能是这段时间没数据的组件
  if (!pickState.cleared && !pickState.product && !pickState.ct && !pickState.card_id && (ins.rows || []).length) {
    pickState.card_id = ins.rows[0].card_id;
  }
  const qs = `${rangeQS()}&product=${pickState.product}&ct=${pickState.ct}&card_id=${pickState.card_id}`;
  const [o, op] = await Promise.all([
    UI.api(`/api/analytics/overview?${qs}`),
    UI.api(`/api/analytics/options?${qs}`).catch(() => ({ groups: [] })),
  ]);
  box.innerHTML = "";
  box.appendChild(filterBar());
  const k = o.kpi;
  const picked = FILTERS.cards.find(c => c.card_id === pickState.card_id);
  if (!k.rendered) {
    box.appendChild(el("div", { class: "an-card" }, [
      el("div", { class: "an-empty" }, ["当前筛选条件下没有事件，换个组件或时间范围看看。"])]));
    return;
  }
  box.appendChild(el("div", { class: "an-kpis" }, [
    kpiCard(picked ? picked.name + " · 曝光" : "曝光", k.rendered, "次", rangeLabel(),
      "该筛选范围内组件被渲染的次数"),
    kpiCard("交互率", pct(k.interact_rate), "", "曝光后有操作的比例", "用户至少点了一下"),
    kpiCard("完成率", pct(k.complete_rate), "", `提交 ${k.submitted} 次`, "曝光之后走到提交的比例"),
    kpiCard("推荐采纳率", k.rec_accept_rate == null ? "-" : pct(k.rec_accept_rate), "",
      k.rec_sample ? `${k.rec_sample} 次带推荐的提交` : "暂无带推荐项的提交",
      "用户直接接受 AI 推荐项、没有改选的比例"),
  ]));
  box.appendChild(el("div", { class: "an-grid" }, [
    el("div", {}, [funnelCard(o), optionsCard(op.groups || [])]),
    el("div", {}, [trendCard(o), instancesCard(ins.rows || [])]),
  ]));
}

// 两块内容用 tab 切换，一次只看一屏
let anTab = "overall";
function drawTabs() {
  const bar = document.getElementById("anTabs");
  bar.innerHTML = "";
  [["overall", "整体交互情况"], ["single", "单组件数据分析"]].forEach(([k, nm]) => {
    bar.appendChild(el("button", { class: "tab" + (anTab === k ? " active" : ""), type: "button",
      onclick: () => { anTab = k; drawTabs(); syncTab(); } }, [nm]));
  });
}
function syncTab() {
  document.getElementById("anOverall").hidden = anTab !== "overall";
  document.getElementById("anSingle").hidden = anTab !== "single";
  if (anTab === "single" && !document.getElementById("anSingle").dataset.loaded) {
    document.getElementById("anSingle").dataset.loaded = "1";
    loadSingle();
  }
}

async function load() {
  FILTERS = await UI.api("/api/analytics/filters").catch(() => FILTERS);
  drawTabs();
  await loadOverall();
  document.getElementById("anSingle").dataset.loaded = "";
  syncTab();
}

// 时间范围选择器：预设 + 自定义起止日期
(function mountRange() {
  const host = document.getElementById("rangeMount");
  const custom = el("span", { class: "an-range-custom", hidden: true });
  const sIn = el("input", { type: "date" });
  const eIn = el("input", { type: "date" });
  const apply = () => {
    range.start = sIn.value; range.end = eIn.value;
    if (range.start && range.end && range.start > range.end) {
      UI.toast("开始日期不能晚于结束日期", true); return;
    }
    document.getElementById("anSingle").dataset.loaded = "";
    load();
  };
  sIn.onchange = eIn.onchange = apply;
  custom.append(sIn, el("span", { class: "muted" }, ["至"]), eIn);
  host.appendChild(UI.fancySelect({
    value: "30", width: "130px",
    options: [["7", "近 7 天"], ["30", "近 30 天"], ["90", "近 90 天"], ["365", "近一年"], ["custom", "自定义范围"]],
    onChange: (v) => {
      if (v === "custom") {
        custom.hidden = false;
        if (!sIn.value) {
          const d = new Date(Date.now() - 29 * 86400e3);
          sIn.value = d.toISOString().slice(0, 10);
          eIn.value = new Date().toISOString().slice(0, 10);
        }
        apply();
      } else {
        custom.hidden = true; range.start = range.end = ""; range.days = Number(v); load();
      }
    },
  }));
  host.appendChild(custom);
})();

load().catch(e => UI.toast("加载失败：" + e.message, true));
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});</script>
