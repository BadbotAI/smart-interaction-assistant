<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%231DA1F2'/%3E%3Crect x='10.5' y='3.6' width='9.6' height='7.3' rx='2.7' fill='none' stroke='%23fff' stroke-width='1.5' opacity='0.75'/%3E%3Cpath d='M3.4 12a3.7 3.7 0 0 1 3.7-3.7h6a3.7 3.7 0 0 1 3.7 3.7v2.3a3.7 3.7 0 0 1-3.7 3.7H9.5l-3.1 2.6c-.55.46-1.3.07-1.3-.64v-2.4A3.7 3.7 0 0 1 3.4 14.3z' fill='%23fff'/%3E%3Ccircle cx='7.4' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='10.25' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='13.1' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3C/svg%3E">
<title>产品与接入 · 智能交互平台</title>
<link rel="stylesheet" href="./shared.css?v=b8f2612f">
<link rel="prefetch" href="./audit.html"><link rel="prefetch" href="./cards.html"><link rel="prefetch" href="./dashboard.html"><link rel="prefetch" href="./design.html"><link rel="prefetch" href="./embed-demo.html"><link rel="prefetch" href="./index.html"><link rel="prefetch" href="./library.html"><link rel="prefetch" href="./playground.html"><link rel="prefetch" href="./products.html">
</head>
<body class="has-side">
<div class="page">
  <div class="page-head" style="display:flex;align-items:center;gap:12px">
    <div class="page-title">产品与接入</div>
    <div style="flex:1"></div>
    <button class="btn primary" id="newBtn"></button>
  </div>
  <div class="muted" style="margin-bottom:14px">
    产品是接入的基本单位：每个产品有自己的风格主题与组件注册表，对应一个专属的后端 API 接口、一个前端 JS/CSS 代码块和一份数据块 Schema。
  </div>
  <div id="listBox"></div>
</div>

<script>window.SIA_PLATFORM="ia";</script>
<script src="./mock_data.js?v=4147c496"></script>
<script src="./mock_api.js?v=582ad7ee"></script>
<script src="./tokens.js?v=be27f7d8"></script>
<script src="./ui.js?v=e6887116"></script>
<script>
UI.nav("products");
const { el } = UI;

let brands = [], liveCards = [], allCards = [], products = [];

function shortProductId(pid) {
  const hex = String(pid).replace(/[^0-9a-f]/gi, "").slice(0, 8) || "0";
  return String(parseInt(hex, 16) % 1000000).padStart(6, "0");
}

function brandName(file) {
  const b = brands.find(x => x.file === file);
  return b ? (b.brand_name || b.file) : file;
}


// 数据块 Schema：产品与接入方之间的数据契约
// params_schema 给模型当工具声明（模型据此生成调用参数）；submit_schema 是用户提交后的回传结构（agent 后端据此解析）
async function viewSchemas(p) {
  let reg;
  try { reg = await UI.api(`/v1/products/${p.product_id}/registry?key=${p.mcp_key}`); }
  catch (e) { UI.toast(e.data?.error || e.message, true); return; }
  const comps = reg.components || [];
  const blocks = comps.map(c => {
    const pre1 = el("pre", { class: "schema-pre" }, [JSON.stringify(c.params_schema || {}, null, 2)]);
    const kids = [
      el("div", { style: "display:flex;align-items:center;gap:8px;flex-wrap:wrap" }, [
        el("span", { style: "font-weight:600" }, [c.name || c.type]),
        el("span", { class: "chip" }, [c.interactive ? "交互类" : "展示类"]),
        el("span", { class: "cr-id num", style: "cursor:pointer", title: "点击复制组件实例 ID",
          onclick: () => { navigator.clipboard.writeText(c.component_id); UI.toast("已复制组件实例 ID"); } }, [c.component_id]),
      ]),
      el("div", { class: "muted", style: "font-size:var(--font-caption);margin:6px 0 4px" }, ["params_schema · 模型调用参数（工具声明）"]),
      pre1,
    ];
    if (c.submit_schema && Object.keys(c.submit_schema).length) {
      kids.push(el("div", { class: "muted", style: "font-size:var(--font-caption);margin:8px 0 4px" }, ["submit_schema · 用户提交后的回传结构"]));
      kids.push(el("pre", { class: "schema-pre" }, [JSON.stringify(c.submit_schema, null, 2)]));
    }
    return el("div", { style: "border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px" }, kids);
  });
  UI.modal(`数据块 Schema · ${p.name}`, el("div", { style: "max-height:64vh;overflow:auto" }, [
    el("div", { class: "drawer-meta", style: "margin-bottom:10px" }, [
      el("span", { class: "muted" }, [`注册表版本 ${reg.registry_version} · ${comps.length} 个组件实例`]),
      el("div", { style: "flex:1" }),
      el("button", { class: "btn small", onclick: () => { navigator.clipboard.writeText(JSON.stringify(reg, null, 2)); UI.toast("已复制完整注册表 JSON"); } }, [UI.icon("copy", 13), "复制完整注册表"]),
    ]),
    comps.length ? el("div", {}, blocks) : el("div", { class: "muted" }, ["该产品还没有绑定组件，先在上方「绑定组件」里添加"]),
  ]), { width: "640px" });
}

// 产品表单（新建与配置共用）：名称 / 风格主题单选 / 组件多选（标签可删）
function productForm(init, opts = {}) {
  const st = { name: init.name || "", brand_file: init.brand_file || (brands[0] && brands[0].file) || "",
    cardIds: new Set(init.card_ids || []) };
  const nameIn = el("input", { type: "text", maxlength: "15", value: st.name, placeholder: "例如：官网智能客服（1-15 字）" });
  const nameErr = el("div", { class: "field-error" });
  nameIn.oninput = () => { st.name = nameIn.value; nameErr.textContent = ""; };
  const brandSel = UI.fancySelect({ value: st.brand_file, width: "100%",
    options: brands.map(b => [b.file, b.brand_name || b.file]),
    onChange: (v) => st.brand_file = v });
  const node = el("div", { class: "policy-form" }, [
    el("label", { class: "field" }, [el("span", { class: "label-text req" }, ["产品名称"]), nameIn, nameErr]),
    el("label", { class: "field" }, [el("span", { class: "label-text" }, ["风格主题",
      UI.help("该产品里所有组件渲染时使用的风格；在「风格主题」页新建与编辑")]), brandSel]),
  ]);
  return { node, st, nameIn, nameErr };
}

function configProduct(p) {
  const form = productForm(p);
  const err = el("div", { class: "field-error" });
  const origin = location.origin;
  const codeBlock = (title, hint, code) => el("div", { class: "sdk-sec" }, [
    el("div", { class: "sdk-sec-head" }, [
      el("span", { class: "sdk-sec-title" }, [title]),
      hint ? el("span", { class: "muted", style: "font-size:var(--font-caption)" }, [hint]) : null,
      el("div", { style: "flex:1" }),
      el("button", { class: "btn small", title: "复制这段代码",
        onclick: () => { navigator.clipboard.writeText(code); UI.toast("已复制" + title); } }, ["复制"]),
    ]),
    el("pre", { class: "sdk-code num" }, [code]),
  ]);
  const access = el("div", { class: "field", style: "margin-top:4px" }, [
    el("div", { style: "display:flex;align-items:center;gap:6px;margin-bottom:2px" }, [
      el("span", { class: "label-text", style: "margin:0" }, ["产品配置",
        UI.help("每个产品对应：一个后端 API 接口 + 一个前端 JS/CSS 代码块 + 一份数据块 Schema；配置出包时固化，平台修改后需重新拉取部署")]),
      el("div", { style: "flex:1" }),
    ]),
    codeBlock("后端 API 接口", null,
      `GET ${origin}/v1/products/${p.product_id}/registry?key=${p.mcp_key}`),
    codeBlock("前端代码块", null,
      `<link rel="stylesheet" href="${origin}/v1/products/${p.product_id}/sia.css?key=${p.pub_key}">\n<script src="${origin}/web/sia.js" data-key="${p.pub_key}" defer><\/script>`),
  ]);
  const foot = el("div", { style: "display:flex;gap:8px;justify-content:flex-end;align-items:center;width:100%" }, [
    err, el("div", { style: "flex:1" }),
    el("button", { class: "btn", onclick: () => mask.querySelector(".close-btn")?.click() }, ["取消"]),
    el("button", { class: "btn primary", onclick: async (e) => {
      if (!form.st.name.trim()) { form.nameErr.textContent = "产品名称必填"; form.nameIn.focus(); return; }
      await UI.withBusy(e.currentTarget, async () => {
        try {
          await UI.api(`/api/products/${p.product_id}`, { method: "PUT", body: {
            name: form.st.name.trim(), brand_file: form.st.brand_file } });
          UI.toast("已保存应用");
          mask.querySelector(".close-btn")?.click();
          load();
        } catch (e2) { err.textContent = e2.data?.error || e2.message; }
      }, "保存中……");
    } }, ["保存应用"]),
  ]);
  const mask = UI.drawer("产品配置", el("div", {}, [form.node, access]), foot);
}

function newProductDialog() {
  const form = productForm({});
  const err = el("div", { class: "field-error" });
  const mask = UI.modal("新建产品", el("div", {}, [form.node, err,
    el("div", { style: "display:flex;justify-content:flex-end;gap:10px;margin-top:12px" }, [
      el("button", { class: "btn", onclick: () => mask.remove() }, ["取消"]),
      el("button", { class: "btn primary", onclick: async (e) => {
        if (!form.st.name.trim()) { form.nameErr.textContent = "请填写产品名称（1-15 字）"; form.nameIn.focus(); return; }
        await UI.withBusy(e.currentTarget, async () => {
          try {
            const r = await UI.api("/api/products", { method: "POST", body: {
              name: form.st.name.trim(), brand_file: form.st.brand_file } });
            mask.remove();
            await load();
            const p = products.find(x => x.product_id === r.product_id);
            if (p) configProduct(p);
            UI.toast("产品已创建，MCP 接入信息见抽屉");
          } catch (e2) { form.nameErr.textContent = e2.data?.error || e2.message; }
        }, "创建中……");
      } }, ["创建产品"]),
    ]),
  ]), null, { persistent: true });
  setTimeout(() => form.nameIn.focus(), 100);
}

function draw() {
  const box = document.getElementById("listBox");
  box.innerHTML = "";
  if (!products.length) {
    box.appendChild(el("div", { class: "card empty-state" }, [
      el("div", { class: "empty-title" }, ["还没有产品"]),
      el("div", {}, ["新建产品，把组件和风格主题打包成一个 MCP 接入点"]),
      el("button", { class: "btn primary", style: "margin-top:12px", onclick: newProductDialog }, ["新建产品"]),
    ]));
    return;
  }
  products.forEach(p => {
    box.appendChild(el("div", { class: "card policy-card", style: "margin-bottom:10px" }, [
      el("div", { style: "display:flex;align-items:center;gap:8px;flex-wrap:wrap" }, [
        el("span", { style: "font-weight:700;font-size:var(--font-title);width:200px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap", title: p.name }, [p.name]),
        el("div", { style: "flex:1" }),

        el("button", { class: "btn small", onclick: () => configProduct(p) }, ["产品配置"]),
        (() => { const more = el("button", { class: "btn iconic round", title: "更多", "aria-label": "更多操作",
          onclick: () => { UI.menu(more, [
            { label: "复制产品", onClick: async () => {
              // 克隆配置（主题 + 组件集），Key 按新产品自动派生
              const base = (p.name.length > 12 ? p.name.slice(0, 12) : p.name) + " 副本";
              for (let i = 0; i < 8; i++) {
                const name = i === 0 ? base : base + (i + 1);
                try {
                  await UI.api("/api/products", { method: "POST", body: { name, brand_file: p.brand_file, card_ids: p.card_ids } });
                  UI.toast(`已复制为「${name}」`); load();
                  return;
                } catch (e2) {
                  if (e2.status !== 409) { UI.toast(e2.data?.error || e2.message, true); return; }
                }
              }
              UI.toast("副本太多了，请先清理", true);
            } },
            { label: "删除", danger: true, onClick: async () => {
              const ok = await UI.confirm("删除产品", `删除「${p.name}」后，它的接入 Key 与注册表立即失效，已出包的 SDK 将无法工作。`, { okText: "删除", danger: true });
              if (!ok) return;
              try { await UI.api(`/api/products/${p.product_id}/delete`, { method: "POST" }); UI.toast("已删除"); load().then(() => {
  // ?new=1 深链（切换器「新建产品」）：自动打开新建弹窗
  if (new URLSearchParams(location.search).get("new")) newProductDialog();
}); }
              catch (e2) { UI.toast(e2.data?.error || e2.message, true); }
            } },
          ]); } }, [UI.icon("more", 15)]); return more; })(),
      ]),
      el("div", { style: "display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap" }, [
        el("span", { class: "key-chip static", title: "产品 ID" },
          [el("span", { class: "num" }, ["ID:" + shortProductId(p.product_id)])]),

      ]),
      (() => {
        const bound = p.card_ids || [];
        const online = bound.filter(cid => (allCards.find(x => x.card_id === cid) || {}).status === "published").length;
        return el("div", { class: "muted", style: "margin-top:8px" }, [
          `风格主题 ${brandName(p.brand_file)} · 组件实例 ${bound.length} 个` +
          (bound.length ? `（${online} 个在线）` : " · 在组件工作台创建，发布后自动加入"),
        ]);
      })(),
    ]));
  });
}

async function load() {
  const [b, c, pr] = await Promise.all([
    UI.api("/api/brands").catch(() => ({ brands: [] })),
    UI.api("/api/cards").catch(() => ({ cards: [] })),
    UI.api("/api/products").catch(() => ({ products: [] })),
  ]);
  brands = b.brands || [];
  allCards = c.cards || [];
  liveCards = allCards.filter(x => x.status === "published" || (x.status === "draft" && x.version >= 1));
  products = pr.products || [];
  draw();
}
const nb = document.getElementById("newBtn");
nb.append(UI.icon("plus", 14), "新建产品");
nb.onclick = newProductDialog;
UI.loading(document.getElementById("listBox"));
load().catch(e => UI.toast("加载失败：" + e.message, true));
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});</script>
</body>
</html>
