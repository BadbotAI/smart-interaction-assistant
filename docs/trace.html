<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%231DA1F2'/%3E%3Crect x='10.5' y='3.6' width='9.6' height='7.3' rx='2.7' fill='none' stroke='%23fff' stroke-width='1.5' opacity='0.75'/%3E%3Cpath d='M3.4 12a3.7 3.7 0 0 1 3.7-3.7h6a3.7 3.7 0 0 1 3.7 3.7v2.3a3.7 3.7 0 0 1-3.7 3.7H9.5l-3.1 2.6c-.55.46-1.3.07-1.3-.64v-2.4A3.7 3.7 0 0 1 3.4 14.3z' fill='%23fff'/%3E%3Ccircle cx='7.4' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='10.25' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='13.1' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3C/svg%3E">
<title>对话记录 · 智能交互平台</title>
<link rel="stylesheet" href="./shared.css?v=ff8a4811">
<link rel="prefetch" href="./audit.html"><link rel="prefetch" href="./cards.html"><link rel="prefetch" href="./chat.html"><link rel="prefetch" href="./dashboard.html"><link rel="prefetch" href="./design.html"><link rel="prefetch" href="./embed-demo.html"><link rel="prefetch" href="./index.html"><link rel="prefetch" href="./library.html"><link rel="prefetch" href="./playground.html"><link rel="prefetch" href="./products.html"><link rel="prefetch" href="./trace.html">
<style>
  .span-row { display: flex; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .span-type { min-width: 110px; }
  .span-bar-track { height: 10px; background: transparent; position: relative; margin-top: 6px; }
  .span-bar { position: absolute; height: 10px; border-radius: 3px; background: var(--primary); opacity: 0.85; }
  /* 业务叙事时间线 */
  .story { margin: 6px 0 4px; }
  .story-row { display: flex; gap: 10px; padding: 7px 0; align-items: flex-start; }
  .story-row .s-icon {
    width: 26px; height: 26px; border-radius: 50%; background: var(--bg-page); color: var(--text-secondary);
    display: inline-flex; align-items: center; justify-content: center; flex: none; margin-top: 1px;
  }
  .story-row.hit .s-icon { background: var(--primary-weak); color: var(--primary); }
  .story-row.warn .s-icon { background: var(--warning-bg); color: var(--warning); }
  .story-row .s-body { flex: 1; min-width: 0; padding-top: 3px; }
  .story-row .s-sub { color: var(--text-muted); font-size: var(--font-small); margin-top: 1px; }
</style>
</head>
<body>
<div class="page">
  <div class="page-head" style="display:flex;align-items:center;gap:6px">
    <div class="page-title">对话记录</div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input type="text" id="traceIdInput" placeholder="按记录 ID 查找" style="max-width:240px" aria-label="记录 ID">
      <select id="pathFilter" style="max-width:160px" aria-label="处理方式筛选">
        <option value="">全部处理方式</option>
        <option value="await_user">触发了组件</option>
        <option value="fastlane">快车道直答</option>
        <option value="routed">单模型回答</option>
        <option value="aggregated">多模型聚合</option>
        <option value="manual">手动指定</option>
        <option value="degraded">降级</option>
      </select>
      <select id="specialFilter" style="max-width:150px">
        <option value="">全部</option>
        <option value="failed">失败</option>
        <option value="high_cost">高成本</option>
        <option value="high_latency">高延迟</option>
        <option value="explore">探索流量</option>
      </select>
      <button class="btn" id="searchBtn">查询</button>
    </div>
  </div>

  <div class="grid" style="grid-template-columns: 400px 1fr; align-items: start">
    <div class="card" style="padding:0" id="traceList"></div>
    <div class="card" id="traceDetail">
      <div class="empty-state"><div class="empty-title">选择一条记录</div></div>
    </div>
  </div>
</div>

<script>window.SIA_PLATFORM="ia";</script>
<script src="./mock_data.js?v=3a63fde5"></script>
<script src="./mock_api.js?v=fa600068"></script>
<script src="./tokens.js?v=323789e0"></script>
<script src="./ui.js?v=f737bd16"></script>
<script>
UI.nav("trace");
const { el } = UI;

const SPAN_NAMES = {
  user_input: "用户输入", embed: "向量化", route_score: "候选模型打分", model_call: "模型调用",
  route_switch: "单模型 / 聚合决策", aggregate: "聚合总结", card_render: "组件渲染",
  card_interact: "组件交互", label_emit: "标签产出", tool_call: "工具调用",
};
const PATH_NAMES = { fastlane: "快车道", routed: "单模型", aggregated: "多模型聚合", degraded: "降级", manual: "手动指定", await_user: "触发组件" };
const PAGE = 60;
let listOffset = 0;
let selectedTraceId = null;

function listParams() {
  const path = document.getElementById("pathFilter").value;
  const special = document.getElementById("specialFilter").value;
  const params = new URLSearchParams({ limit: PAGE, offset: listOffset });
  if (path) params.set("switch_result", path);
  if (special === "failed") params.set("status", "error");
  if (special === "high_cost") params.set("min_cost", "0.005");
  if (special === "high_latency") params.set("min_latency", "3000");
  if (special === "explore") params.set("is_explore", "true");
  return params;
}

function traceRow(t) {
  const failed = t.status && t.status !== "ok";
  const row = el("div", {
    class: "row-item" + (t.trace_id === selectedTraceId ? " active" : ""), "data-trace": t.trace_id,
    style: "display:block;padding:10px 14px;cursor:pointer",
    onclick: () => loadDetail(t.trace_id),
  }, [
    el("div", { style: "display:flex;gap:6px;align-items:center" }, [
      el("span", { class: "chip blue" }, [PATH_NAMES[t.switch_result] || t.switch_result || "-"]),
      failed ? el("span", { class: "chip red" }, ["失败"]) : null,
      t.is_explore ? el("span", { class: "chip yellow" }, ["探索"]) : null,
      el("span", { class: "muted" }, [UI.fmtTs(t.ts)]),
    ]),
    el("div", { style: "margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" }, [t.query_text || "（无文本）"]),
    el("div", { class: "muted num" }, [`${t.final_model || "-"} · ${UI.fmtCost(t.total_cost)} · ${UI.fmtMs(t.total_latency_ms)}`]),
  ]);
  return row;
}

async function loadList(append = false) {
  if (!append) listOffset = 0;
  const { traces } = await UI.api("/api/traces?" + listParams());
  const list = document.getElementById("traceList");
  if (!append) list.innerHTML = "";
  list.querySelector(".load-more")?.remove();
  if (!traces.length && !append) {
    list.appendChild(el("div", { class: "empty-state" }, [el("div", { class: "empty-title" }, ["没有符合条件的记录"])]));
    return;
  }
  traces.forEach(t => list.appendChild(traceRow(t)));
  listOffset += traces.length;
  if (traces.length === PAGE) {
    list.appendChild(el("div", { class: "load-more", style: "padding:10px;text-align:center" }, [
      el("button", { class: "btn small", onclick: (e) => UI.withBusy(e.currentTarget, () => loadList(true), "加载中……") }, ["加载更多"]),
    ]));
  }
}

function highlightSelected() {
  document.querySelectorAll("#traceList .row-item").forEach(n => n.classList.toggle("active", n.dataset.trace === selectedTraceId));
}

// ---------- 业务叙事：把 span 翻译成「发生了什么」 ----------
function storyRow(iconName, text, sub, cls = "") {
  return el("div", { class: "story-row " + cls }, [
    el("span", { class: "s-icon" }, [UI.icon(iconName, 14)]),
    el("div", { class: "s-body" }, [
      el("div", {}, Array.isArray(text) ? text : [text]),
      sub ? el("div", { class: "s-sub" }, [sub]) : null,
    ]),
  ]);
}

function buildStory(t) {
  const spans = t.spans || [];
  const by = type => spans.filter(s => s.span_type === type);
  const story = el("div", { class: "story" });

  // 1. 用户提问
  story.appendChild(storyRow("user", `用户提问：${t.query_text || "（无文本）"}`));

  // 2. 命中交互配置
  by("card_render").forEach(s => {
    const p = s.payload || {};
    if (p.card_id) {
      story.appendChild(storyRow("sliders", [
        `命中交互配置，向用户展示「${UI.ctName(p.component_type)}」组件 `,
        el("a", { href: "./cards.html?edit=" + p.card_id, class: "num", title: "打开该配置" }, [UI.shortId(p.card_id)]),
        el("span", { class: "num" }, [` v${p.card_version ?? "-"}`]),
      ], p.degraded ? "组件渲染失败，已降级为纯文本" : null, p.degraded ? "warn" : "hit"));
    } else if (p.component_type) {
      story.appendChild(storyRow("grid", `展示「${UI.ctName(p.component_type)}」组件（${({ post_classification: "按回答内容自动选择", system_injected: "系统注入", model_tool_call: "AI 主动调用" })[p.trigger_source] || ""}）`,
        p.degraded ? "渲染失败，已降级为纯文本" : null, p.degraded ? "warn" : ""));
    }
  });

  // 3. 用户操作
  by("card_interact").forEach(s => {
    const p = s.payload || {};
    if (p.event_type === "card_submitted") {
      story.appendChild(storyRow("check", `用户提交${p.payload_summary?.user_selection ? `：选择「${p.payload_summary.user_selection}」` : ""}`, null, "hit"));
    } else if (p.event_type === "card_abandoned") {
      story.appendChild(storyRow("x", "用户跳过了组件", null, "warn"));
    } else if (p.event_type === "feedback_given") {
      story.appendChild(storyRow("check", "用户给出了反馈"));
    }
  });

  // 4. 模型回答
  const calls = by("model_call");
  const sw = t.switch_result;
  const cost = `${UI.fmtMs(t.total_latency_ms)} · ${UI.fmtCost(t.total_cost)}`;
  if (sw === "await_user") {
    story.appendChild(storyRow("chat", "本轮等待用户操作组件，未调用模型"));
  } else if (sw === "fastlane") {
    story.appendChild(storyRow("cpu", `高置信直连：由 ${t.final_model} 直接回答`, cost));
  } else if (sw === "routed") {
    story.appendChild(storyRow("cpu", `从 ${Math.max(calls.length, 1)} 个候选中选用 ${t.final_model} 回答`, cost));
  } else if (sw === "aggregated") {
    story.appendChild(storyRow("cpu", `${calls.length} 个模型并发作答，由 ${t.final_model} 总结成一份`, cost));
  } else if (sw === "manual") {
    story.appendChild(storyRow("cpu", `按管理端指定，由 ${t.final_model} 回答`, cost));
  } else if (sw === "degraded") {
    story.appendChild(storyRow("refresh", `主选模型异常，已切换兜底模型 ${t.final_model || "-"}`, cost, "warn"));
  }
  if (t.is_explore) story.appendChild(storyRow("split", "本次为探索流量：随机试用非最优模型，用于保持路由多样性"));

  // 5. 反馈沉淀
  const labels = by("label_emit").length;
  if (labels) story.appendChild(storyRow("refresh", `沉淀 ${labels} 条反馈标签，进入回流优化`));

  return story;
}

async function loadDetail(traceId, unmask = false) {
  let t;
  try {
    t = await UI.api(`/api/traces/${traceId}?unmask=${unmask}`);
  } catch (e) {
    UI.toast("记录不存在，请检查 ID", true);
    return;
  }
  selectedTraceId = traceId;
  highlightSelected();
  const box = document.getElementById("traceDetail");
  box.innerHTML = "";
  const failed = t.status && t.status !== "ok";
  box.appendChild(el("div", { style: "display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px" }, [
    el("span", { style: "font-weight:600" }, ["处理过程"]),
    el("span", { class: "chip blue" }, [PATH_NAMES[t.switch_result] || t.switch_result || "-"]),
    failed ? el("span", { class: "chip red" }, ["失败"]) : null,
    UI.idChip(t.trace_id, "记录"),
    el("div", { style: "flex:1" }),
    unmask
      ? el("span", { class: "chip yellow" }, ["已解除脱敏"])
      : el("button", { class: "btn small", onclick: async () => {
          const ok = await UI.confirm("解除脱敏", "将以你的账号记入审计日志。", { okText: "解除脱敏" });
          if (ok) loadDetail(traceId, true);
        } }, ["完整原文"]),
  ]));

  box.appendChild(buildStory(t));

  // 技术详情：span 瀑布收进折叠，供排障使用
  const spans = t.spans || [];
  const t0 = spans.length ? Math.min(...spans.map(s => s.ts)) : 0;
  const tEnd = spans.length ? Math.max(...spans.map(s => s.ts + (s.duration_ms || 0) / 1000)) : 1;
  const total = Math.max(0.001, tEnd - t0);
  const waterfall = el("div", {});
  spans.forEach(s => {
    const left = ((s.ts - t0) / total * 100);
    const width = Math.max(0.8, (s.duration_ms || 0) / 1000 / total * 100);
    const statusChip = s.status !== "ok"
      ? el("span", { class: "chip " + (s.status === "timeout" ? "red" : "yellow"), style: "margin-left:6px" }, [s.status]) : null;
    waterfall.appendChild(el("div", { class: "span-row" }, [
      el("div", { class: "span-type" }, [
        el("div", { style: "font-weight: 600;font-size:var(--font-small)" }, [SPAN_NAMES[s.span_type] || s.span_type]),
        s.duration_ms ? el("div", { class: "muted" }, [UI.fmtMs(s.duration_ms)]) : null,
      ]),
      el("div", { style: "flex:1;min-width:0" }, [
        el("div", { class: "span-bar-track" }, [
          el("div", { class: "span-bar", style: `left:${left}%;width:${width}%;` +
            (s.status !== "ok" ? "background:var(--danger)" : "") }),
        ]),
        el("div", { style: "margin-top:4px" }, [payloadSummary(s), statusChip]),
        el("details", { style: "margin-top:2px" }, [
          el("summary", { class: "muted", style: "cursor:pointer;font-size:var(--font-small)" }, ["原始数据"]),
          el("pre", { class: "code" }, [JSON.stringify(s.payload, null, 2)]),
        ]),
      ]),
    ]));
  });
  box.appendChild(el("details", { style: "margin-top:10px" }, [
    el("summary", { class: "muted", style: "cursor:pointer" }, [`技术详情（${spans.length} 个执行段，含耗时瀑布）`]),
    waterfall,
  ]));
}

function payloadSummary(s) {
  const p = s.payload || {};
  const wrap = el("span", { class: "secondary", style: "font-size:var(--font-small)" });
  if (s.span_type === "user_input") wrap.textContent = p.query || "";
  else if (s.span_type === "route_score") wrap.textContent =
    `相似题 ${p.support_count} 条 · 候选 ${(p.candidates || []).join(", ")} · 总结模型 ${p.aggregator || "-"} · 租户数据权重 ${p.tenant_weight ?? "-"}`;
  else if (s.span_type === "model_call") wrap.textContent =
    `${p.model_id} · ${p.tokens_in || 0}/${p.tokens_out || 0} tok` + (p.tokens_thinking ? ` + 思考 ${p.tokens_thinking}` : "") + ` · ${UI.fmtCost(p.cost)}`;
  else if (s.span_type === "route_switch") wrap.textContent = p.reason
    ? `降级原因：${p.reason}` : `结果 ${p.result || "-"} · 剪掉 ${(p.pruned || []).join(", ") || "无"}`;
  else if (s.span_type === "aggregate") wrap.textContent =
    `总结模型 ${p.aggregator} · 读入 ${p.input_tokens} tok · 参与回答 ${(p.aggregatees || []).join(", ")}` + (p.truncated ? " · 已截断" : "");
  else if (s.span_type === "card_render") wrap.textContent =
    `${UI.ctName(p.component_type)}` + (p.card_id ? ` · 配置 ${UI.shortId(p.card_id)} v${p.card_version ?? "-"}` : "") +
    ` · 触发方式 ${{ model_tool_call: "AI 主动调用", post_classification: "后置判定", system_injected: "系统注入" }[p.trigger_source] || p.trigger_source || "-"}` + (p.degraded ? " · 已降级" : "");
  else if (s.span_type === "card_interact") wrap.textContent =
    `${UI.ctName(p.component_type)} · ${({ card_submitted: "提交", card_abandoned: "放弃", card_interaction_started: "开始交互", feedback_given: "反馈", control_invoked: "控制操作" })[p.event_type] || p.event_type || ""}` + (p.payload_summary?.user_selection ? ` · 选择「${p.payload_summary.user_selection}」` : "");
  else if (s.span_type === "label_emit") wrap.textContent =
    `${UI.ctName(p.component_type)} 产出标签`;
  else wrap.textContent = "";
  return wrap;
}

document.getElementById("searchBtn").onclick = () => {
  const tid = document.getElementById("traceIdInput").value.trim();
  if (tid) loadDetail(tid);
  else loadList();
};
document.getElementById("traceIdInput").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("searchBtn").click(); });
document.getElementById("pathFilter").onchange = () => loadList();
document.getElementById("specialFilter").onchange = () => loadList();

const urlTid = new URLSearchParams(location.search).get("trace_id");
if (urlTid) document.getElementById("traceIdInput").value = urlTid;
loadList().then(() => { if (urlTid) loadDetail(urlTid); });
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});</script>
</body>
</html>
