<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231DA1F2'/%3E%3Cpath d='M14 18h36a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H31l-9 9v-9h-8a2 2 0 0 1-2-2V20a2 2 0 0 1 2-2z' fill='%23fff'/%3E%3Ccircle cx='24' cy='29' r='3.2' fill='%231DA1F2'/%3E%3Ccircle cx='32' cy='29' r='3.2' fill='%231DA1F2'/%3E%3Ccircle cx='40' cy='29' r='3.2' fill='%231DA1F2'/%3E%3C/svg%3E">
<title>测试 · 智能交互平台</title>
<link rel="stylesheet" href="./shared.css">
<link rel="prefetch" href="./cards.html"><link rel="prefetch" href="./library.html"><link rel="prefetch" href="./router.html"><link rel="prefetch" href="./dashboard.html"><link rel="prefetch" href="./design.html">
</head>
<body>
<div class="page">
  <div class="page-head" style="display:flex;align-items:center;gap:6px">
    <div class="page-title" id="pgTitle">组件测试</div>
    <span id="pgHelp"></span>
    <div style="flex:1"></div>
    <button class="btn small" id="newSess">新对话</button>
  </div>
  <div id="chatHost"></div>
</div>

<script src="./mock_data.js"></script>
<script src="./mock_api.js"></script>
<script src="./tokens.js"></script>
<script src="./ui.js"></script>
<script src="./components.js"></script>
<script src="./testchat.js"></script>
<script>
const { el } = UI;
const MODES = {
  comp: { nav: "playground:comp", title: "组件测试",
    help: "像用户一样提问：验证触发命中、组件交互、提交续轮与数据回传的全链路。测试流量不计入业务看板。",
    opts: { hint: "像用户一样提问开始测试，例如：我的货三天没更新了" } },
  model: { nav: "playground:model", title: "模型测试",
    help: "验证路由决策：左下选择调度策略、多模型回答或指定模型，每次回答展示完整思考过程与路由决策（策略 / 候选模型 / 成本明细）。",
    opts: { keepReasoning: true, hint: "提问并观察选用的模型与完整决策过程；左下可切换调度策略" } },
};
function mode() { return MODES[location.hash.replace("#", "")] ? location.hash.replace("#", "") : "comp"; }
function boot() {
  const m = MODES[mode()];
  UI.nav(m.nav);
  document.getElementById("pgTitle").textContent = m.title;
  document.title = m.title + " · 智能交互平台";
  const help = document.getElementById("pgHelp"); help.innerHTML = "";
  help.appendChild(UI.help(m.help));
  const prefill = new URLSearchParams(location.search).get("q") || "";
  TestChat.open({ ...m.opts, mountEl: "#chatHost", prefill });
}
document.getElementById("newSess").onclick = () => boot();
window.addEventListener("hashchange", () => boot());
boot();
</script>
</body>
</html>
