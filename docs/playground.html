<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%231DA1F2'/%3E%3Crect x='10.5' y='3.6' width='9.6' height='7.3' rx='2.7' fill='none' stroke='%23fff' stroke-width='1.5' opacity='0.75'/%3E%3Cpath d='M3.4 12a3.7 3.7 0 0 1 3.7-3.7h6a3.7 3.7 0 0 1 3.7 3.7v2.3a3.7 3.7 0 0 1-3.7 3.7H9.5l-3.1 2.6c-.55.46-1.3.07-1.3-.64v-2.4A3.7 3.7 0 0 1 3.4 14.3z' fill='%23fff'/%3E%3Ccircle cx='7.4' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='10.25' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='13.1' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3C/svg%3E">
<title>测试 · 智能交互平台</title>
<link rel="stylesheet" href="./shared.css?v=603e294c">
<link rel="prefetch" href="./audit.html"><link rel="prefetch" href="./cards.html"><link rel="prefetch" href="./dashboard.html"><link rel="prefetch" href="./design.html"><link rel="prefetch" href="./embed-demo.html"><link rel="prefetch" href="./index.html"><link rel="prefetch" href="./library.html"><link rel="prefetch" href="./playground.html"><link rel="prefetch" href="./products.html">
</head>
<body class="has-side">
<div class="page">
  <div class="page-head" style="display:flex;align-items:center;gap:12px">
    <div class="page-title" id="pgTitle">对话测试</div>
    <div style="flex:1"></div>
    <button class="btn iconic round" id="newSess" title="新对话" aria-label="新对话"></button>
  </div>
  <div id="chatHost"></div>
</div>

<script>window.SIA_PLATFORM="ia";</script>
<script src="./mock_data.js?v=1cfe6b11"></script>
<script src="./mock_api.js?v=39bf88f4"></script>
<script src="./tokens.js?v=64d83daa"></script>
<script src="./ui.js?v=2571c57c"></script>
<script src="./components.js?v=fc7a3e7f"></script>
<script src="./testchat.js?v=31ecca24"></script>
<script>
const { el } = UI;
const MODES = {
  comp: { nav: "playground:comp", title: "组件测试", seg: "组件测试",
    help: "v2 组件是泛化的：何时出组件由 agent 侧的大模型决定，平台测不了也不该测模型行为。平台侧要验证的是「渲染与契约」——组件在各种模型参数下长什么样、样式对不对、参数异常时降级是否成立、提交回传的数据结构是否符合 schema。这里就是做这件事的：模拟模型给参数，直接看渲染与回传。" },
  model: { nav: "playground:model", title: "模型路由测试", seg: "模型路由测试",
    help: "验证路由怎么选模型：切换不同路由策略问同一个问题，每次回答展示完整过程与成本。" },
};
function mode() { return MODES[location.hash.replace("#", "")] ? location.hash.replace("#", "") : "comp"; }
// 默认模式：无 hash 直接进入时落到智能交互测试，保证 tab 与导航高亮一致
if (!MODES[location.hash.replace("#", "")]) history.replaceState(null, "", location.pathname + location.search + (window.SIA_PLATFORM === "router" ? "#model" : "#comp"));

async function buildSuggestions(m) {
  if (m === "comp") {
    try {
      const { cards } = await UI.api("/api/cards");
      const live = cards.filter(c => (c.status === "published" || (c.status === "draft" && c.version >= 1)) && (c.trigger_examples || []).length);
      const picks = live.slice(0, 6).map(c => ({ text: c.trigger_examples[0], label: "会触发「" + c.name + "」" }));
      if (picks.length) return picks;
    } catch (e) {}
    return [
      { text: "我的货延误了有哪些处理方式可以选", label: "模型选出「选择表单」并动态给选项" },
      { text: "帮我登记一下联系方式", label: "模型选出「信息表单」" },
      { text: "取消这笔订单", label: "模型选出「操作确认」" },
      { text: "这几个月的费用走势帮我看看", label: "模型选出「图表」直接渲染" },
      { text: "把这几项整理成表格对比一下", label: "模型选出「表格」" },
      { text: "这两个方案你觉得哪个好", label: "模型选出「偏好选择」" },
    ];
  }
  return [
    { text: "帮我看看这段 SQL 为什么慢", label: "代码生成：看判维与打分" },
    { text: "帮我算下这单的毛利率再写一段分析", label: "复合任务：判出双维度" },
    { text: "识别这张图片里的集装箱箱号", label: "多模态：命中硬规则层" },
    { text: "起草一份因台风停止装卸作业的客户通知", label: "长文写作：换个策略对比" },
    { text: "按 JSON 格式逐条列出验收要点", label: "指令遵循" },
    { text: "你好，在吗", label: "闲聊：硬规则轻量直答" },
  ];
}


// ---------- v2 组件调用模拟器：测「渲染与契约」，不测模型行为 ----------
// 三问的答案：1 需要测——但目标变了；2 测样式渲染 / 参数边界降级 / 提交回传结构；
// 3 方法不再是对话命中，而是直接模拟「模型返回的组件调用」，参数可编辑、边界可一键注入。
const SIM_DEMO = {
  "select.single": { prompt: "请选择处理方式", options: ["加急派送", "改约取件时间", "转自提点"], multi: false },
  "select.multi": { prompt: "请勾选适用项", options: ["需要发票", "需要保价", "上门取件"], multi: true },
  "select.card": { prompt: "请选择方案", options: ["方案 A · 时效优先", "方案 B · 成本优先"] },
  "form.structured": { prompt: "请补充以下信息", fields: [
    { key: "contact_name", label: "联系人", required: true }, { key: "contact_phone", label: "联系方式", required: true }] },
  "control.confirm": { prompt: "确认取消本次订单？该操作不可撤销。", summary: "取消后已支付金额将原路退回" },
  "feedback.binary": { prompt: "这条回答怎么样", dimensions: [
    { key: "accuracy", label: "答得准确吗" }, { key: "helpful", label: "有帮助吗" }] },
  "feedback.preference": { candidates: [
    { label: "方案 A", content: "优先保证时效：改走直达线路，成本上浮约 8%。" },
    { label: "方案 B", content: "优先控制成本：维持现有线路，预计多用 2 天。" }] },
  "table": { title: "分区域概览", columns: ["区域", "数量", "环比"], rows: [["华东", "352", "2.3%"], ["华南", "332", "1.5%"]] },
  "chart.line": { title: "近半年走势", categories: ["4月", "5月", "6月", "7月", "8月", "9月"], series: [{ name: "金额", values: [122, 165, 148, 161, 178, 190] }] },
  "chart.bar": { title: "分区域对比", categories: ["华东", "华南", "华北"], series: [{ name: "数量", values: [352, 332, 372] }] },
  "chart.pie": { title: "构成占比", slices: [{ label: "华东", value: 42 }, { label: "华南", value: 27 }, { label: "其他", value: 31 }] },
  "metric.card": { label: "本月累计金额", value: "1,286", unit: "万元", delta: "4.2%" },
  "timeline": { title: "处理进度", events: [{ ts: "09:20", title: "已受理" }, { ts: "10:05", title: "处理中", desc: "已分派专员" }] },
  "steps": { title: "操作指引", steps: ["填写信息", "上传凭证", "等待审核"], current_index: 1 },
};
const SIM_EDGE = {
  "空参数（看降级）": () => ({}),
  "超长选项（看截断与换行）": (base) => ({ ...base, options: Array.from({ length: 12 }, (_, i) => "选项" + (i + 1) + " · 这是一条非常非常长的候选项文本用来验证换行与截断表现") }),
  "缺少必填（看校验）": (base) => { const b = { ...base }; delete b.options; delete b.candidates; delete b.columns; delete b.rows; delete b.slices; delete b.events; delete b.steps; delete b.fields; return b; },
  "大数据量（看滚动）": (base) => base.rows ? { ...base, rows: Array.from({ length: 40 }, (_, i) => ["行" + (i + 1), String(100 + i), i % 3 + "%"]) } : base,
};

async function bootSimulator() {
  const host = document.getElementById("chatHost");
  host.innerHTML = "";
  const { cards } = await UI.api("/api/cards");
  const pid = localStorage.getItem("sia_product");
  let prods = [];
  try { prods = (await UI.api("/api/products")).products || []; } catch (e) {}
  const prod = prods.find(x => x.product_id === pid) || prods[0];
  const bound = prod ? new Set(prod.card_ids || []) : null;
  const live = cards.filter(c => (c.status === "published" || (c.status === "draft" && c.version >= 1)) && (!bound || bound.has(c.card_id)));
  if (!live.length) { host.appendChild(el("div", { class: "card empty-state" }, [
    el("div", { class: "empty-title" }, ["当前产品还没有已发布组件"]),
    el("a", { class: "btn primary", style: "margin-top:10px", href: "./cards.html" }, ["去工作台"])])); return; }

  let cur = live[0];
  const ta = el("textarea", { rows: 14, spellcheck: "false",
    style: "width:100%;font-family:var(--font-mono, monospace);font-size:12.5px;line-height:1.6" });
  const setDemo = () => { ta.value = JSON.stringify(SIM_DEMO[cur.component_type] || {}, null, 2); };
  setDemo();
  const renderBox = el("div", { class: "card", style: "min-height:280px;background:var(--bg-sunken)" });
  const payloadBox = el("div", {});
  const contractBox = el("div", {});
  async function drawContract() {
    contractBox.innerHTML = "";
    try {
      const r = await UI.api("/api/components/schema-preview", { method: "POST",
        body: { component_type: cur.component_type, config: ((cur.field_bindings || {}).config) || {} } });
      if (r.submit_schema) contractBox.appendChild(el("div", { class: "card", style: "margin-top:12px" }, [
        el("div", { style: "font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px" },
          ["提交回传契约", UI.help("交互类组件用户点提交后，按此结构回传给 agent；下方点提交可看真实 payload")]),
        el("pre", { class: "code", style: "margin:0;max-height:160px;overflow:auto" }, [JSON.stringify(r.submit_schema, null, 2)]),
      ]));
    } catch (e) {}
  }
  const errLine = el("div", { class: "field-error", style: "margin-top:6px" });

  function doRender() {
    errLine.textContent = "";
    renderBox.innerHTML = "";
    payloadBox.innerHTML = "";
    let params;
    try { params = JSON.parse(ta.value || "{}"); } catch (e) { errLine.textContent = "参数不是合法 JSON：" + e.message; return; }
    const env = { schema_version: "1.0.0", render_id: "sim-" + Math.random().toString(36).slice(2, 8),
      component_type: cur.component_type, semantic_category: cur.semantic_category,
      trigger_source: "model_tool_call", card_ref: { card_id: cur.card_id, version: cur.version },
      params, style_overrides: cur.style_overrides || {} };
    if (params.multi === true && cur.component_type === "select.single") env.component_type = "select.multi";
    const ctx = { titleInBubble: true, userId: "simulator",
      sendEvent: () => {},
      onCollectSubmit: (payload) => {
        payloadBox.innerHTML = "";
        payloadBox.appendChild(el("div", { class: "card", style: "margin-top:12px" }, [
          el("div", { style: "font-weight:600;margin-bottom:6px" }, ["提交回传（回传给 agent 的数据）"]),
          el("pre", { class: "code", style: "margin:0;max-height:220px;overflow:auto" }, [JSON.stringify(payload, null, 2)]),
        ]));
      },
      onControl: (action) => {
        payloadBox.innerHTML = "";
        payloadBox.appendChild(el("div", { class: "card", style: "margin-top:12px" }, [
          el("div", { style: "font-weight:600;margin-bottom:6px" }, ["控制回传"]),
          el("pre", { class: "code", style: "margin:0" }, [JSON.stringify({ action }, null, 2)]),
        ]));
      } };
    try { renderBox.appendChild(el("div", { class: "brand-scope" }, [Components.render(env, ctx)])); }
    catch (e) { renderBox.appendChild(el("div", { class: "field-error" }, ["渲染失败（降级触发）：" + e.message])); }
  }

  const instSel = UI.fancySelect({ value: cur.card_id, width: "240px",
    options: live.map(c => [c.card_id, c.name + "（" + (UI.ctName(c.component_type) || c.component_type) + "）"]),
    onChange: (v) => { cur = live.find(c => c.card_id === v); setDemo(); doRender(); drawContract(); } });
  const edgeBtns = el("div", { style: "display:flex;gap:6px;flex-wrap:wrap" },
    Object.entries(SIM_EDGE).map(([nm, fn]) => el("button", { class: "btn small ghost", onclick: () => {
      let base; try { base = JSON.parse(ta.value || "{}"); } catch (e) { base = SIM_DEMO[cur.component_type] || {}; }
      ta.value = JSON.stringify(fn(base), null, 2); doRender();
    } }, [nm])));

  host.appendChild(el("div", { class: "muted", style: "margin:2px 0 12px;max-width:70em" },
    ["组件是泛化的：何时出组件由 agent 侧大模型决定，平台侧测「渲染与契约」——编辑模型参数，验证样式、边界降级与提交回传结构。测试数据不计入业务看板。"]));
  host.appendChild(el("div", { class: "grid", style: "grid-template-columns:minmax(340px,480px) 1fr;gap:14px;align-items:start" }, [
    el("div", { class: "card" }, [
      el("div", { style: "display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap" }, [
        el("span", { style: "font-weight:600" }, ["组件调用"]), instSel,
        el("div", { style: "flex:1" }),
        el("button", { class: "btn small", onclick: () => { setDemo(); doRender(); } }, ["示例参数"]),
      ]),
      el("div", { class: "muted", style: "margin-bottom:6px" }, ["模拟模型返回的调用参数（params，按注册表 schema）："]),
      ta, errLine,
      el("div", { style: "display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap" }, [
        el("span", { class: "muted", style: "flex:none" }, ["边界用例"]), edgeBtns,
      ]),
      el("div", { style: "display:flex;justify-content:flex-end;gap:8px;margin-top:12px" }, [
        el("button", { class: "btn", onclick: () => {
          let params2; try { params2 = JSON.parse(ta.value || "{}"); } catch (e) { UI.toast("参数不是合法 JSON", true); return; }
          navigator.clipboard.writeText(JSON.stringify({ component_id: cur.card_id, params: params2 }, null, 2));
          UI.toast("已复制完整组件调用（component_id + params），可直接交给 agent 开发");
        } }, [UI.icon("copy", 13), "复制调用"]),
        el("button", { class: "btn primary", onclick: doRender }, ["渲染"]),
      ]),
    ]),
    el("div", {}, [
      el("div", { style: "display:flex;align-items:center;gap:8px;margin-bottom:8px" }, [
        el("span", { class: "section-title", style: "margin:0" }, ["渲染结果"]),
        el("span", { class: "muted" }, ["含实例样式覆盖与产品品牌风格；交互类点提交看回传"]),
      ]),
      renderBox, contractBox, payloadBox,
    ]),
  ]));
  doRender();
  drawContract();
}

async function boot() {
  const k = mode();
  const m = MODES[k];
  UI.nav(m.nav);
  document.getElementById("pgTitle").textContent = m.title;
  document.title = m.title + (k === "model" ? " · 模型路由平台" : " · 智能交互平台");
  if (k === "comp") return bootSimulator();
  const prefill = new URLSearchParams(location.search).get("q") || "";
  const autosend = !!new URLSearchParams(location.search).get("send");
  const suggestions = await buildSuggestions(k);
  TestChat.open({
    mountEl: "#chatHost", prefill, autosend, suggestions,
    guideTitle: k === "comp" ? "试试这些问法，看模型选出什么组件" : "换一种策略，问同一个问题，对比路由决策",
    hint: k === "comp"
      ? "点击任意问法发送；大模型按组件说明判断出哪个组件（演示为规则模拟），交互类可提交、展示类直接渲染，也可从组件进入编辑"
      : "下方可切换路由策略与聚合参数（模拟客户端的 aggregate 传参）；每次回答展示判维结果、打分过程、最终去向与本次成本。演示环境：模型与计价均为模拟",
    keepReasoning: k === "model",
    editableCards: k === "comp",
  });
}
const _ns = document.getElementById("newSess");
_ns.append(UI.icon("refresh", 15));
_ns.onclick = () => boot().catch(e => UI.toast("加载失败：" + e.message, true));
window.addEventListener("hashchange", () => boot().catch(e => UI.toast("加载失败：" + e.message, true)));
boot().catch(e => UI.toast("加载失败：" + e.message, true));
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});</script>
</body>
</html>
