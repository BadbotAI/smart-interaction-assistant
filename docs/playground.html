<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%231DA1F2'/%3E%3Crect x='10.5' y='3.6' width='9.6' height='7.3' rx='2.7' fill='none' stroke='%23fff' stroke-width='1.5' opacity='0.75'/%3E%3Cpath d='M3.4 12a3.7 3.7 0 0 1 3.7-3.7h6a3.7 3.7 0 0 1 3.7 3.7v2.3a3.7 3.7 0 0 1-3.7 3.7H9.5l-3.1 2.6c-.55.46-1.3.07-1.3-.64v-2.4A3.7 3.7 0 0 1 3.4 14.3z' fill='%23fff'/%3E%3Ccircle cx='7.4' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='10.25' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='13.1' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3C/svg%3E">
<title>测试 · 智能交互平台</title>
<link rel="stylesheet" href="./shared.css?v=2164e618">
<link rel="prefetch" href="./audit.html"><link rel="prefetch" href="./cards.html"><link rel="prefetch" href="./dashboard.html"><link rel="prefetch" href="./design.html"><link rel="prefetch" href="./embed-demo.html"><link rel="prefetch" href="./index.html"><link rel="prefetch" href="./library.html"><link rel="prefetch" href="./playground.html"><link rel="prefetch" href="./products.html">
</head>
<body class="has-side">
<div class="page">
  <div class="page-head" style="display:flex;align-items:center;gap:12px">
    <div class="page-title" id="pgTitle">对话测试</div>
    <div style="flex:1"></div>
    <button class="btn iconic round" id="newSess" title="新对话" aria-label="新对话"></button>
  </div>
  <div id="chatHost"></div>
</div>

<script>window.SIA_PLATFORM="ia";</script>
<script src="./mock_data.js?v=3eff4040"></script>
<script src="./mock_api.js?v=d77a37db"></script>
<script src="./tokens.js?v=360e29ec"></script>
<script src="./ui.js?v=150b70e8"></script>
<script src="./components.js?v=2e39e148"></script>
<script src="./testchat.js?v=c4849aa7"></script>
<script>
const { el } = UI;
const MODES = {
  comp: { nav: "playground:comp", title: "智能交互测试", seg: "智能交互测试",
    help: "像用户一样提问：命中触发条件时，AI 会在回答里插入你配置的交互组件。在这里验证触发词准不准、组件长什么样、提交后续动作对不对；对效果不满意可从组件直接进编辑。测试数据不计入业务看板。" },
  model: { nav: "playground:model", title: "模型路由测试", seg: "模型路由测试",
    help: "验证路由怎么选模型：切换不同路由策略问同一个问题，每次回答展示完整过程与成本。" },
};
function mode() { return MODES[location.hash.replace("#", "")] ? location.hash.replace("#", "") : "comp"; }
// 默认模式：无 hash 直接进入时落到智能交互测试，保证 tab 与导航高亮一致
if (!MODES[location.hash.replace("#", "")]) history.replaceState(null, "", location.pathname + location.search + (window.SIA_PLATFORM === "router" ? "#model" : "#comp"));

async function buildSuggestions(m) {
  if (m === "comp") {
    try {
      const { cards } = await UI.api("/api/cards");
      const live = cards.filter(c => (c.status === "published" || (c.status === "draft" && c.version >= 1)) && (c.trigger_examples || []).length);
      const picks = live.slice(0, 6).map(c => ({ text: c.trigger_examples[0], label: "会触发「" + c.name + "」" }));
      if (picks.length) return picks;
    } catch (e) {}
    return [{ text: "我的货三天没更新了", label: "触发物流异常处理" }, { text: "我要开发票", label: "触发发票类型确认" }];
  }
  return [
    { text: "我的货三天没更新了帮我催一下", label: "物流服务：看分类匹配与打分" },
    { text: "帮我看看这段 SQL 为什么慢", label: "系统技术：换个策略对比决策" },
    { text: "帮我算下这单的毛利率再做个分析", label: "经营分析：观察聚合定稿" },
    { text: "识别这张图片里的集装箱箱号", label: "多模态：命中硬规则层" },
    { text: "起草一份因台风停止装卸作业的客户通知", label: "公文写作" },
    { text: "你好，在吗", label: "闲聊：硬规则轻量直答" },
  ];
}


async function boot() {
  const k = mode();
  const m = MODES[k];
  UI.nav(m.nav);
  document.getElementById("pgTitle").textContent = m.title;
  document.title = m.title + (k === "model" ? " · 模型路由平台" : " · 智能交互平台");
  const prefill = new URLSearchParams(location.search).get("q") || "";
  const autosend = !!new URLSearchParams(location.search).get("send");
  const suggestions = await buildSuggestions(k);
  TestChat.open({
    mountEl: "#chatHost", prefill, autosend, suggestions,
    guideTitle: k === "comp" ? "试试这些会触发组件的问法" : "换一种策略，问同一个问题，对比路由决策",
    hint: k === "comp"
      ? "点击任意问法发送；命中触发条件时 AI 会插入对应的交互组件，可直接操作提交、也可从组件进入编辑"
      : "下方可切换路由策略与聚合参数（模拟客户端的 aggregate 传参）；每次回答展示打分过程、最终去向与本次成本。演示环境：模型与计价均为模拟",
    keepReasoning: k === "model",
    editableCards: k === "comp",
  });
}
const _ns = document.getElementById("newSess");
_ns.append(UI.icon("refresh", 15));
_ns.onclick = () => boot().catch(e => UI.toast("加载失败：" + e.message, true));
window.addEventListener("hashchange", () => boot().catch(e => UI.toast("加载失败：" + e.message, true)));
boot().catch(e => UI.toast("加载失败：" + e.message, true));
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});</script>
</body>
</html>
