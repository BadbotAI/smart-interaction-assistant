<style>
  .home { max-width: 920px; margin: 0 auto; padding-top: 9vh; text-align: center; }
  .home .mark { display: inline-flex; margin-bottom: 16px; }
  .home h1 { font-size: 32px; font-weight: 800; letter-spacing: 2px; margin: 0 0 12px; color: var(--text-primary); }
  .home .slogan { font-size: 15px; color: var(--text-secondary); letter-spacing: 6px; margin: 0 0 44px; }
  .home-gates { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: left; }
  @media (max-width: 980px) { .home-gates { grid-template-columns: 1fr; } }
  .hg { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden;
    display: flex; flex-direction: column; cursor: pointer; transition: border-color var(--dur-fast), box-shadow var(--dur-fast), transform var(--dur-fast); }
  .hg:hover { border-color: var(--primary-border); box-shadow: var(--shadow-popover); transform: translateY(-2px); }
  .hg .body { padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .hg h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .hg p { margin: 0 0 8px; font-size: var(--font-base); color: var(--text-secondary); line-height: 1.7; }
  .hg .cta { margin-top: auto; }
  /* ---- 预览器画布 ---- */
  .pv { height: 268px; background: var(--bg-surface); border-bottom: 1px solid var(--border); position: relative; overflow: hidden; padding: 18px; }
  .pv * { box-sizing: border-box; }
  .pv .bub { position: absolute; font-size: 12px; line-height: 1.5; padding: 7px 12px; border-radius: 12px; opacity: 0; }
  .pv .bu { right: 18px; top: 14px; background: var(--panel-deep); color: #fff; border-bottom-right-radius: 4px; animation: pvIn 9s infinite; }
  .pv .ba { left: 18px; top: 52px; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-secondary); border-bottom-left-radius: 4px; animation: pvIn 9s infinite; animation-delay: 0.7s; }
  @keyframes pvIn { 0% { opacity: 0; transform: translateY(8px); } 5%, 88% { opacity: 1; transform: none; } 94%, 100% { opacity: 0; } }
  /* 组件卡与选项 */
  .pv .comp { position: absolute; left: 18px; top: 92px; width: 250px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 10px; opacity: 0; animation: pvIn 9s infinite; animation-delay: 1.4s; }
  .pv .opt { border: 1px solid var(--border); border-radius: 9px; padding: 6px 10px; font-size: 12px; color: var(--text-primary); margin-bottom: 6px; background: var(--bg-elevated); }
  .pv .opt.picked { animation: pvPick 9s infinite; }
  @keyframes pvPick { 0%, 22% { border-color: var(--border); background: var(--bg-elevated); } 27%, 88% { border-color: var(--primary); background: var(--primary-weak); } 94%, 100% { border-color: var(--border); background: var(--bg-elevated); } }
  .pv .echo { margin-top: 2px; opacity: 0; animation: pvIn 9s infinite; animation-delay: 3.2s; }
  .pv .echo .et { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .pv .ebar { height: 8px; border-radius: 999px; background: var(--bg-sunken); margin-bottom: 5px; overflow: hidden; position: relative; }
  .pv .ebar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--primary); width: 0; animation: pvGrow 9s infinite; }
  .pv .ebar.e2 i { background: var(--primary-border); animation-name: pvGrow2; }
  @keyframes pvGrow { 0%, 36% { width: 0; } 46%, 88% { width: 71%; } 94%, 100% { width: 0; } }
  @keyframes pvGrow2 { 0%, 38% { width: 0; } 48%, 88% { width: 29%; } 94%, 100% { width: 0; } }
  .pv .elab { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); }
  /* 路由动画 */
  .pv .rfan { position: absolute; left: 0; top: 42px; width: 100%; height: 40px; overflow: visible; }
  .pv .rfan { opacity: 0; animation: pvFade 9s infinite; }
  .pv .rfan path { fill: none; stroke: var(--primary-border); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  @keyframes pvFade { 0%, 6% { opacity: 0; } 14%, 88% { opacity: 1; } 94%, 100% { opacity: 0; } }
  .pv .rq { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; top: 14px; background: var(--panel-deep); color: #fff; font-size: 12px; padding: 6px 14px; border-radius: 999px; opacity: 0; animation: pvIn 9s infinite; }
  .pv .rm { position: absolute; top: 82px; width: 108px; text-align: center; font-size: 12px; font-weight: 600; color: var(--text-primary); background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 7px 6px 8px; opacity: 0; animation: pvIn 9s infinite; }
  .pv .rm .sc { height: 5px; border-radius: 999px; background: var(--bg-sunken); margin-top: 6px; overflow: hidden; position: relative; }
  .pv .rm .sc i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--primary); width: 0; }
  .pv .rm.win { animation: pvWin 9s infinite; }
  @keyframes pvWin { 0%, 30% { border-color: var(--border); box-shadow: none; opacity: 0; } 18% { opacity: 1; } 36%, 88% { opacity: 1; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-weak); } 94%, 100% { opacity: 0; } }
  .pv .rm .sc i { animation: pvSc 9s infinite; }
  @keyframes pvSc { 0%, 22% { width: 0; } 32%, 88% { width: var(--w); } 94%, 100% { width: 0; } }
  .pv .ragg { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; top: 158px; font-size: 11px; color: var(--primary); background: var(--primary-weak); border-radius: 999px; padding: 4px 12px; opacity: 0; animation: pvIn 9s infinite; animation-delay: 3.6s; }
  .pv .rans { position: absolute; left: 18px; right: 18px; top: 190px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; border-bottom-left-radius: 4px; padding: 8px 12px; font-size: 12px; color: var(--text-secondary); opacity: 0; animation: pvIn 9s infinite; animation-delay: 4.2s; }
  .pv .rans .rc { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
</style>
</head>

<div class="page">
  <div class="home">
    <span class="mark"><svg width="52" height="52" viewBox="0 0 24 24" fill="none"><rect x="10.5" y="3" width="10.5" height="8" rx="3" fill="none" stroke="var(--primary)" stroke-width="1.6" opacity="0.45"/><path d="M3 12a4 4 0 0 1 4-4h6.5a4 4 0 0 1 4 4v2.5a4 4 0 0 1-4 4H9.8l-3.4 2.9c-.6.5-1.4.1-1.4-.7v-2.6A4 4 0 0 1 3 14.5z" fill="var(--primary)"/><circle cx="7.6" cy="13.2" r="1.15" fill="#fff"/><circle cx="10.75" cy="13.2" r="1.15" fill="#fff"/><circle cx="13.9" cy="13.2" r="1.15" fill="#fff"/></svg></span>
    <h1>智能交互平台</h1>
    <p class="slogan">让每次交互反哺智能</p>
    <div class="home-gates">
      <div class="hg" onclick="location.href='./cards.html'">
        <div class="pv" aria-hidden="true">
          <span class="bub bu">我的货三天没更新了</span>
          <span class="bub ba">很抱歉带来不便，请选择处理方式：</span>
          <div class="comp">
            <div class="opt">加急催办</div>
            <div class="opt picked">申请赔付</div>
            <div class="echo">
              <div class="et">提交成功 · 71% 的用户和你选了一样</div>
              <div class="ebar"><i></i></div>
              <div class="ebar e2"><i></i></div>
              <div class="elab"><span>申请赔付 71%</span><span>加急催办 29%</span></div>
            </div>
          </div>
        </div>
        <div class="body">
          <h2>富交互</h2>
          <p>把交互组件配置进 AI 对话，收集群体决策</p>
          <div class="cta"><a class="btn primary" href="./cards.html" onclick="event.stopPropagation()">进入智能交互</a></div>
        </div>
      </div>
      <div class="hg" onclick="location.href='https://badbotai.github.io/smart-model-router/router.html#dispatch'">
        <div class="pv" aria-hidden="true">
          <span class="rq">铁矿石价格走势怎么看？</span>
          <svg class="rfan" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
            <path pathLength="60" d="M50 1 C 50 16, 24 18, 24 39"/>
            <path pathLength="60" d="M50 1 L 50 39"/>
            <path pathLength="60" d="M50 1 C 50 16, 76 18, 76 39"/>
          </svg>
          <div class="rm" style="left:calc(24% - 54px);animation-delay:1.1s"><span>Qwen3-Max</span><div class="sc"><i style="--w:52%"></i></div></div>
          <div class="rm win" style="left:calc(50% - 54px)"><span>GLM-4.7</span><div class="sc"><i style="--w:86%"></i></div></div>
          <div class="rm" style="left:calc(76% - 54px);animation-delay:1.5s"><span>MiniMax-M2</span><div class="sc"><i style="--w:64%"></i></div></div>
          <span class="ragg">聚合定稿 · 由 GLM-4.7 融合重写</span>
          <div class="rans">近八周价格整体上行，建议关注供需两端边际变化…<div class="rc">3 路候选 · 成本 ¥0.0021 · 1.2s</div></div>
        </div>
        <div class="body">
          <h2>模型路由</h2>
          <p>通过智能路由，为每次对话选择更合适的模型，优化整体效果及成本</p>
          <div class="cta"><a class="btn primary" href="https://badbotai.github.io/smart-model-router/router.html#models" onclick="event.stopPropagation()">进入模型路由</a></div>
        </div>
      </div>
    </div>
  </div>
</div>
