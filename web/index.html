<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231DA1F2'/%3E%3Cpath d='M14 18h36a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H31l-9 9v-9h-8a2 2 0 0 1-2-2V20a2 2 0 0 1 2-2z' fill='%23fff'/%3E%3Ccircle cx='24' cy='29' r='3.2' fill='%231DA1F2'/%3E%3Ccircle cx='32' cy='29' r='3.2' fill='%231DA1F2'/%3E%3Ccircle cx='40' cy='29' r='3.2' fill='%231DA1F2'/%3E%3C/svg%3E">
<title>智能交互平台</title>
<link rel="stylesheet" href="/web/shared.css">
<style>
  .home { max-width: 760px; margin: 0 auto; padding-top: 9vh; text-align: center; }
  .home .mark { width: 64px; height: 64px; border-radius: 16px; background: var(--primary); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .home h1 { font-size: 26px; font-weight: 700; margin: 0 0 10px; color: var(--text-primary); }
  .home .slogan { font-size: var(--font-title); color: var(--text-secondary); margin: 0 0 40px; }
  .home-gates { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; text-align: left; }
  @media (max-width: 860px) { .home-gates { grid-template-columns: 1fr; } }
  .hg { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 26px; display: flex; flex-direction: column; gap: 10px; transition: border-color var(--dur-fast), box-shadow var(--dur-fast); }
  .hg:hover { border-color: var(--primary-border); box-shadow: var(--shadow-popover); }
  .hg h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .hg p { margin: 0 0 8px; font-size: var(--font-base); color: var(--text-secondary); line-height: 1.7; }
  .hg .cta { margin-top: auto; }
</style>
</head>
<body>
<div class="page">
  <div class="home">
    <span class="mark"><svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M4 6a3.5 3.5 0 0 1 3.5-3.5h9A3.5 3.5 0 0 1 20 6v6.5a3.5 3.5 0 0 1-3.5 3.5H10l-4.2 3.7c-.7.6-1.8.1-1.8-.8z" fill="#fff"/><circle cx="9" cy="9.5" r="1.3" fill="var(--primary)"/><circle cx="13.5" cy="9.5" r="1.3" fill="var(--primary)"/></svg></span>
    <h1>智能交互平台</h1>
    <p class="slogan">让每次交互反哺智能</p>
    <div class="home-gates">
      <div class="hg">
        <h2>富交互</h2>
        <p>把交互组件配置进 AI 对话，收集群体决策</p>
        <div class="cta"><a class="btn primary" href="/web/cards.html">进入智能交互</a></div>
      </div>
      <div class="hg">
        <h2>模型路由</h2>
        <p>通过智能路由，为每次对话选择更合适的模型，优化整体效果及成本</p>
        <div class="cta"><a class="btn primary" href="/web/router.html#models">进入模型路由</a></div>
      </div>
    </div>
  </div>
</div>

<script src="/web/tokens.js"></script>
<script src="/web/ui.js"></script>
<script>UI.nav("home");</script>
</body>
</html>
