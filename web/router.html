<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%231DA1F2'/%3E%3Crect x='10.5' y='3.6' width='9.6' height='7.3' rx='2.7' fill='none' stroke='%23fff' stroke-width='1.5' opacity='0.75'/%3E%3Cpath d='M3.4 12a3.7 3.7 0 0 1 3.7-3.7h6a3.7 3.7 0 0 1 3.7 3.7v2.3a3.7 3.7 0 0 1-3.7 3.7H9.5l-3.1 2.6c-.55.46-1.3.07-1.3-.64v-2.4A3.7 3.7 0 0 1 3.4 14.3z' fill='%23fff'/%3E%3Ccircle cx='7.4' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='10.25' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='13.1' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3C/svg%3E">
<title>模型路由 · 智能交互平台</title>
<link rel="stylesheet" href="/web/shared.css">
</head>
<body>
<div class="page">
  <div class="page-head" style="display:flex;align-items:center;gap:6px"><div class="page-title" id="pageTitle">模型接入</div><span id="pageHelp"></span></div>

  <div id="tabContent"></div>
</div>

<script src="/web/tokens.js"></script>
<script src="/web/ui.js"></script>
<script src="/web/components.js"></script>
<script src="/web/testchat.js"></script>
<script>
UI.nav("router");
const { el } = UI;
document.getElementById("pageHelp").appendChild(UI.help("注册模型 → 数据集回填 → 生成路由画像 → 在线自动路由 → 回流数据持续优化。左侧导航切换板块。"));
// 走查：板块入口只保留左侧导航一处，页内不再放横向 tab（按 #hash 渲染）
const SECTION_NAMES = { models: "模型接入", dispatch: "路由策略", flow: "场景数据集", import: "导入数据集", review: "场景数据集" };
let activeTab = "models";
const DOMAIN_NAMES = { price: "价格行情", sourcing: "采购寻源", capacity: "运力调度", port: "港口作业",
  compliance: "合规审查", weather: "气象风险", analytics: "经营分析", chat: "日常闲聊", general: "通用", untagged: "未标注领域" };
let pollTimer = null;

function showSection(key, first = false) {
  if (key === "profile" || key === "policies") key = "dispatch"; // 旧深链兼容
  if (!RENDER[key]) key = "models";
  if (!first && key === activeTab) return;
  activeTab = key;
  clearInterval(pollTimer); clearTimeout(profilePollTimer);
  document.getElementById("pageTitle").textContent = SECTION_NAMES[key];
  document.title = SECTION_NAMES[key] + " · 智能交互平台";
  UI.loading(content());
  RENDER[key]().catch(e => UI.toast("加载失败：" + e.message, true));
}

const content = () => document.getElementById("tabContent");

// ================= 模型池 =================

async function renderModels() {
  const { models } = await UI.api("/v1/models");
  const box = content();
  box.innerHTML = "";
  const statusChip = { active: ["在线", "green"], registering: ["注册中", "yellow"],
    paused: ["已停用", "gray"], retired: ["已退役", "red"] };
  const table = el("table", { class: "data" }, [
    el("thead", {}, [el("tr", {}, ["供应商", "模型", "状态", "单价 ¥/M（入 / 出）", "思考模式", "数据集覆盖率", "启用情况", "操作"]
      .map(h => el("th", {}, [h])))]),
    el("tbody", {}, models.filter(m => (m.bank_coverage || 0) >= 1)
      .sort((a2, b2) => String(a2.provider).localeCompare(String(b2.provider)) || String(a2.display_name).localeCompare(String(b2.display_name)))
      .map((m, i, arr) => renderModelRow(m, i === 0 || arr[i - 1].provider !== m.provider))),
  ]);
  function renderModelRow(m, firstOfProvider) {
      const [lb, color] = statusChip[m.status] || [m.status, "gray"];
      const caps = m.capabilities || {};
      const coverage = Math.round((m.bank_coverage || 0) * 100);
      const backfill = m.backfill;
      const noCred = m.credential_masked === "****";
      return el("tr", {}, [
        el("td", { style: "font-weight:600" }, [firstOfProvider ? m.provider : ""]),
        el("td", { style: "min-width:200px" }, [
          el("div", { style: "font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap" }, [m.display_name,
            m.is_default ? el("span", { class: "chip blue", style: "flex:none;max-width:none", title: "默认兜底：路由 / 手动模式故障时切换到此模型；不能停用或删凭证" }, ["默认兜底"]) : null]),
          el("div", { class: "muted num" }, [m.model_id + (caps.context_window ? " · " + (caps.context_window / 1024) + "k" : "")])]),
        el("td", {}, [el("span", { class: "chip " + color, title: m.status === "registering" ? "入池评测未完成，不参与路由" : (m.status === "paused" ? "已停用，不参与路由，可随时启用" : "") }, [lb])]),
        el("td", { class: "num", title: "每百万 token 的输入 / 输出单价（人民币）" }, [
          (Number(m.price_input) || Number(m.price_output)) ? `${m.price_input} / ${m.price_output}`
            : el("span", { class: "chip yellow", title: "在「更多」里导入画像数据" }, ["画像数据未导入"])]),
        el("td", {}, [caps.thinking
          ? el("span", { class: "chip blue", title: "支持深度思考（thinking）模式" }, ["支持"])
          : el("span", { class: "muted" }, ["-"])]),
        el("td", { style: "min-width:110px" }, [
          coverage >= 100 && !(backfill && backfill.status === "running")
            ? el("span", { class: "num" }, ["100%"])
            : el("div", {}, [
                el("div", { class: "progress-track" }, [el("div", { class: "progress-fill", style: `width:${coverage}%` })]),
                el("div", { class: "muted" }, [
                  coverage + "%" + (backfill && backfill.status === "running" ? `（评测中 ${backfill.done}/${backfill.total}，预估成本 ¥${backfill.cost_est}）` : ""),
                ]),
              ]),
        ]),
        el("td", {}, [
          UI.toggle({ checked: m.status === "active",
            disabled: noCred || m.is_default,
            disabledHint: noCred ? "凭证未配置，不能启用" : "默认兜底模型不能停用",
            onChange: async (next) => {
              if (!next) {
                const ok = await UI.confirm("停用模型", `停用「${m.display_name}」后立即退出路由候选，进行中的请求自动切换到其他模型。继续？`, { okText: "确认停用" });
                if (!ok) return false;
              }
              try {
                await UI.api(`/v1/models/${m.model_id}/status`, { method: "POST", body: { status: next ? "active" : "paused" } });
                UI.toast(next ? "已启用，即时参与路由" : "已停用");
                renderModels();
                return true;
              } catch (err) { UI.toast(err.data?.error || err.message, true); return false; }
            } }),
        ]),
        el("td", {}, [el("div", { style: "display:flex;gap:6px;align-items:center" }, [
          (() => {
            const more = el("button", { class: "btn small", "aria-label": "更多操作", onclick: () => UI.menu(more, [
              !m.is_default && m.status === "active" ? { label: "设为默认兜底", onClick: async () => {
                const ok = await UI.confirm("设为默认兜底模型", `所有降级 / 故障切换都会落到「${m.display_name}」。建议选择稳定、成本可控的模型。继续？`, { okText: "确认设置" });
                if (!ok) return;
                try { await UI.api(`/v1/models/${m.model_id}/set-default`, { method: "POST" }); UI.toast("已设为默认兜底模型"); renderModels(); }
                catch (e) { UI.toast(e.data?.error || e.message, true); }
              } } : null,
              { label: "导入画像数据", onClick: () => profileDataDialog(m) },
              { label: "复制 model_id", onClick: () => { navigator.clipboard.writeText(m.model_id); UI.toast("已复制"); } },
              m.credential_masked !== "****" ? { label: "删除凭证并暂停", danger: true, onClick: async () => {
                if (m.is_default) { UI.toast("默认兜底模型的凭证不能删除，请先切换默认模型", true); return; }
                const ok = await UI.confirm("删除凭证", `删除「${m.display_name}」的凭证后模型立即暂停，进行中的会话自动切换备选模型。此操作不可撤销。`, { okText: "确认删除", danger: true });
                if (!ok) return;
                try { const r = await UI.api(`/v1/models/${m.model_id}/credential/delete`, { method: "POST" }); UI.toast(r.note); renderModels(); }
                catch (e) { UI.toast(e.data?.error || e.message, true); }
              } } : null,
            ]) }, ["更多"]);
            return more;
          })(),
        ])]),
      ]);
  }
  const pending = models.filter(m => (m.bank_coverage || 0) < 1);
  if (pending.length) {
    const rows = el("div", {});
    pending.forEach(m => {
      const coverage = Math.round((m.bank_coverage || 0) * 100);
      const bf = m.backfill;
      const running = bf?.status === "running";
      const statusText = running ? `评测中 ${bf.done}/${bf.total} · 预估成本 ¥${bf.cost_est}`
        : (bf?.done ? `已暂停（${bf.done}/${bf.total}）` : "未开始评测");
      rows.appendChild(el("div", { class: "bf-row", "data-mid": m.model_id }, [
        el("div", { class: "bf-main" }, [
          el("div", { style: "font-weight:600" }, [m.display_name]),
          el("div", { class: "muted num" }, [m.model_id]),
        ]),
        el("div", { class: "bf-prog" }, [
          el("div", { class: "progress-track" }, [el("div", { class: "progress-fill bf-fill", style: `width:${coverage}%` })]),
          el("div", { class: "muted bf-status" }, [`${coverage}% · ${statusText}`]),
        ]),
        running
          ? el("button", { class: "btn small", onclick: async (e) => { await UI.withBusy(e.currentTarget, async () => { await UI.api(`/v1/models/${m.model_id}/backfill/pause`, { method: "POST" }); renderModels(); }); } }, ["暂停评测"])
          : el("button", { class: "btn small primary", onclick: async (e) => {
              await UI.withBusy(e.currentTarget, async () => {
                await UI.api(`/v1/models/${m.model_id}/backfill`, { method: "POST" });
                UI.toast("入池评测已启动：对各场景数据集逐题作答（可暂停、断点续跑）");
                renderModels();
              }, "启动中……");
            } }, [bf?.done ? "继续评测" : "开始评测"]),
      ]));
    });
    box.appendChild(el("div", { class: "card", style: "margin-bottom:12px" }, [
      el("div", { class: "section-title", style: "margin:0 0 10px;display:flex;align-items:center" }, ["入池评测",
        UI.help("新模型先在各业务场景数据集上逐题作答、由 Judge 打分，建立效果档案；覆盖率 100% 后自动并入下方「已接入模型」参与路由"),
        el("span", { class: "muted", style: "margin-left:8px;font-weight:400" }, [`${pending.length} 个进行中`])]),
      rows,
    ]));
  }
  box.appendChild(el("div", { class: "card" }, [
    el("div", { style: "display:flex;justify-content:space-between;margin-bottom:10px" }, [
      el("div", { class: "section-title", style: "margin:0;display:flex;align-items:center" }, ["已接入模型", UI.help("新模型需先对评测数据集全量回填（入池），覆盖率 100% 才能上线。凭证加密存储、展示脱敏；默认兜底模型不可暂停。")]),
      el("div", { style: "display:flex;gap:8px" }, [
        el("a", { class: "btn", href: "/web/playground.html#model" }, [UI.icon("play", 14), "测试"]),
        el("button", { class: "btn primary", onclick: registerDialog }, [UI.icon("plus", 14), "添加模型"]),
      ]),
    ]),
    table,
  ]));
  if (models.some(m => m.backfill?.status === "running")) {
    clearInterval(pollTimer);
    // 局部轮询：只更新进度条与状态文本；某模型评测完成（覆盖率 100%）才整页刷新一次
    pollTimer = setInterval(async () => {
      if (activeTab !== "models") { clearInterval(pollTimer); return; }
      try {
        const { models: ms } = await UI.api("/v1/models");
        let anyRunning = false, needFull = false;
        document.querySelectorAll(".bf-row[data-mid]").forEach(rowEl => {
          const m = ms.find(x => x.model_id === rowEl.dataset.mid);
          if (!m || (m.bank_coverage || 0) >= 1) { needFull = true; return; }
          const cov = Math.round((m.bank_coverage || 0) * 100);
          const bf = m.backfill;
          if (bf?.status === "running") anyRunning = true;
          const fill = rowEl.querySelector(".bf-fill");
          const st = rowEl.querySelector(".bf-status");
          if (fill) fill.style.width = cov + "%";
          if (st) st.textContent = `${cov}% · ` + (bf?.status === "running"
            ? `评测中 ${bf.done}/${bf.total} · 预估成本 ¥${bf.cost_est}`
            : (bf?.done ? `已暂停（${bf.done}/${bf.total}）` : "未开始评测"));
        });
        if (needFull) { clearInterval(pollTimer); renderModels(); return; }
        if (!anyRunning) clearInterval(pollTimer);
      } catch (e) { /* 单次轮询失败不中断 */ }
    }, 1500);
  }
}

// Judge 模型接入弹窗：复用添加模型的表单样式（接入信息 + 连接校验），校验通过即保存
function judgeDialog(existing, onSaved) {
  if (document.querySelector(".modal-mask")) return;
  const st = { model_id: existing?.model_id || "", display_name: existing?.display_name || "",
               endpoint: existing?.endpoint || "", credential_ref: existing?.credential_ref || "" };
  const fieldEl = (label, key, ph, hint, type = "text") => {
    const n = el("input", { type, value: st[key] ?? "", placeholder: ph });
    n.oninput = () => st[key] = n.value.trim();
    return el("label", { class: "field" }, [
      el("span", { class: "label-text req" }, [label, hint ? UI.help(hint) : null]), n]);
  };
  const err = el("div", { class: "field-error" });
  const saveBtn = el("button", { class: "btn primary", onclick: async (e) => {
    err.textContent = "";
    if (!st.display_name) { err.textContent = "请填写显示名"; return; }
    if (!/^[a-z0-9][a-z0-9-]{1,23}$/.test(st.model_id)) { err.textContent = "模型 ID 需为 2-24 位小写字母、数字或短横线"; return; }
    if (!/^https:\/\/\S+$/.test(st.endpoint)) { err.textContent = "接口地址必须是 https:// 开头的完整 URL"; return; }
    if (!/^vault:\/\/\S+$/.test(st.credential_ref)) { err.textContent = "凭证需为 vault:// 引用（密钥不明文入库）"; return; }
    await UI.withBusy(e.currentTarget, async () => {
      await new Promise(r => setTimeout(r, 600)); // 演示：模拟连通性校验
      try {
        const { judge } = await UI.api("/api/settings/judge-model", { method: "POST", body: st });
        UI.toast("连接校验通过，Judge 模型已保存");
        mask.remove();
        onSaved && onSaved(judge);
      } catch (e2) { err.textContent = e2.data?.error || e2.message; }
    }, "校验中……");
  } }, ["连接校验并保存"]);
  const body = el("div", {}, [
    el("div", { class: "muted", style: "margin-bottom:12px" }, ["Judge 独立接入，不进入业务模型池、不参与路由；仅用于评测回填与 AI 评审的择优打分。"]),
    fieldEl("显示名", "display_name", "例如：裁判 Judge-72B"),
    fieldEl("模型 ID", "model_id", "例如：judge-72b", "2-24 位小写字母、数字或短横线"),
    fieldEl("接口地址", "endpoint", "https://api.example.com/v1/chat", "仅支持 https"),
    fieldEl("凭证引用", "credential_ref", "vault://judge/key-01", "密钥存放在凭证库，此处填引用；不明文入库"),
    err,
    el("div", { style: "display:flex;justify-content:flex-end;gap:8px;margin-top:16px" }, [
      el("button", { class: "btn", onclick: () => mask.remove() }, ["取消"]),
      saveBtn,
    ]),
  ]);
  const mask = UI.modal(existing ? "更换 Judge 模型" : "添加 Judge 模型", body);
}

// 走查 R2：注册表单原先全英文字段名、无必填标记、无校验、无取消
function registerDialog() {
  if (document.querySelector(".modal-mask")) return; // 防连点叠开
  // 两步：1 填接入信息做连接校验 → 2 自动带出单价与能力（可修改）后添加
  const st = { model_id: "", display_name: "", provider: "", endpoint: "", credential_ref: "",
               price_input: null, price_output: null, caps: null };
  const fieldEl = (label, key, ph, hint, type = "text") => {
    const n = el("input", { type, value: st[key] ?? "", placeholder: ph });
    n.oninput = () => st[key] = n.value.trim();
    return el("label", { class: "field" }, [
      el("span", { class: "label-text req" }, [label, hint ? UI.help(hint) : null]), n]);
  };
  const err = el("div", { class: "field-error" });
  const verifyBtn = el("button", { class: "btn primary", onclick: async (e) => {
    err.textContent = "";
    if (!st.display_name) { err.textContent = "请填写显示名"; return; }
    if (!/^[a-z0-9][a-z0-9-]{1,23}$/.test(st.model_id)) { err.textContent = "模型 ID 需为 2-24 位小写字母、数字或短横线"; return; }
    if (!/^https:\/\/\S+$/.test(st.endpoint)) { err.textContent = "接口地址必须是 https:// 开头的完整 URL"; return; }
    if (!/^vault:\/\/\S+$/.test(st.credential_ref)) { err.textContent = "凭证需为 vault:// 引用（密钥不明文入库）"; return; }
    await UI.withBusy(e.currentTarget, async () => {
      await new Promise(r => setTimeout(r, 600)); // 演示：模拟连通性校验
      st.provider = st.provider || (st.endpoint.split("//")[1] || "").split(".")[0] || "custom";
      try {
        await UI.api("/v1/models", { method: "POST", body: {
          model_id: st.model_id, display_name: st.display_name, provider: st.provider,
          endpoint: st.endpoint, credential_ref: st.credential_ref,
          capabilities: { tool_call: true, streaming: true } } });
        UI.toast("模型已添加。可在列表「更多」里导入画像数据（单价 / 上下文），回填评测集后上线");
        mask.remove(); renderModels();
      } catch (e2) { err.textContent = e2.data?.error || e2.message; }
    }, "校验中……");
  } }, ["连接校验并添加"]);
  const body = el("div", {}, [
    el("div", { class: "sec-head" }, ["接入信息"]),
    el("div", { class: "grid cols-2" }, [
      fieldEl("显示名", "display_name", "例如：迅答 Swift-4B"),
      fieldEl("模型 ID", "model_id", "my-model-7b", "2-24 位小写字母、数字或短横线；注册后不可修改"),
    ]),
    fieldEl("接口地址", "endpoint", "https://api.provider.com/v1", "仅 https"),
    fieldEl("API 凭证", "credential_ref", "vault://cred/my-model", "填 vault:// 引用，密钥加密存储、展示脱敏"),
    err,
    el("div", { class: "muted", style: "margin:4px 0 8px" }, ["第二步「导入画像数据」（单价 / 上下文长度）非必选，添加后可在模型列表随时补充"]),
    el("div", { style: "display:flex;justify-content:flex-end;margin-top:8px" }, [verifyBtn]),
  ]);
  const mask = UI.modal("添加模型", body, null, { persistent: true });
}

// 导入模型画像数据：贴官方定价页链接由 AI 自动获取，或手动填写（非必选步骤）
function profileDataDialog(m) {
  if (document.querySelector(".modal-mask")) return;
  const urlIn = el("input", { type: "url", placeholder: "https://provider.com/pricing（官方定价 / 模型文档页）" });
  const pin = el("input", { type: "number", step: "0.05", min: "0", value: Number(m.price_input) || "", placeholder: "例如 0.4" });
  const pout = el("input", { type: "number", step: "0.05", min: "0", value: Number(m.price_output) || "", placeholder: "例如 0.8" });
  const ctx = el("input", { type: "number", step: "1", min: "0", value: (m.capabilities?.context_window || 0) / 1024 || "", placeholder: "例如 128" });
  const err = el("div", { class: "field-error" });
  const aiBtn = el("button", { class: "btn ai", type: "button", onclick: async (e) => {
    if (!/^https:\/\/\S+$/.test(urlIn.value.trim())) { err.textContent = "请先填写 https:// 开头的定价页链接"; return; }
    err.textContent = "";
    await UI.withBusy(e.currentTarget, async () => {
      await new Promise(r => setTimeout(r, 900)); // 演示：模拟 AI 抓取定价页
      let h = 0; const u = urlIn.value.trim();
      for (let i = 0; i < u.length; i++) h = (h * 31 + u.charCodeAt(i)) >>> 0;
      pin.value = (0.2 + (h % 8) * 0.1).toFixed(1);
      pout.value = (Number(pin.value) * 2).toFixed(1);
      ctx.value = [32, 64, 128, 256][h % 4];
      UI.toast("AI 已从页面抓取单价与上下文长度，请核对后保存");
    }, "AI 获取中……");
  } }, [UI.icon("wand", 14), "AI 自动获取"]);
  const mask2 = UI.modal(`导入画像数据 · ${m.display_name}`, el("div", {}, [

// ---------- 导入数据集页 ----------
function parseImportText(text, fallbackDomain) {
  return text.split("\n").map(line => {
    line = line.trim();
    if (!line) return null;
    if (line.startsWith("{")) {
      try {
        const o = JSON.parse(line);
        return o.query ? { query: o.query, domain: o.scene || o.domain || fallbackDomain, ideal: o.ideal || "", labels: o.labels || {} } : null;
      } catch (e) { return null; }
    }
    if (line.includes("\t")) {
      const [query, domain, labelsStr] = line.split("\t");
      const labels = {};
      (labelsStr || "").split(",").forEach(kv => { const [k, v] = kv.split("="); if (k?.trim()) labels[k.trim()] = Number(v); });
      return query?.trim() ? { query: query.trim(), domain: (domain || fallbackDomain).trim(), labels } : null;
    }
    if (line.includes(",")) {
      const [query, domain] = line.split(",");
      if (query?.trim().toLowerCase() === "query") return null;
      return query?.trim() ? { query: query.trim(), domain: (domain || fallbackDomain).trim() || fallbackDomain, labels: {} } : null;
    }
    return { query: line, domain: fallbackDomain, labels: {} };
  }).filter(Boolean);
}

async function renderImport() {
  const sc = await UI.api("/v1/bank/scenes");
  const SCENE_NAMES2 = { ...DOMAIN_NAMES };
  (sc.custom_scenes || []).forEach(c => { SCENE_NAMES2[c.key] = c.name; });
  const box = content();
  box.innerHTML = "";
  let dom = "general";
  const ta = el("textarea", { rows: 10, placeholder: "在此粘贴数据，一行一条；或点右上方按钮填入示例 / 下载模板" });
  const countLab = el("span", { class: "muted num" }, ["已识别 0 条"]);
  ta.oninput = UI.debounce(() => { countLab.textContent = `已识别 ${parseImportText(ta.value, dom).length} 条`; }, 200);
  const progBox = el("div", { style: "margin-top:12px" });
  let startedHere = false;
  function drawProgress(task) {
    progBox.innerHTML = "";
    if (!task || task.status === "idle") return;
    if (task.status === "done" && !startedHere) return;
    const pct2 = task.total ? Math.round(task.done / task.total * 100) : 0;
    progBox.append(
      el("div", { class: "progress-track", style: "margin-bottom:8px" }, [el("div", { class: "progress-fill", style: `width:${pct2}%` })]),
      task.status === "running"
        ? el("div", { class: "muted num" }, [`校验中 ${task.done}/${task.total}……可离开本页，导入在后台继续`])
        : el("div", {}, [
            el("div", { class: "mini-metrics", style: "grid-template-columns:repeat(3,1fr)" }, [
              el("div", { class: "mini-metric" }, [el("div", { class: "mm-label" }, ["入库"]), el("div", { class: "mm-value num" }, [String(task.imported)])]),
              el("div", { class: "mini-metric" }, [el("div", { class: "mm-label" }, ["重复跳过"]), el("div", { class: "mm-value num" }, [String(task.skipped)])]),
              el("div", { class: "mini-metric" }, [el("div", { class: "mm-label" }, ["格式或场景无效"]), el("div", { class: "mm-value num" + (task.invalid ? " warn" : "") }, [String(task.invalid)])]),
            ]),
            task.error ? el("div", { class: "field-error", style: "margin-top:8px" }, ["导入中断：" + task.error]) : null,
            el("div", { style: "margin-top:10px" }, [
              el("button", { class: "btn primary", onclick: () => { location.hash = "#flow"; } }, ["返回场景数据集"]),
            ]),
          ]),
    );
  }
  async function poll() {
    const { task } = await UI.api("/v1/bank/import/status");
    drawProgress(task);
    if (task.status === "running" && activeTab === "import") setTimeout(poll, 500);
  }
  const secHead = (n, t, extra) => el("div", { style: "display:flex;align-items:center;gap:8px;margin:0 0 10px" }, [
    el("span", { class: "step-badge" }, [String(n)]), el("span", { style: "font-weight:600" }, [t]),
    extra ? el("div", { style: "flex:1" }) : null, extra || null,
  ]);
  const exBtn = (label, text) => el("button", { class: "btn small ghost", onclick: () => {
    ta.value = text; ta.oninput(); ta.focus();
  } }, [label]);
  const TPL_JSONL = ['{"query":"压港滞期费怎么申诉","scene":"port","ideal":"按合同滞期条款先与船代对账，再提交申诉单。"}',
    '{"query":"旺季舱位怎么保障","scene":"capacity"}',
    '{"query":"铁矿石近期价格怎么看","scene":"price","labels":{"harbor-13b":1,"swift-4b":0}}'].join("\n");
  const TPL_CSV = "query,scene\n压港滞期费怎么申诉,port\n旺季舱位怎么保障,capacity\n铁矿石近期价格怎么看,price";
  const dlBtn = (label, text, fname, mime) => el("button", { class: "btn small ghost", onclick: () => {
    const blob = new Blob(["\ufeff" + text], { type: mime });
    const a2 = document.createElement("a");
    a2.href = URL.createObjectURL(blob); a2.download = fname; a2.click();
    URL.revokeObjectURL(a2.href);
    UI.toast("模板已下载，照模板填好后粘贴进来即可");
  } }, [UI.icon("download", 13), label]);
  box.appendChild(el("div", { style: "display:flex;align-items:center;gap:12px;margin-bottom:12px" }, [
    el("button", { class: "btn small", onclick: () => { location.hash = "#flow"; } }, ["返回场景数据集"]),
    el("span", { class: "muted" }, ["把每个业务场景的题目批量导入；提交后逐条检查格式、场景与重复"]),
  ]));
  box.appendChild(el("div", { class: "card", style: "max-width:860px" }, [
    secHead(1, "选择归入场景"),
    el("div", { style: "display:flex;align-items:center;gap:8px;margin-bottom:20px" }, [
      UI.fancySelect({ value: "general", options: Object.entries(SCENE_NAMES2).filter(([k]) => k !== "untagged"),
        onChange: (v) => { dom = v; ta.oninput(); } }),
      el("span", { class: "muted" }, ["数据里写了场景的以数据为准"]),
    ]),
    secHead(2, "粘贴数据", el("span", { style: "display:inline-flex;gap:6px;flex-wrap:wrap" }, [
      exBtn("填入 JSONL 示例", TPL_JSONL),
      exBtn("填入 CSV 示例", TPL_CSV),
      dlBtn("下载 JSONL 模板", TPL_JSONL, "场景数据集模板.jsonl", "application/jsonl"),
      dlBtn("下载 CSV 模板", TPL_CSV, "场景数据集模板.csv", "text/csv"),
    ])),
    ta,
    el("div", { style: "display:flex;align-items:center;gap:10px;margin:6px 0 20px" }, [countLab]),
    secHead(3, "检查并入库"),
    el("div", { style: "display:flex;align-items:center;gap:10px" }, [
      el("button", { class: "btn primary", onclick: async (e) => {
        const items = parseImportText(ta.value, dom);
        if (!items.length) { UI.toast("没有可导入的数据", true); return; }
        try {
          const { task } = await UI.api("/v1/bank/import/start", { method: "POST", body: { items, domain: dom } });
          startedHere = true;
          ta.value = ""; ta.oninput();
          drawProgress(task); poll();
        } catch (err) { UI.toast(err.data?.error || err.message, true); }
      } }, ["开始导入"]),
      el("span", { class: "muted" }, ["重复题目会自动跳过，不会导入两份"]),
    ]),
    progBox,
  ]));
  poll().catch(() => {});
}

async function renderDispatch() {
  const box = content();
  box.innerHTML = "";
  const [{ judge }, { models }, { policies: allPolicies }] = await Promise.all([
    UI.api("/api/settings/judge-model").catch(() => ({ judge: null })),
    UI.api("/v1/models").catch(() => ({ models: [] })),
    UI.api("/v1/policies"),
  ]);
  const actives = (models || []).filter(m => m.status === "active");
  const policies = (allPolicies || []).filter(p2 => !p2.ab_group);
  if (!selectedPolicyId || !policies.find(p2 => p2.policy_id === selectedPolicyId)) {
    const g = policies.find(p2 => p2.scope === "global");
    selectedPolicyId = g ? g.policy_id : (policies[0] && policies[0].policy_id);
  }

  // Judge 评审模型：打分裁判（评测与画像的前置条件，放最上方醒目位置）
  box.appendChild(el("div", { class: "card", style: "margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-left:3px solid " + (judge ? "var(--primary)" : "var(--danger)") }, [
    el("div", { style: "min-width:220px" }, [
      el("div", { style: "font-weight:600;font-size:var(--font-title)" }, ["Judge 评审模型（打分裁判）"]),
      el("div", { class: "muted" }, ["给各模型的答题打分，产出「各场景路由去向」的成绩依据"]),
    ]),
    judge ? el("span", { style: "display:inline-flex;align-items:center;gap:8px" }, [
      el("span", { class: "chip blue" }, [judge.display_name || judge.model_id]),
      el("span", { class: "chip green" }, ["已就绪"]),
    ]) : el("span", { class: "chip red" }, ["未配置：不能打分与更新去向"]),
    el("div", { style: "flex:1" }),
    judge
      ? el("span", { style: "display:inline-flex;gap:8px" }, [
          el("button", { class: "btn small", onclick: () => judgeDialog(judge, () => renderDispatch()) }, ["更换"]),
          el("button", { class: "btn small", onclick: async () => {
            const ok = await UI.confirm("移除 Judge 模型", "移除后不能打分与更新场景去向，直到重新配置。", { okText: "移除", danger: true });
            if (!ok) return;
            try { await UI.api("/api/settings/judge-model", { method: "POST", body: { model_id: "" } }); UI.toast("已移除"); renderDispatch(); }
            catch (e) { UI.toast(e.data?.error || e.message, true); }
          } }, ["移除"]),
        ])
      : el("button", { class: "btn primary", onclick: () => judgeDialog(null, () => renderDispatch()) }, ["配置 Judge 模型"]),
  ]));

  // 无模型空态：先引导接入
  if (!actives.length) {
    box.appendChild(el("div", { class: "card empty-state" }, [
      el("div", { class: "empty-title" }, ["还没有可用的模型"]),
      el("div", {}, ["路由策略负责在多个模型之间做选择——先接入至少一个模型"]),
      el("a", { class: "btn primary", style: "margin-top:12px", href: "/web/router.html#models" }, ["接入模型"]),
    ]));
    return;
  }

  box.appendChild(el("div", { style: "display:flex;align-items:center;gap:8px;margin:6px 0 10px" }, [
    el("span", { class: "section-title", style: "margin:0" }, ["路由策略"]),
    UI.help("一条策略 = 一套「怎么选模型」的规则。点卡片看它的各场景去向；复制引用代码就能在你的产品里使用这条策略"),
    el("div", { style: "flex:1" }),
    el("button", { class: "btn primary", onclick: () => newPolicyDialog(actives) }, [UI.icon("plus", 14), "新增路由策略"]),
  ]));
  const listBox = el("div", {});
  box.appendChild(listBox);
  renderPolicies(listBox, policies, actives);

  const dirBox = el("div", { style: "margin-top:6px" });
  box.appendChild(dirBox);
  if (selectedPolicyId) await renderDirections(dirBox, selectedPolicyId);
}
