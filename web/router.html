<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%231DA1F2'/%3E%3Crect x='10.5' y='3.6' width='9.6' height='7.3' rx='2.7' fill='none' stroke='%23fff' stroke-width='1.5' opacity='0.75'/%3E%3Cpath d='M3.4 12a3.7 3.7 0 0 1 3.7-3.7h6a3.7 3.7 0 0 1 3.7 3.7v2.3a3.7 3.7 0 0 1-3.7 3.7H9.5l-3.1 2.6c-.55.46-1.3.07-1.3-.64v-2.4A3.7 3.7 0 0 1 3.4 14.3z' fill='%23fff'/%3E%3Ccircle cx='7.4' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='10.25' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='13.1' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3C/svg%3E">
<title>模型路由 · 智能交互平台</title>
<link rel="stylesheet" href="/web/shared.css">
</head>
<body>
<div class="page">
  <div class="page-head" style="display:flex;align-items:center;gap:6px"><div class="page-title" id="pageTitle">模型接入</div><span id="headActions" style="margin-left:auto"></span></div>

  <div id="tabContent"></div>
</div>

<script src="/web/tokens.js"></script>
<script src="/web/ui.js"></script>
<script src="/web/components.js"></script>
<script src="/web/testchat.js"></script>
<script>
UI.nav("router");
const { el } = UI;
// 走查：板块入口只保留左侧导航一处，页内不再放横向 tab（按 #hash 渲染）
const SECTION_NAMES = { models: "模型接入", dispatch: "路由策略", profile: "模型画像" };
let activeTab = "models";

let pollTimer = null;

function showSection(key, first = false) {
  if (key === "policies") key = "dispatch"; // 旧深链兼容
  if (key === "flow" || key === "flywheel" || key === "scene" || key === "import" || key === "review") key = "profile"; // v7：数据集/飞轮页并入模型画像页
  if (!RENDER[key]) key = "dispatch";
  if (!first && key === activeTab) return;
  activeTab = key;
  clearInterval(pollTimer);
  document.getElementById("pageTitle").textContent = SECTION_NAMES[key];
  document.getElementById("headActions").innerHTML = "";
  document.title = SECTION_NAMES[key] + " · 智能交互平台";
  UI.loading(content());
  RENDER[key]().catch(e => UI.toast("加载失败：" + e.message, true));
}

const content = () => document.getElementById("tabContent");

// ================= 模型池 =================

async function renderModels() {
  const { models } = await UI.api("/v1/models");
  const box = content();
  box.innerHTML = "";
  const statusChip = { active: ["在线", "green"], registering: ["注册中", "yellow"],
    paused: ["已停用", "gray"], retired: ["已退役", "red"] };
  const table = el("table", { class: "data" }, [
    el("thead", {}, [el("tr", {}, ["供应商", "名称", "模型型号", "接入方式", "单价 ¥/M（入 / 出）", "多模态", "思考模式", "启用情况", "操作"]
      .map(h => el("th", { class: (h === "名称" || h === "模型型号") ? "w-main" : "" }, [h])))]),
    el("tbody", {}, models.filter(m => (m.bank_coverage || 0) >= 1)
      .sort((a2, b2) => String(a2.provider).localeCompare(String(b2.provider)) || String(a2.display_name).localeCompare(String(b2.display_name)))
      .map((m, i, arr) => renderModelRow(m, i === 0 || arr[i - 1].provider !== m.provider))),
  ]);
  function renderModelRow(m, firstOfProvider) {
      const [lb, color] = statusChip[m.status] || [m.status, "gray"];
      const caps = m.capabilities || {};
      const coverage = Math.round((m.bank_coverage || 0) * 100);
      const backfill = m.backfill;
      const noCred = m.credential_masked === "****";
      return el("tr", {}, [
        el("td", { style: "font-weight:600" }, [firstOfProvider ? m.provider : ""]),
        el("td", { style: "min-width:160px" }, [
          el("div", { style: "font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap" }, [m.display_name,
            m.is_default ? el("span", { class: "chip blue", style: "flex:none;max-width:none", title: "默认兜底：路由 / 手动模式故障时切换到此模型；不能停用或删凭证" }, ["默认兜底"]) : null]),
        ]),
        el("td", { class: "muted num" }, [m.model_id]),
        el("td", {}, [m.deploy_type === "self_hosted"
          ? el("span", { title: "自有部署：成本按 GPU 卡·时做简易估算" }, [`自有部署 · ${m.gpu_count} 卡`])
          : el("span", { class: "muted" }, ["API 接入"])]),
        el("td", { class: "num", title: m.deploy_type === "self_hosted"
            ? "自有部署：按卡数折算的估算单价，可在「编辑」里修正" : "每百万 token 的输入 / 输出单价（人民币）" }, [
          (Number(m.price_input) || Number(m.price_output))
            ? el("span", {}, [`${m.price_input} / ${m.price_output}`,
                m.deploy_type === "self_hosted" ? el("span", { class: "muted", style: "margin-left:4px" }, ["估算"]) : null])
            : el("span", { class: "muted", title: "点「编辑」补充单价（可贴定价页链接由 AI 读取）" }, ["待补充"])]),
        el("td", {}, [caps.vision
          ? el("span", { title: "支持图像识别：多模态请求会被硬规则层分流到该模型" }, ["支持图像"])
          : el("span", { class: "muted", title: "不支持图像：多模态请求不会路由给它" }, ["不支持"])]),
        el("td", {}, [caps.thinking
          ? (() => {
              const lab2 = el("span", { class: "muted", style: "font-size:var(--font-caption)" }, [caps.thinking_enabled !== false ? "" : "关闭"]);
              return el("span", { style: "display:inline-flex;align-items:center;gap:8px" }, [
                UI.toggle({ checked: caps.thinking_enabled !== false,
                  onChange: async (next) => {
                    try {
                      await UI.api(`/v1/models/${m.model_id}/thinking`, { method: "POST", body: { enabled: next } });
                      lab2.textContent = next ? "" : "关闭";
                      UI.toast(next ? "已开启思考模式" : "已关闭思考模式");
                      return true;
                    } catch (err) { UI.toast(err.data?.error || err.message, true); return false; }
                  } }), lab2]);
            })()
          : el("span", { class: "muted", title: "该模型不支持深度思考" }, ["不支持"])]),
        el("td", {}, [
          m.is_default ? el("span", { class: "chip blue", title: "兜底模型常开，不能停用；先切换默认兜底才能操作" }, ["兜底"])
          : noCred ? el("span", { class: "chip gray", title: "凭证未配置，不能启用" }, ["不可用"])
          : UI.toggle({ checked: m.status === "active",
            onChange: async (next) => {
              if (!next) {
                const ok = await UI.confirm("停用模型", `停用「${m.display_name}」后立即退出路由候选，进行中的请求将无法使用该模型。继续？`, { okText: "确认停用" });
                if (!ok) return false;
              }
              try {
                await UI.api(`/v1/models/${m.model_id}/status`, { method: "POST", body: { status: next ? "active" : "paused" } });
                UI.toast(next ? "已启用，即时参与路由" : "已停用");
                renderModels();
                return true;
              } catch (err) { UI.toast(err.data?.error || err.message, true); return false; }
            } }),
        ]),
        el("td", {}, [el("div", { style: "display:flex;gap:6px;align-items:center" }, [
          el("button", { class: "btn small", onclick: () => editModelDrawer(m) }, ["编辑"]),
          (() => {
            const more = el("button", { class: "btn small", "aria-label": "更多操作", onclick: () => UI.menu(more, [
              !m.is_default && m.status === "active" ? { label: "设为默认兜底", onClick: async () => {
                const ok = await UI.confirm("设为默认兜底模型", `所有降级 / 故障切换都会落到「${m.display_name}」。建议选择稳定、成本可控的模型。继续？`, { okText: "确认设置" });
                if (!ok) return;
                try { await UI.api(`/v1/models/${m.model_id}/set-default`, { method: "POST" }); UI.toast("已设为默认兜底模型"); renderModels(); }
                catch (e) { UI.toast(e.data?.error || e.message, true); }
              } } : null,
              { label: "复制 model_id", onClick: () => { navigator.clipboard.writeText(m.model_id); UI.toast("已复制"); } },
              !m.is_default ? { label: "删除模型", danger: true, onClick: async () => {
                const ok = await UI.confirm("删除模型", `删除「${m.display_name}」后立即退出路由；历史成绩与调用记录保留用于审计。`, { okText: "删除", danger: true });
                if (!ok) return;
                try { await UI.api(`/v1/models/${m.model_id}/delete`, { method: "POST" }); UI.toast("已删除"); renderModels(); }
                catch (e) { UI.toast(e.data?.error || e.message, true); }
              } } : null,
              m.credential_masked !== "****" ? { label: "删除凭证并暂停", danger: true, onClick: async () => {
                if (m.is_default) { UI.toast("默认兜底模型的凭证不能删除，请先切换默认模型", true); return; }
                const ok = await UI.confirm("删除凭证", `删除「${m.display_name}」的凭证后模型立即暂停，进行中的会话自动切换备选模型。此操作不可撤销。`, { okText: "确认删除", danger: true });
                if (!ok) return;
                try { const r = await UI.api(`/v1/models/${m.model_id}/credential/delete`, { method: "POST" }); UI.toast(r.note); renderModels(); }
                catch (e) { UI.toast(e.data?.error || e.message, true); }
              } } : null,
            ]) }, ["更多"]);
            return more;
          })(),
        ])]),
      ]);
  }
  box.appendChild(el("div", { class: "card" }, [
    el("div", { style: "display:flex;justify-content:space-between;margin-bottom:10px" }, [
      el("div", { class: "section-title", style: "margin:0" }, ["已接入模型"]),
      el("div", { style: "display:flex;gap:8px" }, [
        el("a", { class: "btn", href: "/web/playground.html#model" }, [UI.icon("play", 14), "测试"]),
        el("button", { class: "btn primary", onclick: registerDialog }, [UI.icon("plus", 14), "添加模型"]),
      ]),
    ]),
    table,
  ]));
}

// 走查 R2：注册表单原先全英文字段名、无必填标记、无校验、无取消
function registerDialog() {
  if (document.querySelector(".modal-mask")) return; // 防连点叠开
  // 两步：1 填接入信息做连接校验 → 2 自动带出单价与能力（可修改）后添加
  const st = { model_id: "", display_name: "", provider: "", endpoint: "", credential_ref: "",
               price_input: null, price_output: null, caps: null, deploy_type: "api", gpu_count: "" };
  const fieldEl = (label, key, ph, hint, type = "text") => {
    const n = el("input", { type, value: st[key] ?? "", placeholder: ph });
    n.oninput = () => st[key] = n.value.trim();
    return el("label", { class: "field" }, [
      el("span", { class: "label-text req" }, [label, hint ? UI.help(hint) : null]), n]);
  };
  const err = el("div", { class: "field-error" });
  const verifyBtn = el("button", { class: "btn primary", onclick: async (e) => {
    err.textContent = "";
    if (!st.display_name) { err.textContent = "请填写显示名"; return; }
    if (!/^[a-z0-9][a-z0-9-]{1,23}$/.test(st.model_id)) { err.textContent = "模型 ID 需为 2-24 位小写字母、数字或短横线"; return; }
    if (!/^https:\/\/\S+$/.test(st.endpoint)) { err.textContent = "接口地址必须是 https:// 开头的完整 URL"; return; }
    if (!/^vault:\/\/\S+$/.test(st.credential_ref)) { err.textContent = "凭证需为 vault:// 引用（密钥不明文入库）"; return; }
    if (st.deploy_type === "self_hosted") {
      const g = Number(st.gpu_count);
      if (!Number.isInteger(g) || g < 1 || g > 512) { err.textContent = "自有部署请填写卡数（1-512 的整数）"; return; }
    }
    await UI.withBusy(e.currentTarget, async () => {
      await new Promise(r => setTimeout(r, 600)); // 演示：模拟连通性校验
      st.provider = st.provider || (st.endpoint.split("//")[1] || "").split(".")[0] || "custom";
      try {
        await UI.api("/v1/models", { method: "POST", body: {
          model_id: st.model_id, display_name: st.display_name, provider: st.provider,
          endpoint: st.endpoint, credential_ref: st.credential_ref,
          deploy_type: st.deploy_type, gpu_count: st.deploy_type === "self_hosted" ? Number(st.gpu_count) : 0,
          vision: !!st.vision,
          capabilities: { tool_call: true, streaming: true } } });
        UI.toast(st.deploy_type === "self_hosted"
          ? "模型已添加并生效，成本已按卡数估算；benchmark 成绩缺失时在「模型画像」页补录"
          : "模型已添加并生效。可在列表「编辑」里补充官网单价，benchmark 成绩缺失时在「模型画像」页补录");
        mask.remove(); renderModels();
      } catch (e2) { err.textContent = e2.data?.error || e2.message; }
    }, "校验中……");
  } }, ["连接校验并添加"]);
  const gpuIn = el("input", { type: "number", min: "1", max: "512", step: "1", value: "", placeholder: "例如 16" });
  gpuIn.oninput = () => st.gpu_count = gpuIn.value.trim();
  const gpuField = el("label", { class: "field", hidden: true }, [
    el("span", { class: "label-text req" }, ["部署卡数",
      UI.help("需要多少张 GPU 卡；平台按 GPU 卡·时折算出估算单价，可在「编辑」里修正")]), gpuIn]);
  const deploySel = UI.fancySelect({ value: "api", width: "100%",
    options: [["api", "API 接入（按官网单价计成本）"], ["self_hosted", "自有部署（按卡数做简易估算）"]],
    onChange: (v) => { st.deploy_type = v; gpuField.hidden = v !== "self_hosted"; } });
  const body = el("div", {}, [
    el("div", { class: "sec-head" }, ["接入信息"]),
    el("div", { class: "grid cols-2" }, [
      fieldEl("显示名", "display_name", "例如：迅答 Swift-4B"),
      fieldEl("模型 ID", "model_id", "my-model-7b", "2-24 位小写字母、数字或短横线；注册后不可修改"),
    ]),
    fieldEl("接口地址", "endpoint", "https://api.provider.com/v1", "仅 https"),
    fieldEl("API 凭证", "credential_ref", "vault://cred/my-model", "填 vault:// 引用，密钥加密存储、展示脱敏"),
    el("label", { class: "field" }, [el("span", { class: "label-text req" }, ["接入方式",
      UI.help("API 接入的成本按官网单价；自有部署没有账单，按需要的 GPU 卡数做简易估算")]), deploySel]),
    gpuField,
    el("div", { class: "field" }, [
      el("span", { class: "label-text" }, ["图像识别（多模态）",
        UI.help("模型能否看图：多模态请求只会分流给支持图像的模型，一个都没有时走兜底")]),
      UI.toggle({ checked: false, label: "不支持", onChange: (v, lab) => { st.vision = v; return true; } }),
    ]),
    err,
    el("div", { class: "muted", style: "margin:4px 0 8px" }, ["单价 / 上下文长度非必选，添加后可在模型列表「编辑」里随时补充"]),
    el("div", { style: "display:flex;justify-content:flex-end;margin-top:8px" }, [verifyBtn]),
  ]);
  const mask = UI.modal("添加模型", body, null, { persistent: true });
}

// 编辑模型：改名 + 接入方式与成本（API 官网单价 / 自有部署按卡数估算）+ 上下文
function editModelDrawer(m) {
  const nameIn = el("input", { type: "text", maxlength: "24", value: m.display_name });
  const dst = { deploy_type: m.deploy_type || "api", gpu_count: m.gpu_count || "",
    vision: !!(m.capabilities || {}).vision };
  const gpuIn = el("input", { type: "number", min: "1", max: "512", step: "1", value: dst.gpu_count || "", placeholder: "例如 16" });
  gpuIn.oninput = () => dst.gpu_count = gpuIn.value.trim();
  const gpuField = el("label", { class: "field", hidden: dst.deploy_type !== "self_hosted" }, [
    el("span", { class: "label-text req" }, ["部署卡数",
      UI.help("按 GPU 卡·时折算估算单价；改卡数后把单价清空可重新估算")]), gpuIn]);
  const deploySel = UI.fancySelect({ value: dst.deploy_type, width: "100%",
    options: [["api", "API 接入（按官网单价计成本）"], ["self_hosted", "自有部署（按卡数做简易估算）"]],
    onChange: (v) => { dst.deploy_type = v; gpuField.hidden = v !== "self_hosted"; } });
  const urlIn = el("input", { type: "url", placeholder: "https://provider.com/pricing（官方定价 / 模型文档页）" });
  const pin = el("input", { type: "number", step: "0.05", min: "0", value: Number(m.price_input) || "", placeholder: "例如 0.4" });
  const pout = el("input", { type: "number", step: "0.05", min: "0", value: Number(m.price_output) || "", placeholder: "例如 0.8" });
  const ctx = el("input", { type: "number", step: "1", min: "0", value: (m.capabilities?.context_window || 0) / 1024 || "", placeholder: "例如 128" });
  const err = el("div", { class: "field-error" });
  const aiBtn = el("button", { class: "btn ai", type: "button", onclick: async (e) => {
    if (!/^https:\/\/\S+$/.test(urlIn.value.trim())) { err.textContent = "请先填写 https:// 开头的定价页链接"; return; }
    err.textContent = "";
    await UI.withBusy(e.currentTarget, async () => {
      await new Promise(r => setTimeout(r, 900)); // 演示：模拟 AI 抓取定价页
      let h = 0; const u = urlIn.value.trim();
      for (let i = 0; i < u.length; i++) h = (h * 31 + u.charCodeAt(i)) >>> 0;
      pin.value = (0.2 + (h % 8) * 0.1).toFixed(1);
      pout.value = (Number(pin.value) * 2).toFixed(1);
      ctx.value = [32, 64, 128, 256][h % 4];
      UI.toast("AI 已从页面读出单价与上下文长度，请核对后保存");
    }, "AI 获取中……");
  } }, [UI.icon("wand", 14), "AI 自动获取"]);
  const foot = el("div", { style: "display:flex;gap:8px;justify-content:flex-end;align-items:center;width:100%" }, [
    err, el("div", { style: "flex:1" }),
    el("button", { class: "btn", onclick: () => mask2.querySelector(".close-btn")?.click() }, ["取消"]),
    el("button", { class: "btn primary", onclick: async (e) => {
      if (!nameIn.value.trim()) { err.textContent = "显示名必填"; return; }
      if (dst.deploy_type === "self_hosted") {
        const g = Number(dst.gpu_count);
        if (!Number.isInteger(g) || g < 1 || g > 512) { err.textContent = "自有部署请填写卡数（1-512 的整数）"; return; }
      }
      await UI.withBusy(e.currentTarget, async () => {
        try {
          await UI.api(`/v1/models/${m.model_id}/update`, { method: "POST", body: { display_name: nameIn.value.trim() } });
          await UI.api(`/v1/models/${m.model_id}/profile-data`, { method: "POST", body: {
            price_input: Number(pin.value) || 0, price_output: Number(pout.value) || 0,
            context_window: Math.round((Number(ctx.value) || 0) * 1024),
            deploy_type: dst.deploy_type,
            gpu_count: dst.deploy_type === "self_hosted" ? Number(dst.gpu_count) : 0,
            vision: dst.vision } });
          UI.toast("已保存");
          mask2.querySelector(".close-btn")?.click();
          renderModels();
        } catch (e2) { err.textContent = e2.data?.error || e2.message; }
      }, "保存中……");
    } }, ["保存"]),
  ]);
  const mask2 = UI.drawer(`编辑模型 · ${m.display_name}`, el("div", {}, [
    el("label", { class: "field" }, [el("span", { class: "label-text req" }, ["模型名称"]), nameIn]),
    el("div", { class: "sec-head", style: "margin-top:8px" }, ["接入方式与成本",
      el("span", { class: "muted", style: "margin-left:8px;font-weight:400;font-size:var(--font-caption)" }, ["API 接入贴官方定价页由 AI 读取；自有部署留空单价按卡数估算"])]),
    el("label", { class: "field" }, [el("span", { class: "label-text" }, ["接入方式"]), deploySel]),
    gpuField,
    el("div", { class: "field" }, [
      el("span", { class: "label-text" }, ["图像识别（多模态）",
        UI.help("多模态请求只会分流给支持图像的模型")]),
      UI.toggle({ checked: dst.vision, label: dst.vision ? "支持" : "不支持",
        onChange: (v) => { dst.vision = v; return true; } }),
    ]),
    el("label", { class: "field" }, [el("span", { class: "label-text" }, ["定价页链接"]),
      el("div", { style: "display:flex;gap:8px" }, [urlIn, aiBtn])]),
    el("div", { style: "display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px" }, [
      el("label", { class: "field" }, [el("span", { class: "label-text" }, ["输入单价（¥/M）"]), pin]),
      el("label", { class: "field" }, [el("span", { class: "label-text" }, ["输出单价（¥/M）"]), pout]),

// 参数配置里的 API 对接说明：请求参数与返回字段的完整口径，整块可复制给对接开发
function apiSnippet(apiKey) {
  return [
    "// 1) 发起对话（POST /v1/route，SSE 流式返回）",
    "{",
    `  "api_key": "${apiKey}",   // 本策略的 Key，带上即按本策略路由`,
    '  "text": "用户的问题",',
    '  "aggregate": "auto"       // 可选，按次覆盖聚合开关：auto 跟随策略默认 / on 强制聚合 / off 关闭聚合',
    "                            //（策略关闭「允许调用方按次覆盖」时 on 会被拒绝，applied.override_allowed=false）",
    "}",
    "",
    "// 2) 返回（final 事件）关键字段",
    "//   content           回答正文",
    "//   request_id        本次请求编号，问题排查与对账用",
    "//   applied           本次实际生效口径：{ aggregate, aggregation_used, override_allowed, policy_id }",
    "//   decision_summary  路由决策：命中层级 route_layer / 相关维度 dimensions / 模型 / 成本",
  ].join("\n");
}

function buildApiDoc(policyId, apiKey, st) {
  const body = el("pre", { class: "num", style: "margin:8px 0 0;background:var(--bg-sunken);border-radius:8px;" +
    "padding:10px 12px;font-size:var(--font-caption);line-height:1.6;white-space:pre-wrap;overflow-x:auto" },
    [apiSnippet(apiKey)]);
  body.hidden = true;
  const toggleBtn = el("button", { class: "btn small ghost", type: "button", onclick: () => {
    body.hidden = !body.hidden; toggleBtn.classList.toggle("active", !body.hidden);
  } }, ["API 参数与返回说明", UI.icon("chevron", 13)]);
  return el("div", { class: "field", style: "margin-top:2px" }, [
    el("div", { style: "display:flex;align-items:center;gap:8px" }, [
      toggleBtn,
      el("div", { style: "flex:1" }),
      el("button", { class: "btn small", type: "button", onclick: () => {

}

// 策略表单（新增与编辑共用）：名称 / 候选模型（标签多选） / 兜底模型 / 成本-效果权重 / 聚合开关
function policyForm(init, actives, policyId, apiKey) {
  const st = { name: init.name || "", alpha: init.alpha ?? 0.7, allow_agg: init.allow_agg !== false,
    allow_override: init.allow_override !== false,
    whitelist: new Set(init.whitelist || []), fallback: init.fallback || "" };
  if (st.whitelist.size === 0) actives.forEach(m => st.whitelist.add(m.model_id));
  const nameIn = el("input", { type: "text", maxlength: "15", value: st.name, placeholder: "例如：夜间省钱档（1-15 字）" });
  const nameErr = el("div", { class: "field-error" });
  nameIn.oninput = () => { st.name = nameIn.value; nameErr.textContent = ""; };
  const withCap = m => m.display_name + ((m.capabilities || {}).vision ? " · 图像" : "");
  const wlWrap = UI.tagSelect({
    selected: [...st.whitelist], minKeep: 1, placeholder: "点击选择候选模型，可输入搜索",
    options: actives.map(m => [m.model_id, withCap(m)]),
    onChange: (vals) => { st.whitelist = new Set(vals); },
  });
  if (!st.fallback) {
    const dm = actives.find(m => m.is_default) || actives[0];
    st.fallback = dm ? dm.model_id : "";
  }
  const fbSel = UI.fancySelect({ value: st.fallback, width: "100%",
    options: actives.map(m => [m.model_id, withCap(m)]),
    onChange: (v) => st.fallback = v });
  const slider = (key, min, max, step, leftLb, rightLb) => {
    const val = el("span", { class: "num", style: "font-weight:600;min-width:34px;text-align:right" }, [Number(st[key]).toFixed(2)]);
    const inp = el("input", { type: "range", min: String(min), max: String(max), step: String(step), value: st[key], style: "flex:1" });
    const fill = () => inp.style.setProperty("--fill", ((Number(inp.value) - min) / (max - min) * 100) + "%");
    fill();
    inp.oninput = () => { st[key] = Number(inp.value); val.textContent = Number(st[key]).toFixed(2); fill(); };
    return el("div", { style: "display:flex;align-items:center;gap:10px" }, [
      el("span", { class: "muted", style: "flex:none" }, [leftLb]), inp, el("span", { class: "muted", style: "flex:none" }, [rightLb]), val,
    ]);
  };
  const node = el("div", { class: "policy-form" }, [
    policyId ? el("div", { class: "drawer-meta" }, [
      el("span", {}, ["策略 ID"]),
      el("span", { class: "cr-id num", title: "点击复制完整 ID", style: "cursor:pointer",
        onclick: () => { navigator.clipboard.writeText(policyId); UI.toast("已复制策略 ID"); } }, [shortPolicyId(policyId)]),
      apiKey ? el("span", {}, ["API Key"]) : null,
      apiKey ? el("button", { class: "key-chip", title: "点击复制完整 Key",
        onclick: () => { navigator.clipboard.writeText(apiKey); UI.toast("已复制 API Key"); } },
        [el("span", { class: "num" }, ["sk-route-••••" + apiKey.slice(-4)]), UI.icon("copy", 12)]) : null,
    ]) : null,
    policyId && apiKey ? buildApiDoc(policyId, apiKey, st) : null,
    el("label", { class: "field" }, [el("span", { class: "label-text req" }, ["策略名称"]), nameIn, nameErr]),
    el("div", { class: "form-sec" }, ["模型范围"]),
    el("div", { class: "field" }, [
      el("span", { class: "label-text" }, ["候选模型", UI.help("这个策略允许在哪些模型里做选择；点击框内可搜索添加，点标签 × 移除")]),
      wlWrap,
    ]),
    el("label", { class: "field" }, [el("span", { class: "label-text" }, ["兜底模型",
      UI.help("候选模型全部失败时用它保底回答")]), fbSel]),
    el("div", { class: "form-sec" }, ["路由行为"]),
    el("label", { class: "field" }, [
      el("span", { class: "label-text" }, ["成本-效果权重",
        UI.help("综合分 = 权重 × 效果分 + (1 - 权重) × 省钱分（各模型单价归一后的分数）。0.70 表示效果占七成打分权重，不是 70% 的请求用强模型；调整后在「路由效果」重新生成可预览各维度去向变化")]),
      slider("alpha", 0, 1, 0.05, "更省钱", "更高质量"),
    ]),
    el("div", { class: "field" }, [
      el("span", { class: "label-text" }, ["聚合开关",
        UI.help("开启后，多个模型成绩接近时会都答一遍、由聚合模型总结定稿（更准但更贵）；关闭则始终单模型作答。这里是默认值")]),
      UI.toggle({ checked: st.allow_agg, label: st.allow_agg ? "允许聚合" : "始终单模型",
        onChange: (v) => { st.allow_agg = v; return true; } }),
    ]),
    el("div", { class: "field" }, [
      el("span", { class: "label-text" }, ["响应终端用户的聚合选择",
        UI.help("你的产品可以在界面上让用户自选「多模型聚合回答」（请求带 aggregate 参数进来）。开启＝按用户的选择执行；关闭＝忽略用户选择、始终按上面的聚合开关来——需要严格控制成本时建议关闭")]),
      UI.toggle({ checked: st.allow_override, label: st.allow_override ? "按用户选择执行" : "忽略用户选择",
        onChange: (v) => { st.allow_override = v; return true; } }),
    ]),
  ]);
  return { node, st, nameIn, nameErr };
}

function shortPolicyId(pid) {
  const hex = String(pid).replace(/[^0-9a-f]/gi, "").slice(0, 8) || "0";
  return String(parseInt(hex, 16) % 1000000).padStart(6, "0");
}

// 单格分数编辑：手动修正 / 标记缺失 / 恢复榜单值
function scoreCellDialog(model, dim, cell, onDone) {
  if (document.querySelector(".modal-mask")) return;

    placeholder: "0-100，留空并保存视为缺失", style: "width:120px" });
  const err = el("div", { class: "field-error" });
  const save = async (score) => {
    try {
      await UI.api("/api/benchmark/score", { method: "POST", body: { model_id: model.model_id, dim: dim.key, score } });
      UI.toast(score == null ? "已标记缺失：路由计算平均分时跳过此维度" : "已修正，即改即生效");

  const body = el("div", {}, [
    el("div", { class: "muted", style: "margin-bottom:10px" },
      [`${model.display_name} 在「${dim.label}」（${dim.bench}）的成绩。` +
       (cell.override ? "当前为手动修正值，可恢复榜单快照值。" : "榜单快照值，可按业务实测修正。")]),
    el("label", { class: "field" }, [el("span", { class: "label-text" }, ["成绩（0-100）"]), inp]),
    err,
    el("div", { style: "display:flex;gap:8px;margin-top:16px;align-items:center" }, [
      cell.override ? el("button", { class: "btn small ghost", onclick: async () => {
        try {
          await UI.api("/api/benchmark/score/reset", { method: "POST", body: { model_id: model.model_id, dim: dim.key } });
          UI.toast("已恢复榜单快照值"); mask.remove(); onDone && onDone();
        } catch (e2) { err.textContent = e2.data?.error || e2.message; }
      } }, ["恢复榜单值"]) : null,
      el("div", { style: "flex:1" }),

// 路由效果表：benchmark 画像 + 策略 α 即时换算，每格 tooltip 显示构成
async function buildEffectTable(policyId) {
  const p = await UI.api("/api/profile" + (policyId ? "?policy_id=" + policyId : ""));
  if (!(p.clusters || []).length) return el("div", { class: "empty-state" }, [
    el("div", { class: "empty-title" }, ["暂无可换算的画像数据"]),
    el("div", {}, ["先在「模型接入」启用至少一个模型"]),
  ]);
  const mids = Object.keys(p.clusters[0].scores || {});
  const nameOf = m => (p.models || {})[m] || m;
  return el("div", {}, [
    el("div", { style: "overflow-x:auto" }, [el("table", { class: "data" }, [
      el("thead", {}, [el("tr", {}, [
        el("th", {}, ["问题维度"]), el("th", {}, ["基准"]),
        ...mids.map(m => el("th", {}, [nameOf(m)])),
        el("th", { class: "w-main" }, ["路由去向"]),
      ])]),
      el("tbody", {}, p.clusters.map(c => el("tr", {}, [
        el("td", { style: "font-weight:600;white-space:nowrap" }, [c.label || c.domain]),
        el("td", { class: "muted", style: "white-space:nowrap" }, [c.bench || "-"]),
        ...mids.map(m => {
          const sc2 = (c.scores || {})[m] || {};
          const v = sc2.combined;
          const isBest = m === c.best;
          const tip = v == null ? "无此维度成绩：路由计算平均分时跳过"
            : `成绩 ${sc2.raw}${sc2.override ? "（手动修正）" : ""} · 省钱 ${sc2.eff} · 综合 ${v}`;
          return el("td", { class: "num", style: isBest && !c.agg_with ? "background:var(--primary-weak);font-weight:600;border-radius:4px" : "",
            title: tip }, [v == null ? "-" : v.toFixed(2)]);
        }),
        el("td", { class: "w-main" }, [c.agg_with
          ? el("span", { class: "chip ai", title: "两个模型综合分接近：都答一遍再由聚合模型总结定稿" }, [`聚合：${nameOf(c.best)} + ${nameOf(c.agg_with)}`])
          : (c.best ? el("span", { class: "chip blue" }, [nameOf(c.best)]) : el("span", { class: "muted" }, ["-"]))]),
      ]))),
    ])]),
    el("div", { class: "muted", style: "margin-top:10px;display:flex;align-items:center;flex-wrap:wrap" }, [
      "综合分 = 权重 × (成绩 ÷ 100) + (1 - 权重) × 省钱分；实际路由按判定维度取平均分再算",
      UI.help("省钱分由各模型单价归一得出，最便宜为 1、最贵为 0。缺失成绩的维度不参与该模型的平均分；某模型判定维度全部缺失时退出本次候选。表中为单一维度的换算，复合问题（判出多个维度）按平均分计算"),
    ]),
  ]);
}

async function renderProfile() {
  const bm = await UI.api("/api/benchmark");
  const box = content();
  box.innerHTML = "";
  const router = bm.router;

  // 页头：画像规则折叠块
  const rulesBlock = el("div", { class: "card explain-body", hidden: true, style: "margin-bottom:12px" }, [
    el("p", {}, ["1. 画像构成：模型画像 = benchmark 成绩表 + 成本。成绩来自公开榜单快照，成本按接入单价归一为省钱分；静态配置，即改即生效，无需生成任务、零冷启动。"]),
    el("p", {}, ["2. 智能判维：每次请求先由智能路由模型判定相关维度（可多个，如「算毛利再写分析」= 数学推理 + 长文写作），候选取这些维度的平均分，再按策略的成本-效果权重算综合分。"]),
    el("p", {}, ["3. 修正与缺失：benchmark 不等于业务成绩——自有部署、微调模型没有公开分，或榜单分与业务实测不符时，点击表格任意格修正；留空标记缺失，计算平均分时跳过该维度。"]),
    el("p", {}, ["4. 未配置路由模型：无法判维，线上请求一律直连兜底模型并在决策里说明——成绩表不生效，请尽快配置。"]),
  ]);
  const rulesBtn = el("button", { class: "btn small ghost", onclick: () => {
    rulesBlock.hidden = !rulesBlock.hidden;
    rulesBtn.classList.toggle("active", !rulesBlock.hidden);
  } }, ["画像规则", UI.icon("chevron", 13)]);
  document.getElementById("headActions").appendChild(rulesBtn);
  box.appendChild(rulesBlock);

  // 智能路由模型配置条（硬依赖警示）
  box.appendChild(el("div", { class: "judge-bar" + (router ? "" : " missing") }, [
    UI.icon(router ? "check" : "info", 16),
    el("div", { style: "min-width:0" }, [
      el("div", { style: "font-weight:600" }, [router ? `智能路由模型：${router.display_name || router.model_id}` : "还没配置智能路由模型"]),
      el("div", { class: "muted", style: "font-size:var(--font-caption)" }, [router
        ? "每次请求先由它判定相关维度，再按下表成绩路由；判维一跳计入路由成本"
        : "未配置时无法判维：线上请求一律直连兜底模型，下表成绩不生效"]),
    ]),
    el("div", { style: "flex:1" }),
    router
      ? el("span", { style: "display:inline-flex;gap:8px" }, [
          el("button", { class: "btn small", onclick: () => routerModelDialog(router, () => renderProfile()) }, ["更换"]),
          el("button", { class: "btn small", onclick: async () => {
            const ok = await UI.confirm("移除智能路由模型",
              "移除后线上请求无法判维，一律直连兜底模型直到重新配置；成绩表与策略配置保留不受影响。", { okText: "仍要移除", danger: true });
            if (!ok) return;
            try { await UI.api("/api/settings/router-model", { method: "POST", body: { model_id: "" } }); UI.toast("已移除：线上请求将直连兜底模型"); renderProfile(); }
            catch (e) { UI.toast(e.data?.error || e.message, true); }
          } }, ["移除"]),
        ])
      : el("button", { class: "btn primary", onclick: () => routerModelDialog(null, () => renderProfile()) }, ["配置智能路由模型"]),
  ]));

  // Benchmark 成绩表（可点格修正）
  const refreshBtn = el("button", { class: "btn small", onclick: async (e) => {
    const ok = await UI.confirm("刷新榜单快照",
      "拉取各 benchmark 榜单的最新成绩并更新快照日期；手动修正过的格保留、不被覆盖。", { okText: "刷新" });
    if (!ok) return;
    await UI.withBusy(e.currentTarget, async () => {
      try { const r = await UI.api("/api/benchmark/refresh", { method: "POST" }); UI.toast(`榜单快照已更新至 ${r.asof}`); renderProfile(); }
      catch (e2) { UI.toast(e2.data?.error || e2.message, true); }
    }, "刷新中……");
  } }, ["刷新榜单快照"]);
  const dimTh = d => el("th", { style: "white-space:nowrap" }, [d.label, UI.help(`${d.desc}。基准：${d.bench}`)]);
  box.appendChild(el("div", { class: "card", style: "margin:12px 0" }, [
    el("div", { style: "display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap" }, [
      el("span", { style: "font-weight:600;font-size:var(--font-title)" }, ["Benchmark 成绩表"]),
      el("span", { class: "muted num" }, [`快照 ${bm.asof}`, UI.help(`来源：${bm.source}。快照期后发布的新模型分数需刷新或手动填入`)]),
      el("div", { style: "flex:1" }),
      refreshBtn,
    ]),
    el("div", { class: "muted", style: "margin-bottom:10px" },
      ["点击任意格可修正成绩或标记缺失（自有部署 / 微调模型无公开分时手动补录）；修正即改即生效，带下划线的格为手动修正值"]),
    !(bm.models || []).length
      ? el("div", { class: "empty-state" }, [
          el("div", { class: "empty-title" }, ["还没有在线模型"]),
          el("div", {}, ["先在「模型接入」启用至少一个模型，成绩表与路由效果会自动出现"]),
          el("a", { class: "btn primary", style: "margin-top:12px", href: "/web/router.html#models" }, ["接入模型"]),
        ])
      :     el("div", { style: "overflow-x:auto" }, [el("table", { class: "data" }, [
      el("thead", {}, [el("tr", {}, [
        el("th", {}, ["模型"]), el("th", {}, ["单价（入/出 ¥/M）"]),
        ...bm.dims.map(dimTh),
      ])]),
      el("tbody", {}, (bm.models || []).map(m => el("tr", {}, [
        el("td", { style: "font-weight:600;white-space:nowrap" }, [m.display_name]),
        el("td", { class: "muted num", style: "white-space:nowrap" }, [`${m.price_input} / ${m.price_output}`]),
        ...bm.dims.map(d => {
          const raw = (bm.scores[m.model_id] || {})[d.key];
          const ov = d.key in ((bm.overrides || {})[m.model_id] || {});
          const cell = el("td", { class: "num", tabindex: "0", role: "button",
            style: "cursor:pointer" + (ov ? ";text-decoration:underline dotted;text-underline-offset:3px" : ""),
            title: raw == null ? "无公开成绩：路由计算平均分时跳过。点击可补录" : (ov ? "手动修正值，点击可再改或恢复榜单值" : "榜单快照值，点击可修正"),
            onclick: () => scoreCellDialog(m, d, { raw, override: ov }, () => renderProfile()) },
            [raw == null ? "-" : String(raw)]);
          cell.onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); cell.click(); } };
          return cell;
        }),
      ]))),
    ])]),
  ]));

  // 路由效果（按策略换算）
  box.appendChild(el("div", { style: "display:flex;align-items:center;gap:10px;margin:16px 0 8px;padding-right:16px" }, [
    el("span", { class: "section-title", style: "margin:0" }, ["路由效果"]),
    el("span", { class: "muted" }, ["各策略按成本-效果权重即时换算，改分数立即反映"]),
    el("div", { style: "flex:1" }),
  ]));
  const effCard = el("div", { class: "card" });
  box.appendChild(effCard);
  const polSel = el("div", {});
  const tblBox = el("div", {});
  effCard.appendChild(el("div", { style: "display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap" }, [
    el("span", { class: "muted", style: "flex:none" }, ["按策略换算"]),
    polSel,
  ]));
  effCard.appendChild(tblBox);
  const loadTable = async (pid) => {
    UI.loading(tblBox);
    try { tblBox.innerHTML = ""; tblBox.appendChild(await buildEffectTable(pid)); }
    catch (e2) { tblBox.innerHTML = ""; tblBox.appendChild(el("div", { class: "field-error" }, ["加载失败：" + e2.message])); }
  };
  try {
    const { policies } = await UI.api("/v1/policies");
    const pols = (policies || []).filter(p2 => p2.enabled && !p2.ab_group);
    const first = pols.find(p2 => p2.scope === "global") || pols[0];
    polSel.appendChild(UI.fancySelect({ value: first ? first.policy_id : "", width: "220px",
      options: pols.map(p2 => [p2.policy_id, `${p2.name} · 权重 ${(p2.params || {}).alpha ?? 0.7}`]),
      onChange: (v) => loadTable(v) }));
    await loadTable(first ? first.policy_id : null);
  } catch (e2) { await loadTable(null); }
}

async function renderDispatch() {
  const box = content();
  box.innerHTML = "";
  const [{ models }, { policies: allPolicies }] = await Promise.all([
    UI.api("/v1/models").catch(() => ({ models: [] })),
    UI.api("/v1/policies"),
  ]);
  const actives = (models || []).filter(m => m.status === "active");
  const policies = (allPolicies || []).filter(p2 => !p2.ab_group);
  const pOrder = p2 => p2.policy_id === "policy-global-balanced" ? 0 : p2.scope === "global" ? 1 : 2;
  policies.sort((x, y) => pOrder(x) - pOrder(y));

  // 无模型空态：先引导接入
  if (!actives.length) {
    box.appendChild(el("div", { class: "card empty-state" }, [
      el("div", { class: "empty-title" }, ["还没有可用的模型"]),
      el("div", {}, ["路由策略负责在多个模型之间做选择——先接入至少一个模型"]),
      el("a", { class: "btn primary", style: "margin-top:12px", href: "/web/router.html#models" }, ["接入模型"]),
    ]));
    return;
  }

  const rulesBlock = el("div", { class: "card explain-body", hidden: true, style: "margin-bottom:10px" }, [
    el("p", {}, ["1. 硬规则层：请求先过基础规则——多模态（图像 / 音频）等功能性需求先按能力过滤模型（复合任务如「读图 + 算数」先保证会看图，再在会看图的模型里按成绩选）；日常闲聊走轻量直答，但问候里带着真实任务时按任务维度路由，不会被「你好」盖住。"]),
    el("p", {}, ["2. 智能判维层：智能路由模型判定问题相关的 benchmark 维度（可多个），候选取这些维度的平均成绩，按「成本-效果权重」算综合分——领先直答；两名接近且策略允许聚合时并发作答，由聚合模型总结定稿。未配置智能路由模型时本层不生效，请求直连兜底。"]),
    el("p", {}, ["3. else 兜底：判定维度全部缺分或调用异常时切兜底模型直连；刚失败过的候选不会被重复调用，兜底也失败则明确报错，不做循环重试。"]),
    el("p", {}, ["4. 成绩来源：模型画像 = benchmark 成绩表 + 成本，来自公开榜单快照；成绩缺失或与业务不符时在「模型画像」页点格修正，即改即生效，无需生成任务。"]),
    el("p", {}, ["5. 产品对接：一条策略对应一个 API Key；请求可带 aggregate 参数按次覆盖聚合开关（策略可将默认值设为硬约束禁止覆盖），响应返回 request_id 与 decision_summary，便于排查每次路由的依据。"]),
  ]);  const rulesBtn = el("button", { class: "btn small ghost", onclick: () => {
    rulesBlock.hidden = !rulesBlock.hidden;
    rulesBtn.classList.toggle("active", !rulesBlock.hidden);
  } }, ["模型路由规则", UI.icon("chevron", 13)]);
  document.getElementById("headActions").appendChild(rulesBtn);
  box.appendChild(el("div", { style: "display:flex;align-items:center;gap:8px;margin:6px 0 10px" }, [
    el("span", { class: "muted" }, ["一条策略 = 一个 API，用 Key 区分"]),
    el("div", { style: "flex:1" }),
    el("button", { class: "btn primary", onclick: () => newPolicyDialog(actives) }, [UI.icon("plus", 14), "新增路由策略"]),
  ]));
  // 三层路由一行式示意：让首次用户不点「模型路由规则」也能看懂路由怎么走
  box.appendChild(el("div", { class: "card", style: "margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px" }, [
    el("span", { class: "muted", style: "flex:none" }, ["每次请求按三层走："]),
    el("span", { class: "chip blue", title: "多模态等功能需求按能力分流；日常闲聊轻量直答" }, ["1 硬规则"]),
    el("span", { class: "muted" }, ["→"]),
    el("span", { class: "chip blue", title: "智能路由模型判定问题相关的 benchmark 维度，按维度平均成绩与成本选模型；综合分接近可聚合" }, ["2 智能判维"]),
    el("span", { class: "muted" }, ["→"]),
    el("span", { class: "chip blue", title: "判定维度全部缺分或调用异常时，兜底模型直连" }, ["3 else 兜底"]),
    el("span", { class: "muted", style: "margin-left:4px" }, ["详细规则见右上角「模型路由规则」"]),
  ]));
  box.appendChild(rulesBlock);
  const listBox = el("div", {});
  box.appendChild(listBox);
  renderPolicies(listBox, policies, actives);

}
const RENDER = { models: renderModels, dispatch: renderDispatch, profile: renderProfile };
// 走查深链：?register=1 直接打开添加模型；?policy=1 打开第一条策略的参数抽屉
setTimeout(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get("register")) registerDialog();
  if (q.get("policy")) {
    try {
      const [{ policies }, { models }] = await Promise.all([UI.api("/v1/policies"), UI.api("/v1/models")]);
      const p0 = policies && policies[0];
      if (p0) editPolicy({ ...p0, params: p0.params || {}, budget_cap: p0.budget_cap || {} },
        (models || []).filter(m => m.status === "active"));
    } catch (e) { UI.toast("打开参数抽屉失败：" + e.message, true); }
  }
}, 900);
window.addEventListener("hashchange", () => showSection(location.hash.replace("#", "")));
showSection(location.hash.replace("#", "") || "dispatch", true);
</script>
