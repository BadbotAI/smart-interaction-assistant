<style>
  /* 两列：左选择/导入，右单组件预览 */
  .style-split { display: grid; grid-template-columns: minmax(440px, 48fr) minmax(0, 52fr); gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .style-split { grid-template-columns: 1fr; } }
  .demo-one { max-width: none; }
  /* 组件示例网格（与组件模板同款陈列） */
  .demo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-items: stretch; }
  .demo-card { display: flex; flex-direction: column; gap: 8px; height: 100%; }
  .demo-card .head { display: flex; align-items: center; gap: 8px; }
  .demo-card .head .name { font-weight: 700; font-size: var(--font-base); }
  .demo-card .mock-area { flex: 1; display: flex; flex-direction: column; }
  .demo-card .mock-area .chat-mock { flex: 1; }
  /* Figma 级 token 编辑行 */
  .tok-group { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: #fff; }
  .tok-group summary { cursor: pointer; padding: 9px 14px; font-weight: 600; font-size: var(--font-small); color: var(--text-secondary); user-select: none; }
  .tok-group[open] summary { border-bottom: 1px solid var(--border); }
  .tok-rows { padding: 6px 10px 10px; }
  .tok-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 90px 46px; gap: 3px 9px;
    align-items: center; padding: 8px 5px; border-radius: 8px; }
  .tok-row > .tok-chip { grid-column: 1; grid-row: 1; }
  .tok-row > .tok-name { grid-column: 2; grid-row: 1; }
  .tok-row > .tok-hex { grid-column: 3; grid-row: 1; }
  .tok-row > .tok-demo-host { grid-column: 4; grid-row: 1; }
  .tok-row > .tok-desc { grid-column: 2 / -1; grid-row: 2; }
  .tok-row:hover { background: var(--bg-surface); }
  .tok-chip { width: 26px; height: 26px; padding: 1px; border: 1px solid var(--border); border-radius: 7px; cursor: pointer; flex: none; }
  .tok-name { font-size: var(--font-small); font-weight: 600; white-space: nowrap; }
  .tok-var { font-family: var(--font-mono, ui-monospace, Menlo, monospace); font-size: 10.5px;
    color: var(--text-secondary); background: var(--bg-surface); border-radius: 4px; padding: 0 4px; margin-right: 5px; }
  .tok-desc { font-size: var(--font-caption); color: var(--text-muted); line-height: 1.55; }
  .tok-demo-host { flex: none; display: inline-flex; }
  .tok-demo { display: inline-flex; align-items: center; justify-content: center;
    width: 46px; height: 24px; border-radius: 6px; border: 1px solid var(--border); overflow: hidden; }
  .tok-demo i { display: block; }
  .tok-key { font-size: 11px; color: var(--text-muted); flex: 1; }
  .tok-hex { width: 100%; min-width: 0; font-family: var(--font-mono, monospace); font-size: 11.5px; padding: 4px 6px; text-transform: uppercase; }
</style>
</head>

function buildEnvelope(ct, config, prompt) {
  const params = { prompt: ct === "entry.link" ? (prompt || "") : (prompt || "请选择"), submit_label: ct === "commerce.order" ? "去下单" : "提交", reply_text: "", echo_results: false };
  if (config.options) { params.options = config.options; params.recommended_default = config.recommended_default || null; }
  if (config.option_meta) params.option_meta = config.option_meta;
  if (config.option_actions) params.option_actions = config.option_actions;
  if (ct === "matrix.compare+select") {
    params.dimensions = config.dimensions || ["价格", "时效"];
    params.values = (params.options || []).map((o, i) => params.dimensions.map((d, j) => Math.round((5 + ((i * 3 + j * 2) % 40) / 10) * 10) / 10));
  }
  if (ct === "scale.likert") params.likert = config.likert;
  if (ct === "form.structured") params.fields = config.fields;
  if (ct === "input.followup" || ct === "picker.location" || ct === "upload.file") params.placeholder = config.placeholder || "";
  if (ct === "slider.range") { const s = config.slider || {}; params.min = s.min ?? 0; params.max = s.max ?? 100; params.unit = s.unit || ""; }
  return { schema_version: "1.0.0", render_id: "ds-" + Math.random().toString(36).slice(2), component_type: ct,
    semantic_category: "collect", trigger_source: "model_tool_call", card_ref: null, params, group_mode: null, degraded_text: params.prompt };
}

      if (oo.size != null) opts.size = oo.size;
      if (oo.size_px != null) { opts.size_px = oo.size_px; }
      else if (oo.size != null) { opts.size_px = Number((SIZES[oo.size] || SIZES[1])[1].replace("px", "")); }
      setSz(opts.size_px);
      if (oo.shadow != null) opts.shadow = oo.shadow;
      if (oo.shadow_custom) { opts.shadow_custom = oo.shadow_custom; }
      if (oo.density != null) opts.density = oo.density_scale === "v2" ? oo.density : ({ 0: 1, 1: 2, 2: 3 }[oo.density] ?? 2);
      drawPals(); drawTokens(); drawQuick(); drawFsCards(); drawSegs();
      syncShadowCustom();
      syncRad();
      fontSel && fontSel.setValue && fontSel.setValue(String(opts.font));
    }
    if (existing) {
      try {
        const t = await (await fetch("/brand/" + existing.file)).json();
        if (t._options && t._options.palette !== undefined) {
          Object.assign(opts, t._options);
          if (t._options.radius_unit !== "px") opts.radius = [2, 8, 16, 22, 28][t._options.radius] ?? 16;
          opts.font = Math.min(opts.font || 0, FONTS.length - 1);
          drawPals(); drawFsCards(); drawSegs();
          syncRad();
          fontSel && fontSel.setValue && fontSel.setValue(String(opts.font));
          applyPreview();
        } else {
          // 旧代码导入的风格：无选项快照，按默认选项进入编辑（保存后转为选项定义）
          Brand.apply(t); renderDemos();
        }
      } catch (e) {}
    } else { applyPreview(); setTimeout(applyPreview, 900); }
  })();
}

// ---------- 风格预设 ----------


// 页头两态：详情时只显示标题，编辑时显示「返回 + 在改哪套 + 取消/保存」
function setHead(mode, ctx) {
  const title = document.getElementById("brandHeadTitle");
  const actions = document.getElementById("brandHeadActions");
  const count = document.getElementById("brandCount");
  const head = document.getElementById("brandHead");
  if (mode === "edit") {
    const { existing, close, doSave } = ctx;
    head.classList.add("is-edit");
    title.textContent = existing ? "编辑主题" : "新建主题";
    const descE = document.getElementById("brandHeadDesc");
    if (descE) descE.textContent = existing
      ? "改动实时反映在预览；保存后，绑定该主题的产品同步生效。"
      : "先选行业风格起步，再调关键颜色与形态。";
    title.className = "page-title";        // 与列表态同一个类，字号才一致
    count.textContent = existing ? existing.brand_name : "";
    actions.innerHTML = "";
    actions.classList.add("theme-ed-actions");
    actions.append(
      UI.el("button", { class: "btn small", type: "button", onclick: close }, ["取消"]),
      UI.el("button", { class: "btn small primary ed-save", type: "button",
        onclick: (e) => doSave(e.currentTarget) }, [existing ? "保存修改" : "保存主题"]),
    );
    // 返回按钮放在标题左边，和工作台详情页一个位置
    head.querySelector(".ds-back")?.remove();
    // 标题外面包了 .page-head-main，锚点要取那一层：title 已不是 head 的直接子节点
    const headAnchor = head.querySelector(".page-head-main") || title;
    head.insertBefore(UI.el("button", { class: "btn small ds-back", type: "button", onclick: close }, ["返回"]), headAnchor);
  } else {
    const descL = document.getElementById("brandHeadDesc");
    if (descL) descL.textContent = "定义一套视觉风格，绑定给产品后成为其组件的默认样式。";
    head.classList.remove("is-edit");
    title.textContent = "风格主题";
    title.className = "page-title";
    count.textContent = "";
    head.querySelector(".ds-back")?.remove();   // .btn 的 display 会盖掉 [hidden]，直接移除最稳
    actions.innerHTML = "";
    actions.classList.remove("theme-ed-actions");
    // 新建入口此前只有 ?new=1 深链，页面上找不到；与工作台、产品页对齐放在页头右上
    actions.appendChild(UI.el("button", { class: "btn primary", type: "button",
      onclick: () => brandDialog(null) }, ["新建主题"]));
  }
}

const THEME_FONT_NAMES = ["苹方", "冬青黑体", "宋体", "楷体", "圆体", "Menlo 等宽"];
const THEME_WEIGHT_NAMES = ["细", "常规", "中等", "半粗", "加粗"];
const THEME_SHADOW_NAMES = ["无阴影", "轻阴影", "中阴影", "重阴影"];
const THEME_DENSITY_NAMES = ["极紧凑", "紧凑", "标准", "宽松", "极宽松"];

function themeSettingRow(label, value, sample) {
  return el("div", { class: "theme-detail-row" }, [
    el("span", { class: "theme-detail-label" }, [label]),
    el("span", { class: "theme-detail-value" }, [sample || null, value]),
  ]);
}

function themePaletteBlock(label, colors) {
  const entries = [
    ["主色", colors.primary], ["强调", colors.accent], ["页面", colors.bg_page],
    ["卡片", colors.bg_elevated || colors.bg_surface], ["文字", colors.text_primary], ["边框", colors.border],
  ];
  return el("div", { class: "theme-palette-block" }, [
    el("div", { class: "theme-palette-label" }, [label]),
    el("div", { class: "theme-palette-strip" }, entries.map(([name, color]) =>
      el("span", { class: "theme-palette-swatch", title: `${name} ${color || "未设置"}`,
        style: `background:${color || "transparent"}` }))),
  ]);
}

function renderCurrentThemeDetail(brand, tokens) {
  const host = document.getElementById("currentThemeDetail");
  if (!host) return;
  brand = brand || brands.find(b => b.file === previewFile) || brands[0];
  if (!brand || !tokens) {
    host.innerHTML = "";
    host.appendChild(el("div", { class: "muted", style: "font-size:var(--font-small)" }, ["暂无主题设置"]));
    return;
  }
  const light = tokens.color || {};
  const dark = tokens.color_dark || {};
  const options = tokens._options || {};
  const radius = tokens.radius || {};
  const font = tokens.font || {};
  const users = products.filter(p => p.brand_file === brand.file);
  const densityFallback = { compact: "紧凑", regular: "标准", loose: "宽松" }[tokens.density] || "标准";
  const densityIndex = options.density_scale === "v2" ? options.density : ({ 0: 1, 1: 2, 2: 3 }[options.density]);
  const density = densityIndex != null ? (THEME_DENSITY_NAMES[densityIndex] || densityFallback) : densityFallback;
  const fontName = options.font != null ? (THEME_FONT_NAMES[options.font] || "系统字体")
    : (/Songti|SimSun|STSong/.test(font.family || "") ? "宋体" : /Menlo|monospace/.test(font.family || "") ? "Menlo 等宽" : "系统字体");
  const fontSize = `${options.size_px || parseInt(font.size_base, 10) || 14}px`;
  const weight = options.weight != null ? (THEME_WEIGHT_NAMES[options.weight] || "常规") : "常规";
  const shadow = options.shadow_custom ? "自定义阴影"
    : (options.shadow != null ? (THEME_SHADOW_NAMES[options.shadow] || "轻阴影") : (tokens.shadow ? "轻阴影" : "无阴影"));
  const canEdit = brand.brand_id !== "default";
  host.innerHTML = "";
  host.appendChild(el("div", { class: "theme-detail-head" }, [
    el("div", { class: "theme-detail-heading" }, [
      el("span", { class: "ds-side-section-title" }, ["当前主题"]),
      el("strong", {}, [brand.brand_name || brand.file]),
      el("span", { class: "muted" }, [brand.brand_id === "default" ? "平台默认主题" : "自定义主题"]),
    ]),
    canEdit ? el("button", {
      class: "btn small theme-detail-edit", type: "button", title: "编辑当前主题",
      onclick: () => brandDialog(brand),
    }, ["编辑主题"]) : null,
    // 删除入口原先只有后端接口，页面上找不到——补到主题自己的操作里
    canEdit ? (() => {
      const more = el("button", { class: "btn small", type: "button", onclick: () => UI.menu(more, [
        { label: "删除主题", danger: true, onClick: () => deleteBrand(brand, users) },
      ]) }, ["更多"]);
      return more;
    })() : null,
  ]));
  if (users.length) host.appendChild(el("div", { class: "theme-detail-usage", title: users.map(p => p.name).join("、") }, [
    UI.icon("box", 13), el("span", {}, [`已用于 ${users.length} 个产品`]),
  ]));
  host.append(
    el("section", { class: "theme-detail-section" }, [
      el("div", { class: "theme-detail-section-title" }, ["颜色模式"]),
      themePaletteBlock("浅色", light),
      themePaletteBlock("深色", Object.keys(dark).length ? dark : light),
    ]),
    el("section", { class: "theme-detail-section" }, [
      el("div", { class: "theme-detail-section-title" }, ["组件外观"]),
      themeSettingRow("卡片圆角", radius.card || `${options.radius ?? 16}px`, el("i", { class: "theme-radius-sample", style: `border-radius:${radius.card || `${options.radius ?? 16}px`}` })),
      (() => { const rc = radius.control || `${Math.max(4, Math.round((options.radius ?? 16) * .6))}px`;
        // 和卡片圆角一样给个示意方块，同一组里不能一个有一个没有
        return themeSettingRow("控件圆角", rc,
          el("i", { class: "theme-radius-sample", style: `border-radius:${rc}` })); })(),
      themeSettingRow("阴影", shadow),
      themeSettingRow("信息密度", density),
    ]),
    el("section", { class: "theme-detail-section" }, [
      el("div", { class: "theme-detail-section-title" }, ["排版"]),
      themeSettingRow("字体", fontName),
      themeSettingRow("正文字号", fontSize),
      themeSettingRow("正文字重", weight),
    ]),
  );
  renderThemeList(host, brand.file);
}

// 删除主题：默认主题不可删；用到它的产品会回落到默认主题，删除前把影响说清楚
async function deleteBrand(brand, users) {
  const used = (users || []).length
    ? `\n\n有 ${users.length} 个产品在用它（${users.map(p => p.name).join("、")}），删除后这些产品回落到默认主题。`
    : "";
  const ok = await UI.confirm("删除主题",
    `删除「${brand.brand_name || brand.file}」后不可恢复。${used}`, { okText: "删除", danger: true });
  if (!ok) return;
  try {
    await UI.api("/api/brands/delete", { method: "POST", body: { file: brand.file } });
    UI.toast("已删除主题");
    const wasCurrent = brand.file === previewFile;
    brands = (await UI.api("/api/brands")).brands;
    // 删的不是当前这套，就不该顺手把当前主题也换掉
    if (wasCurrent) {
      const fallback = brands.find(b => b.brand_id === "default") || brands[0];
      if (fallback) {
        previewFile = fallback.file;
        await UI.api("/api/brands/active", { method: "POST", body: { file: fallback.file } });
        await Brand.load(fallback.file).catch(() => {});
      }
    }
    refreshCurrentThemeDetail();
    renderDemos();
  } catch (e) { UI.toast(e.data?.error || e.message, true); }
}

// 其他已保存的主题：能看见、能切、能删。原先页面只显示"当前主题"一张卡，
// 建了第二套就再也找不到入口
function renderThemeList(host, curFile) {
  const rest = (brands || []).filter(b => b.file !== curFile);
  if (!rest.length) return;
  host.appendChild(el("section", { class: "theme-detail-section" }, [
    el("div", { class: "theme-detail-section-title" }, ["其他主题"]),
    ...rest.map(b => {
      const usedBy = (products || []).filter(p => p.brand_file === b.file);
      const isDefault = b.brand_id === "default";
      const row = el("div", { class: "theme-list-row" }, [
        el("span", { class: "theme-list-name" }, [b.brand_name || b.file]),
        el("span", { class: "muted theme-list-meta" }, [isDefault ? "平台默认主题"
          : usedBy.length ? `${usedBy.length} 个产品在用` : "未被使用"]),
        el("div", { style: "flex:1" }),
        el("button", { class: "btn small", type: "button", onclick: async () => {
          previewFile = b.file;
          await UI.api("/api/brands/active", { method: "POST", body: { file: b.file } });
          await Brand.load(b.file).catch(() => {});
          refreshCurrentThemeDetail(); renderDemos();
          UI.toast(`已切换到「${b.brand_name || b.file}」`);
        } }, ["启用"]),
        isDefault ? null : el("button", { class: "btn small", type: "button",
          onclick: () => brandDialog(b) }, ["编辑"]),
        isDefault ? null : el("button", { class: "btn small", type: "button",
          onclick: () => deleteBrand(b, usedBy) }, ["删除"]),
      ]);
      return row;
    }),
  ]));
}

async function refreshCurrentThemeDetail() {
  const brand = brands.find(b => b.file === previewFile) || brands[0];
  if (!brand) return renderCurrentThemeDetail();
  try {
    const tokens = await (await fetch("/brand/" + brand.file)).json();
    renderCurrentThemeDetail(brand, tokens);
  } catch (e) { renderCurrentThemeDetail(brand, Brand.get()); }
}

// 初始化
(async function init() {
  await new Promise(r => { const t = setInterval(() => { if (Brand.get()) { clearInterval(t); r(); } }, 60); setTimeout(() => { clearInterval(t); r(); }, 2500); });
  try { brands = (await UI.api("/api/brands")).brands; } catch (e) { brands = []; }
  try { products = (await UI.api("/api/products")).products || []; } catch (e) { products = []; }
  const activeTokens = Brand.get();
  const activeBrand = brands.find(b => b.brand_id === activeTokens?.brand_id);
  if (activeBrand) previewFile = activeBrand.file;
  refreshCurrentThemeDetail();
  setHead("list");          // 页头由 setHead 统一渲染
  mountDemoControls();
  renderDemos();
  // 深链：?new=1 新建；?edit=<brand_file> 直接编辑指定主题（产品配置里点「编辑主题」过来）
  const q1 = new URLSearchParams(location.search);
  if (q1.get("new")) brandDialog(null);
  else if (q1.get("edit")) {
    const hit = (brands || []).find(b => b.file === q1.get("edit"));
    if (hit) brandDialog(hit);
    else UI.toast("没找到这个主题，可能已被删除", true);
  }
})();
</script>
