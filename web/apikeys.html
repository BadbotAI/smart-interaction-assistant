<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%231DA1F2'/%3E%3Crect x='10.5' y='3.6' width='9.6' height='7.3' rx='2.7' fill='none' stroke='%23fff' stroke-width='1.5' opacity='0.75'/%3E%3Cpath d='M3.4 12a3.7 3.7 0 0 1 3.7-3.7h6a3.7 3.7 0 0 1 3.7 3.7v2.3a3.7 3.7 0 0 1-3.7 3.7H9.5l-3.1 2.6c-.55.46-1.3.07-1.3-.64v-2.4A3.7 3.7 0 0 1 3.4 14.3z' fill='%23fff'/%3E%3Ccircle cx='7.4' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='10.25' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='13.1' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3C/svg%3E">
<title>API 接入管理 · 智能交互平台</title>
<link rel="stylesheet" href="/web/shared.css">
</head>
<body>
<div class="page">
  <div class="page-head" style="display:flex;align-items:center;gap:6px">
    <div class="page-title">API 接入管理</div>
        <div style="flex:1"></div>
    <button class="btn primary" id="createBtn">创建密钥</button>
  </div>

  <div class="tab-bar" id="akTabs" style="margin-bottom:14px"></div>

  <div id="tabKeys">
    <div style="display:flex;align-items:center;margin-bottom:10px">
      <span class="muted" id="keyCount"></span>
    </div>
    <div class="card" style="padding:0">
      <div id="keyBox"></div>
    </div>
  </div>

  <div id="tabDocs" hidden>
    <div class="card">
      <div style="font-weight:600;font-size:var(--font-title);margin-bottom:4px">接入说明</div>
      <div class="muted" style="margin-bottom:12px">把整个平台包装成一个服务：你的产品带 API Key 调用下面任一入口，即可使用智能路由与交互组件能力，调用情况自动计入统计。</div>
      <div id="docBox"></div>
    </div>
  </div>

  <div id="tabStats" hidden>
    <div class="grid cols-3" id="statRow" style="margin-bottom:12px"></div>
    <div class="card muted">统计口径：调用量按对话路由请求计；带 Key 的调用会更新对应密钥的最后使用时间。</div>
  </div>
</div>

<script src="/web/tokens.js"></script>
<script src="/web/ui.js"></script>
<script>
UI.nav("apikeys");
const { el } = UI;
const AK_TABS = [["keys", "API Key 列表"], ["docs", "接入说明"], ["stats", "API 接入统计"]];
let akTab = "keys";
function drawAkTabs() {
  const bar = document.getElementById("akTabs");
  bar.innerHTML = "";
  AK_TABS.forEach(([k, name]) => bar.appendChild(el("button", { type: "button",
    class: "tab" + (akTab === k ? " active" : ""),
    onclick: () => { akTab = k;
      document.getElementById("tabKeys").hidden = k !== "keys";
      document.getElementById("tabDocs").hidden = k !== "docs";
      document.getElementById("tabStats").hidden = k !== "stats";
      document.getElementById("createBtn").style.display = k === "keys" ? "" : "none";
      drawAkTabs();
    } }, [name])));
}
drawAkTabs();

const DOCS = [
  ["对话路由 API", `curl -N -X POST https://your-domain/v1/route \\\\\n  -H "Content-Type: application/json" \\\\\n  -d '{"api_key": "sk-live-你的密钥", "text": "用户消息", "session_id": "sess-1", "user_id": "u-1"}'`,
   "SSE 流式返回思考步骤、最终回答、组件信封与决策摘要；带策略 Key（路由策略页）则按对应策略路由"],
  ["植入 SDK", `<script async src="https://cdn.your-domain.com/sia.js" data-key="sk-live-你的密钥"><\\/script>`,
   "一段代码把交互组件植入你的产品：对话触发 / 规则触发 / 显式调用，数据自动回传"],
  ["事件回传 API", `POST /v1/events  —— 交互事件批量上报（渲染 / 交互 / 提交 / 放弃）\nGET  /v1/cards/{card_id}/responses —— 拉取某配置的聚合结果（需开启回显）`,
   "事件 Schema 与字段字典见数据契约（仓库 contracts/ 目录）"],
];
const docBox = document.getElementById("docBox");
DOCS.forEach(([t, code, note]) => {
  docBox.appendChild(el("div", { style: "margin-bottom:14px" }, [
    el("div", { style: "display:flex;align-items:center;margin-bottom:4px" }, [
      el("span", { style: "font-weight:600;font-size:var(--font-small)" }, [t]),
      el("div", { style: "flex:1" }),
      el("button", { class: "btn small ghost", onclick: () => { navigator.clipboard.writeText(code); UI.toast("已复制"); } }, [UI.icon("copy", 13), "复制"]),
    ]),
    el("pre", { class: "code" }, [code]),
    el("div", { class: "muted" }, [note]),
  ]));
});

async function load() {
  const { keys, stats } = await UI.api("/api/apikeys");
  const sr = document.getElementById("statRow");
  sr.innerHTML = "";
  const tile = (l, v, s2) => el("div", { class: "stat-tile" }, [
    el("div", { class: "stat-label" }, [l]),
    el("div", { class: "stat-value num" }, [String(v)]),
    s2 ? el("div", { class: "stat-sub" }, [s2]) : null]);
  sr.append(tile("累计调用", stats.total_calls, "全部对话路由请求"),
            tile("近 7 天调用", stats.calls_7d),
            tile("API Key", stats.key_count, "明文仅创建时展示一次"));
  document.getElementById("keyCount").textContent = `${keys.length} 个密钥`;
  const box = document.getElementById("keyBox");
  box.innerHTML = "";
  if (!keys.length) {
    box.appendChild(el("div", { class: "empty-state" }, [
      el("div", { class: "empty-title" }, ["还没有 API Key"]),
      el("div", {}, ["点右上角「创建密钥」，把平台能力接进你的产品"]),
    ]));
    return;
  }
  box.appendChild(el("table", { class: "data" }, [
    el("thead", {}, [el("tr", {}, ["名称", "密钥", "创建时间", "最后使用", "操作"].map(h => el("th", {}, [h])))]),
    el("tbody", {}, keys.map(k => el("tr", {}, [
      el("td", { style: "font-weight:600" }, [k.name]),
      el("td", { class: "num" }, [k.prefix + "····"]),
      el("td", { class: "muted num" }, [UI.fmtTs(k.created_at)]),
      el("td", { class: "muted num" }, [k.last_used ? UI.fmtTs(k.last_used) : "从未使用"]),
      el("td", {}, [el("button", { class: "btn small", onclick: async () => {
        const ok = await UI.confirm("删除密钥", `删除「${k.name}」后，使用该密钥的调用将立即失效。`, { okText: "删除", danger: true });
        if (!ok) return;
        try { await UI.api(`/api/apikeys/${k.key_id}/delete`, { method: "POST" }); UI.toast("已删除"); load(); }
        catch (e) { UI.toast(e.data?.error || e.message, true); }
      } }, ["删除"])]),
    ]))),
  ]));
}

document.getElementById("createBtn").onclick = () => {
  const nameIn = el("input", { type: "text", maxlength: "15", placeholder: "例如：官网客服接入（1-15 字）" });
  const err = el("div", { class: "field-error" });
  const body = el("div", {}, [
    el("label", { class: "field" }, [el("span", { class: "label-text req" }, ["名称"]), nameIn]),
    err,
    el("div", { style: "display:flex;justify-content:flex-end;gap:8px;margin-top:12px" }, [
      el("button", { class: "btn", onclick: () => mask.remove() }, ["取消"]),
      el("button", { class: "btn primary", onclick: async (e) => {
        const name = nameIn.value.trim();
        if (!name) { err.textContent = "请填写名称（1-15 字）"; return; }
        await UI.withBusy(e.currentTarget, async () => {
          try {
            const r = await UI.api("/api/apikeys", { method: "POST", body: { name } });
            // 成功态：完整密钥只展示这一次
            body.innerHTML = "";
            body.append(
              el("div", { style: "display:flex;align-items:center;gap:8px;margin-bottom:10px" }, [
                el("span", { class: "chip green" }, ["创建成功"]),
                el("span", { style: "font-weight:600" }, [r.name]),
              ]),
              el("div", { class: "muted", style: "margin-bottom:8px" }, ["请立即复制保存——出于安全考虑，完整密钥只展示这一次，关闭后无法再次查看。"]),
              UI.keyField(null, r.secret),
              el("div", { style: "display:flex;justify-content:flex-end;gap:8px;margin-top:14px" }, [
                el("button", { class: "btn", onclick: () => { navigator.clipboard.writeText(r.secret); UI.toast("已复制密钥"); } }, [UI.icon("copy", 14), "复制密钥"]),
                el("button", { class: "btn primary", onclick: () => { mask.remove(); load(); } }, ["完成"]),
              ]),
            );
          } catch (e2) { err.textContent = e2.data?.error || e2.message; }
        }, "创建中……");
      } }, ["创建密钥"]),
    ]),
  ]);
  const mask = UI.modal("创建密钥", body, null, { persistent: true });
  setTimeout(() => nameIn.focus(), 100);
};

load().catch(e => UI.toast("加载失败：" + e.message, true));
</script>
</body>
</html>
