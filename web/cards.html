// 支持群体回显的组件：选项类 / 对比 / 商品下单 / 入口跳转（统计多少人点开）

// 每种基础类型的显示样式（MECE：本质定类型，展现做样式）
const LIKERT_PRESETS = [["1 ~ 5", 1, 5], ["0 ~ 5", 0, 5], ["0 ~ 3", 0, 3], ["1 ~ 10", 1, 10], ["0 ~ 10", 0, 10], ["-2 ~ +2", -2, 2]];

  "select.card": { prompt: "请选择方案", options: ["海运直达", "海铁联运"], submit_label: "确认",

  "control.confirm": { prompt: "确认取消本次订单？该操作不可撤销。", submit_label: "确认执行" },
  "feedback.binary": { prompt: "这条回答怎么样" },
  "feedback.preference": { candidates: [{ label: "方案 A", content: "优先保证时效，成本上浮约 8%。" }, { label: "方案 B", content: "优先控制成本，预计多用 2 天。" }] },

  "picker.datetime": { prompt: "希望什么时间上门取件？", submit_label: "确认" },
  "rank.priority": { prompt: "请按重要程度排序", items: ["运费成本", "送达时效", "服务质量"], submit_label: "提交" },

  "chart.line": { title: "近半年走势", categories: ["4月", "5月", "6月", "7月", "8月", "9月"], series: [{ name: "金额", values: [122, 165, 148, 161, 178, 190] }] },
  "chart.bar": { title: "分区域对比", categories: ["华东", "华南", "华北"], series: [{ name: "数量", values: [352, 332, 372] }] },
  "chart.pie": { title: "构成占比", slices: [{ label: "华东", value: 42 }, { label: "华南", value: 27 }, { label: "其他", value: 31 }] },
  "chart.waterfall": { title: "利润构成", categories: ["营收", "运费", "仓储", "退款"], values: [420, -86, -54, -32] },
  "metric.card": { label: "本月累计金额", value: "1,286", unit: "万元", delta: "4.2%" },
  "timeline": { title: "处理进度", events: [

  "steps": { title: "操作指引", steps: ["填写信息", "上传凭证", "等待审核"], current_index: 1 },
  "matrix.compare": { title: "方案对比", options: ["方案 A", "方案 B"], dimensions: ["时效", "成本"], values: [[8, 6], [6, 9]] },
  "list.ordered": { title: "注意事项", items: ["保留原包装以便验收", "签收前拍照留证"] },
  "text.emphasis": { value: "本月履约率 98.6%，创近半年新高", caption: "对比上月 +1.2 个百分点", tone: "positive" },
};
// 空产品的起步卡：一套标准组件，看清楚再决定导不导
function presetOnboard() {
  const box = el("div", { class: "preset-onboard" }, [
    el("div", { class: "po-head" }, [
      el("div", { class: "po-t" }, ["这个产品还没有组件"]),
      el("div", { class: "po-d" }, ["下面这套标准组件可以一键导入，导入后默认都是下线的，挑需要的打开就行"]),
    ]),
    el("div", { class: "po-grid" }, [el("span", { class: "muted" }, ["读取中……"])]),
    el("div", { class: "po-foot" }, [
      el("button", { class: "btn", type: "button", onclick: () => {
        box.replaceWith(el("div", { class: "empty-state" }, [
          el("div", { class: "empty-title" }, ["还没有组件"]),
          el("button", { class: "btn primary", style: "margin-top:10px",
            onclick: () => newConfigWizard() }, ["新建组件"]),
        ]));
      } }, ["不用了，我自己建"]),
      el("div", { style: "flex:1" }),
      el("button", { class: "btn", type: "button", onclick: () => newConfigWizard() }, ["新建组件"]),
      (() => {
        const b = el("button", { class: "btn primary", type: "button" }, ["一键导入"]);
        b.onclick = async () => {
          const pid = curProduct && curProduct !== "__unbound" ? curProduct : null;
          if (!pid) { UI.toast("请先在上方选择一个产品", true); return; }
          await UI.withBusy(b, async () => {
            try {
              const r = await UI.api(`/api/products/${pid}/presets`, { method: "POST" });
              UI.toast(`已导入 ${r.added} 个组件，都在「已下线」里`);
              statusTab = "offline";
              await loadCards(); loadKpisAndTodos();
            } catch (e) { UI.toast(e.data?.error || e.message, true); }
          }, "导入中……");
        };
        return b;
      })(),
    ]),
  ]);
  // 列出要导入的组件，每个带自己的缩略预览
  UI.api("/api/products/preset-templates").then(({ templates }) => {
    const grid = box.querySelector(".po-grid");
    grid.innerHTML = "";
    (templates || []).forEach(t => {
      const cell = el("div", { class: "po-cell" }, [
        el("span", { class: "tpl-ico", style: "width:28px;height:28px" },
          [UI.icon(CT_ICONS[t.component_type] || "grid", 15)]),
        el("span", { class: "po-name" }, [t.name]),
        el("span", { class: "chip gray" }, [UI.ctName(t.component_type) || t.component_type]),
      ]);
      grid.appendChild(cell);
    });
    box.querySelector(".po-t").textContent = `这个产品还没有组件（可导入 ${(templates || []).length} 个）`;
  }).catch(() => { box.querySelector(".po-grid").textContent = "标准组件读取失败"; });
  return box;
}

function tileEnv(c) {
  const cfg = (c.field_bindings || {}).config || {};
  const tt = c.text_templates || {};
  const params = { ...(WB_DEMO[c.component_type] || {}) };
  if (tt.prompt) params.prompt = tt.prompt;
  if (tt.submit) params.submit_label = tt.submit;
  if (tt.submitted) params.submitted_label = tt.submitted;
  if (tt.confirm) params.confirm_label = tt.confirm;
  if (tt.cancel) params.cancel_label = tt.cancel;
  if (cfg.content_mode === "fixed") {
    if ((cfg.options || []).length) {
      if (c.component_type === "rank.priority") params.items = cfg.options;
      else params.options = cfg.options;
    }
    if ((cfg.fields || []).length) params.fields = cfg.fields;
    if (cfg.recommended_default) params.recommended_default = cfg.recommended_default;
    if (cfg.present_params) Object.assign(params, cfg.present_params);
  }
  if (cfg.slider) {
    ["min", "max", "step", "unit", "default"].forEach(k => { if (cfg.slider[k] != null && cfg.slider[k] !== "") params[k] = cfg.slider[k]; });
  }
  if (cfg.likert) params.likert = cfg.likert;
  if (cfg.multi) params.multi = true;
  // 0913Mia调整：工作台预览仅同步选择数量配置，选择器固定使用提交按钮
  ["min_select"].forEach(k => {
    if (cfg[k] !== undefined && cfg[k] !== "") params[k] = cfg[k];
  });
  if (cfg.max_select) params.max_select = cfg.max_select;
  if (cfg.down_reasons) params.down_reasons = cfg.down_reasons;
  const selectorDisplay = selectorDisplayOf(c.component_type);
  if (selectorDisplay) params.display = selectorDisplay;
  else if (cfg.display) params.display = cfg.display;
  return { schema_version: "1.0.0", render_id: "wb-" + c.card_id, component_type: c.component_type,
    semantic_category: "present", trigger_source: "wb_preview", card_ref: null,
    params, style_overrides: c.style_overrides || {} };
}
let statusTab = "";
const wbCats = new Set();
let categoryMenuOpen = false;
const WB_CATS = [
  ["all", "全部"],
  ["sel", "选择", ["select.single", "select.multi", "select.card", "feedback.preference"]],
  ["rank", "排序", ["rank.priority"]],
  ["form", "表单", ["form.structured"]],
  ["number", "数值", ["slider.range"]],
  ["rating", "评价", ["scale.likert", "feedback.binary"]],
  ["datetime", "日期时间", ["picker.datetime"]],
  ["cfm", "确认", ["control.confirm"]],
  ["chart", "图表", ["chart.line", "chart.bar", "chart.pie", "chart.waterfall", "chart.area", "metric.card"]],
  ["tbl", "表格", ["table", "matrix.compare"]],
  ["flow", "流程", ["timeline", "steps"]],
  ["text", "文本", ["list.ordered", "text.emphasis"]],
];
let statsByCard = {};
const STATUS_TABS = [["", "全部"], ["published", "已上线"], ["offline", "已下线"], ["draft", "草稿箱"]];
function renderStatusTabs(counts = {}) {
  const bar = document.getElementById("statusTabs");
  bar.innerHTML = "";
  bar.className = "tab-bar";
  STATUS_TABS.forEach(([key, name]) => bar.appendChild(el("button", {
    class: "tab" + (key === statusTab ? " active" : ""),
    onclick: () => { if (key === statusTab) return; statusTab = key; loadCards(); },
  }, [name, counts[key] != null && key !== "" ? el("span", { class: "tab-count num" }, [String(counts[key])]) : null])));
}

function renderCategoryFilter(cards = []) {
  const host = document.getElementById("categoryFilter");
  host.innerHTML = "";
  const available = WB_CATS.slice(1).map(([key, name, types]) => ({
    key, name, count: cards.filter(c => types.includes(c.component_type)).length,
  }));

  const label = wbCats.size === 0 ? "全部分类"
    : wbCats.size === 1 ? (available.find(x => wbCats.has(x.key))?.name || "已选 1 类")
    : `已选 ${wbCats.size} 类`;
  const trigger = el("button", { type: "button", class: "wb-cat-trigger" + (wbCats.size ? " active" : ""),
    "aria-haspopup": "true", "aria-expanded": String(categoryMenuOpen) }, [
    el("span", { class: "wb-cat-trigger-label" }, [label]),
    el("span", { class: "wb-cat-chevron", "aria-hidden": "true" }),
  ]);
  const menu = el("div", { class: "wb-cat-menu", role: "group", "aria-label": "组件分类",
    ...(categoryMenuOpen ? {} : { hidden: true }) });
  const close = () => { categoryMenuOpen = false; menu.hidden = true; trigger.setAttribute("aria-expanded", "false"); };
  const apply = () => { categoryMenuOpen = true; loadCards(); };

  const allInput = el("input", { type: "checkbox", ...(wbCats.size === 0 ? { checked: "" } : {}) });
  allInput.onchange = () => { wbCats.clear(); apply(); };
  menu.appendChild(el("label", { class: "wb-cat-option all" }, [
    allInput, el("span", {}, ["全部"]), el("span", { class: "muted num" }, [String(cards.length)]),
  ]));
  available.forEach(({ key, name, count }) => {
    const input = el("input", { type: "checkbox", ...(wbCats.has(key) ? { checked: "" } : {}) });
    input.onchange = () => { input.checked ? wbCats.add(key) : wbCats.delete(key); apply(); };
    menu.appendChild(el("label", { class: "wb-cat-option" }, [
      input, el("span", {}, [name]), el("span", { class: "muted num" }, [String(count)]),
    ]));
  });
  trigger.onclick = (e) => {
    e.stopPropagation();
    const opening = !categoryMenuOpen;
    document.querySelectorAll(".wb-cat-menu:not([hidden])").forEach(x => x.hidden = true);
    categoryMenuOpen = opening;
    menu.hidden = !opening;
    trigger.setAttribute("aria-expanded", String(opening));
  };
  const wrap = el("div", { class: "wb-cat-filter" }, [trigger, menu]);
  wrap.onclick = e => e.stopPropagation();
  wrap.onkeydown = e => { if (e.key === "Escape") { close(); trigger.focus(); } };
  host.appendChild(wrap);
}


function shortProductId2(pid) {
  const hex = String(pid).replace(/[^0-9a-f]/gi, "").slice(0, 8) || "0";
  return String(parseInt(hex, 16) % 1000000).padStart(6, "0");
}

function styleSummary(c) {
  const so = c.style_overrides || {};
  const parts = [];
  if (so["color.primary"]) parts.push("主色 " + so["color.primary"]);
  const isNum = (v) => Number.isFinite(Number(v));
  if (so.radius != null) parts.push(isNum(so.radius) ? `圆角${so.radius}px` : ({ none: "直角", sm: "小圆角", md: "标准圆角", lg: "大圆角", full: "全圆" }[so.radius] || so.radius));
  if (so.height != null) parts.push(isNum(so.height) ? `高度${so.height}px`
    : ({ compact: "紧凑高度", regular: "标准高度", large: "宽大高度" }[so.height] || ""));
  if (so.spacing != null) parts.push(isNum(so.spacing) ? `间距${so.spacing}px` : ({ compact: "紧凑", regular: "标准", loose: "宽松" }[so.spacing] || "") + "密度");
  if (so.shadow) parts.push("阴影" + ({ none: "无", sm: "轻", md: "中", lg: "重" }[so.shadow] || ""));
  if (so.font_scale != null) parts.push(Number(so.font_scale) >= 10 ? `字号${so.font_scale}px` : "字号" + ({ "-1": "小一档", "1": "大一档", "2": "大两档" }[so.font_scale] || ""));
  const disp = selectorDisplayOf(c.component_type) || ((c.field_bindings || {}).config || {}).display;
  if (disp === "card") parts.push("卡片样式");
  const clean = parts.filter(Boolean);
  return clean.length ? clean.join(" · ") : "主题默认";
}

async function loadKpisAndTodos() {
  try {
    const [q, { cards: allCards }] = await Promise.all([
      UI.api("/api/dashboard/questions?days=30"), UI.api("/api/cards"),
    ]);
    statsByCard = {};
    q.questions.forEach(x => statsByCard[x.card_id] = x);
    // 与列表同口径：有生效快照即已上线
    const published = allCards.filter(c => c.status === "published" || (c.status === "draft" && c.version >= 1));
    const totalSubmitted = q.questions.reduce((s, x) => s + x.submitted, 0);
    const totalRendered = q.questions.reduce((s, x) => s + x.rendered, 0);
    const kpi = document.getElementById("kpiRow");
    if (!kpi) return;
    kpi.innerHTML = "";
    const tile = (label, value, help) => el("div", { class: "stat-tile" }, [
      el("div", { class: "stat-label" }, [label, help ? UI.help(help) : null]),
      el("div", { class: "stat-value" }, [String(value)]),
    ]);
    kpi.appendChild(tile("已上线配置", published.length));
    kpi.appendChild(tile("组件触发", totalRendered, "近 30 天组件被渲染到对话中的次数"));
    kpi.appendChild(tile("提交率", totalRendered && totalSubmitted <= totalRendered ? UI.fmtPct(totalSubmitted / totalRendered) : "-", "提交 / 触发，近 30 天"));

function shortId(cardId) {
  const hex = String(cardId).replace(/-/g, "").slice(0, 8);

let _loadSeq = 0;
async function loadCards() {
  const seq = ++_loadSeq;
  if (!document.querySelector(".card-row")) UI.loading(document.getElementById("cardList"));
  const q = document.getElementById("searchInput").value.trim();
  const params = new URLSearchParams();
  if (q) params.set("q", q);
  const [{ cards: all }, prodRes, brandRes] = await Promise.all([
    UI.api("/api/cards?" + params),
    UI.api("/api/products").catch(() => ({ products: [] })),
    UI.api("/api/brands").catch(() => ({ brands: [] })),
  ]);
  window.__allCards = all;
  if (seq !== _loadSeq) return; // 已有更新的请求在途，丢弃过期响应
  const products = prodRes.products || [];
  const brands = brandRes.brands || [];
  // 产品封面：当前产品决定下方列表范围；「未绑定产品」是一个虚拟分组
  if (curProduct === null) curProduct = products.length ? products[0].product_id : "__unbound";
  if (curProduct !== "__unbound" && !products.find(p => p.product_id === curProduct)) {
    curProduct = products.length ? products[0].product_id : "__unbound";
  }
  const bound = new Set(products.flatMap(p => p.card_ids || []));
  const scoped = !products.length ? all
    : curProduct === "__unbound" ? all.filter(c => !bound.has(c.card_id))
    : all.filter(c => ((products.find(p => p.product_id === curProduct) || {}).card_ids || []).includes(c.card_id));
  // 组件预览始终跟随「当前正在看的产品」的风格主题（不是平台活跃主题）
  const curP = products.find(x => x.product_id === curProduct);
  if (curP && curP.brand_file && localStorage.getItem("brand_file") !== curP.brand_file) {
    localStorage.setItem("brand_file", curP.brand_file);
    Brand.load(curP.brand_file).then(() => {
      if (!window.__brandReloaded) { window.__brandReloaded = true; loadCards(); }
    }).catch(() => {});
  }
  renderProductCover(products, brands, all.filter(c => !bound.has(c.card_id)).length);
  const counts = { "": scoped.length };
  ["published", "offline", "draft"].forEach(k => counts[k] = scoped.filter(c => effStatus(c) === k).length);
  renderStatusTabs(counts);
  const cards = statusTab ? scoped.filter(c => effStatus(c) === statusTab) : scoped;
  renderCategoryFilter(cards);
  const selectedTypes = new Set(WB_CATS.filter(([key]) => wbCats.has(key)).flatMap(([, , types]) => types || []));
  const shown2 = wbCats.size ? cards.filter(c => selectedTypes.has(c.component_type)) : cards;
  const list = document.getElementById("cardList");
  list.innerHTML = "";
  // 搜索 / 筛选反馈：显示命中条数，让检索结果可感知
  document.getElementById("listCount").textContent = (q || wbCats.size) ? `命中 ${shown2.length} 条` : "";
  if (!shown2.length) {
    if (q) {
      list.appendChild(el("div", { class: "empty-state" }, [
        el("div", { class: "empty-title" }, [`没有找到与「${q}」相关的组件实例`]),
        el("div", {}, ["换个关键词试试，或清空搜索查看全部。"]),
        el("button", { class: "btn", style: "margin-top:10px", onclick: () => {
          document.getElementById("searchInput").value = "";
          statusTab = "";
          wbCats.clear();
          loadCards();
        } }, ["清空搜索"]),
      ]));
    } else if (wbCats.size) {
      list.appendChild(el("div", { class: "empty-state" }, [
        el("div", { class: "empty-title" }, ["所选分类下暂无组件实例"]),
        el("div", {}, ["可以调整分类，或查看全部组件。"]),
        el("button", { class: "btn", style: "margin-top:10px", onclick: () => {
          wbCats.clear(); loadCards();
        } }, ["查看全部"]),
      ]));
    } else if (statusTab) {
      // 状态筛选下的真实空态：不是搜索问题，别引导用户改关键词
      const emptyCopy = {
        draft: ["暂无草稿", "编辑器里点「保存草稿」的实例会出现在这里"],
        published: ["暂无已上线的实例", "在编辑器里「保存并发布」后会出现在这里"],
        offline: ["暂无已下线的实例", "从「更多」菜单下线的实例会出现在这里"],
      }[statusTab] || ["该状态下暂无实例", ""];
      list.appendChild(el("div", { class: "empty-state" }, [
        el("div", { class: "empty-title" }, [emptyCopy[0]]),
        el("div", {}, [emptyCopy[1]]),
        el("button", { class: "btn primary", style: "margin-top:10px", onclick: () => newConfigWizard() }, ["新建组件"]),
      ]));
    } else {
      list.appendChild(presetOnboard());
    }
    return;
  }
  const gridBox = el("div", { class: "wb-grid" }, shown2.map(c => buildCardRow(c)));
  list.appendChild(gridBox);
}

// 单行构建：局部刷新用（状态开关切换后只替换该行，不重建整个列表）
// —— 批量操作：勾选集合 + 浮动操作条（上线 / 下线选中项） ——
const batchSel = new Set();
let batchMode = false;   // 默认关闭：复选框只在进入批量操作后出现
function setBatchMode(on) {
  batchMode = on;
  if (!on) { batchSel.clear(); batchBar(); }
  document.body.classList.toggle("batch-on", on);
  const b = document.getElementById("batchToggle");
  if (b) { b.textContent = on ? "退出批量" : "批量操作"; b.classList.toggle("primary", on); }
  loadCards();
}
function batchBar() {
  let bar = document.getElementById("batchBar");
  if (!bar) {
    bar = el("div", { id: "batchBar", class: "batch-bar", hidden: true });
    document.body.appendChild(bar);
  }
  bar.innerHTML = "";
  if (!batchSel.size) { bar.hidden = true; return; }
  bar.hidden = false;
  const run = async (action, label) => {
    const ids = [...batchSel];
    let ok = 0, fail = 0;
    for (const id of ids) {
      try { await UI.api(`/api/cards/${id}/transition`, { method: "POST", body: { action } }); ok++; }
      catch (e) { fail++; }
    }
    UI.toast(`${label}完成：成功 ${ok} 个${fail ? `，失败 ${fail} 个（状态不允许）` : ""}`, fail > 0);
    batchSel.clear(); batchBar(); loadCards();
  };
  bar.append(
    el("span", { style: "font-weight:600" }, [`已选 ${batchSel.size} 个`]),
    el("button", { class: "btn small ghost", onclick: () => {
      document.querySelectorAll(".wb-card .cr-check input").forEach(i => { if (!i.checked) i.click(); });
    } }, ["全选当前列表"]),
    el("button", { class: "btn small", onclick: () => run("publish", "批量上线") }, ["批量上线"]),
    el("button", { class: "btn small", onclick: () => run("offline", "批量下线") }, ["批量下线"]),
    el("button", { class: "btn small ghost", onclick: () => { setBatchMode(false); batchSel.clear(); batchBar();
      document.querySelectorAll(".cr-check input").forEach(i => i.checked = false); } }, ["取消选择"]),
  );
}
function buildCardRow(c) {
  {
    const eff = effStatus(c);

      el("input", { type: "checkbox", "aria-label": "选择 " + c.name, ...(batchSel.has(c.card_id) ? { checked: "" } : {}),
        onchange: (e) => { e.target.checked ? batchSel.add(c.card_id) : batchSel.delete(c.card_id); batchBar(); } }),
    ]) : null;
    const sm = styleSummary(c);
    // 上线 / 下线：明确的文字按钮，放在卡片右上角
    const doPublish = async () => {
      try {
        const resp = await UI.api(`/api/cards/${c.card_id}/transition`, { method: "POST", body: { action: "publish" } });
        if (resp.warning) UI.toast(resp.warning, true); else UI.toast("已上线");
        loadCards(); loadKpisAndTodos();

          swInput,

          el("span", { class: "sw-text" }, [stText]),

    return el("div", { class: "wb-card card-row", "data-cid": c.card_id }, [
      el("div", { class: "wb-head" }, [

function moreButton(c, eff) {
  // 统一菜单：发布（仅草稿）/ 复制 / 接入信息 / 删除。已上线实例不可直接删，给出「先下线」的明确路径
  const moreBtn = el("button", { class: "btn small", onclick: () => UI.menu(moreBtn, [
    eff === "draft" ? { label: "发布", onClick: async () => {
      try {
        const resp = await UI.api(`/api/cards/${c.card_id}/transition`, { method: "POST", body: { action: "publish" } });
        if (resp.warning) UI.toast(resp.warning, true); else UI.toast("已发布并上线");
        loadCards(); loadKpisAndTodos();
      } catch (e) {
        const err = e.data?.error || {};
        UI.toast(err.message || e.message, true);
        if (err.errors) UI.modal("无法发布", el("div", {}, [
          el("div", { class: "secondary", style: "margin-bottom:8px" }, ["以下内容还没填好："]),
          ...err.errors.map(x => el("div", { class: "field-error" }, [`${FIELD_LABEL[x.field] || x.field}：${x.message}`])),
          el("button", { class: "btn primary", style: "margin-top:12px",
            onclick: () => { document.querySelector(".modal-mask")?.remove(); openEditor(c.card_id); } }, ["去修改"]),
        ]));
      }
    } } : null,
    { label: "复制组件", onClick: () => duplicateCard(c) },
    { label: "查看详情", onClick: () => openDetail(c.card_id) },
    eff === "published"
      ? { label: "下线后删除", danger: true, onClick: async () => {
          const ok = await UI.confirm("下线并删除", `「${c.name}」正在线上。需要先下线才能删除，下线后 AI 将不再触发它。`,
            { okText: "下线并删除", danger: true });
          if (!ok) return;
          try {
            await UI.api(`/api/cards/${c.card_id}/transition`, { method: "POST", body: { action: "offline" } });
            await UI.api(`/api/cards/${c.card_id}/transition`, { method: "POST", body: { action: "delete" } });
            UI.toast("已下线并删除"); loadCards(); loadKpisAndTodos();
          } catch (e) { UI.toast(e.data?.error?.message || e.message, true); }
        } }
      : { label: c.version >= 1 ? "删除配置（含线上版本）" : "删除配置", danger: true, onClick: () => doTransition(c, "delete") },
  ]) }, ["更多"]);
  return moreBtn;
}

// 复制实例：克隆内容与样式，生成不重名的草稿
async function duplicateCard(c) {
  const base = (c.name.length > 12 ? c.name.slice(0, 12) : c.name) + " 副本";
  const taken = new Set((window.__allCards || []).map(x => x.name));
  let name = base, i = 2;
  while (taken.has(name)) name = base + " " + (i++);
  try {
    const r = await UI.api("/api/cards", { method: "POST", body: {
      name, component_type: c.component_type, description: c.description || "",
      model_invokable: true, style_overrides: c.style_overrides || {},
      field_bindings: c.field_bindings || { config: {} },
      text_templates: c.text_templates || {}, emit_targets: c.emit_targets || ["model", "dashboard"],
    } });
    UI.toast(`已复制为「${name}」（草稿）`);
    loadCards(); loadKpisAndTodos();
    if (r && r.card) openEditor(r.card.card_id);
  } catch (e) { UI.toast(e.data?.error?.message || e.message, true); }
}

  const demo = JSON.stringify({ component_id: c.card_id, params: { "…": "模型按参数 schema 填入" } }, null, 2);

        el("span", { class: "label-text", style: "margin-bottom:0" }, ["渲染调用示例"]),

  ]), null, { width: "520px" });

async function doTransition(c, action, force = false, btn = null) {
  if (action === "offline" && !force) {
    const ok = await UI.confirm("下线配置", `「${c.name}」下线后 AI 不再触发，数据保留，可重新发布。`, { okText: "下线" });
    if (!ok) return;
  }
  if (action === "delete" && !force) {
    const ok = await UI.confirm("删除配置", `删除「${c.name}」？不可恢复，历史快照与数据保留用于审计。`, { okText: "删除", danger: true });
    if (!ok) return;
  }
  if (btn) btn.disabled = true;
  try {
    const resp = await UI.api(`/api/cards/${c.card_id}/transition`, { method: "POST", body: { action, force } });
    UI.toast({ publish: "已上线", offline: "已下线", delete: "已删除" }[action] || "完成");
    if (resp && resp.warning) setTimeout(() => UI.toast(resp.warning, true), 1200);
    loadCards(); loadKpisAndTodos();
  } catch (e) {
    const err = e.data?.error || {};
    if (err.code === "referenced") {
      const body = el("div", {}, [
        el("div", { class: "secondary" }, [err.message]),
        el("ul", { style: "padding-left:20px;margin:8px 0" },
          (err.refs || []).map(r => el("li", {}, [`${r.agent_id}（引用 v${r.version}）`]))),
        el("div", { style: "display:flex;gap:8px;margin-top:10px;justify-content:flex-end" }, [
          el("button", { class: "btn", onclick: () => mask.remove() }, ["取消"]),
          el("button", { class: "btn danger", onclick: () => { mask.remove(); doTransition(c, action, true); } },
            ["强制删除（运行时降级为纯文本）"]),
        ]),
      ]);
      const mask = UI.modal("配置被 Agent 引用", body);
    } else {
      UI.toast(err.message || e.message, true);
      if (err.errors) UI.modal("发布失败", el("div", {}, [
        el("div", { class: "secondary", style: "margin-bottom:8px" }, ["以下字段未通过校验，配置保持当前状态："]),
        ...err.errors.map(x => el("div", { class: "field-error" }, [`${FIELD_LABEL[x.field] || x.field}：${x.message}`])),
        el("button", { class: "btn primary", style: "margin-top:12px", onclick: () => { document.querySelector(".modal-mask")?.remove(); openEditor(c.card_id); } }, ["去修改"]),
      ]));
    }
  } finally { if (btn) btn.disabled = false; }
}

async function newConfigWizard(preset = {}) { return openEditor(undefined, preset); }

async function openEditor(cardId, prefill, initStep) {
  if (document.querySelector(".modal.editor")) return; // 防连点叠开多个编辑器
  if (!templateLibrary) templateLibrary = (await UI.api("/api/templates")).templates;
  let card = null;
  if (cardId) {
    try { card = (await UI.api(`/api/cards/${cardId}`)).card; }
    catch (e) { UI.toast("配置不存在或已删除", true); return; }
    if (card.status === "published" || (card.status === "draft" && card.version >= 1)) {
      UI.toast("已上线的配置不可编辑，请先在工作台下线", true);
      return;
    }
  }

  // 本地草稿静默恢复
  const saved = localStorage.getItem(draftKey(cardId));
  let restore = null;
  if (saved) { try { restore = JSON.parse(saved); } catch (e) {} }
  if (restore && !cardId) {
    // 新建一律从白纸开始（不再弹恢复询问）
    localStorage.removeItem(draftKey(cardId));
    restore = null;
  } else if (restore) UI.toast("已恢复上次未保存的编辑");
  // 旧草稿里 fixedOptions 是换行字符串，现在按数组存；恢复时归一化，避免老草稿打不开
  if (restore?.form && typeof restore.form.fixedOptions === "string") {
    restore.form.fixedOptions = restore.form.fixedOptions ? restore.form.fixedOptions.split("\n") : [];
  }

  const cfg = prefill ? (prefill.config || {}) : ((card?.field_bindings || {}).config || {});
  const state = restore?.form || {
    scene: prefill?.description || "",
    name: card?.name || "",
    description: card?.description || (prefill?.description || ""),
    trigger_description: card?.trigger_description || "",
    trigger_examples: card?.trigger_examples || [],
    styleOv: { ...(card?.style_overrides || {}) },
    reply_text: card?.text_templates?.reply || "",
    question: card?.text_templates?.prompt || (prefill?.prompt || ""),
    component_type: card?.component_type || (prefill?.component_type || ""),
    optionRows: (cfg.options || card?.option_source?.values || card?.option_source?.hint_values || []).map((o, i) => ({
      text: o, id: (cfg.option_ids || [])[i] || "opt-" + Math.random().toString(36).slice(2, 8),
      prompt: (cfg.option_actions || {})[o]?.prompt || "", api: (cfg.option_actions || {})[o]?.api || "",
      desc: (cfg.option_meta || {})[o]?.desc || "", image: (cfg.option_meta || {})[o]?.image || "",
      price: (cfg.option_meta || {})[o]?.price ?? "", price_original: (cfg.option_meta || {})[o]?.price_original ?? "",
      sales: (cfg.option_meta || {})[o]?.sales ?? "", tags: ((cfg.option_meta || {})[o]?.tags || []).join("，") })),
    fixedOptionRows: (cfg.content_mode === "fixed" ? (cfg.options || card?.option_source?.values || card?.option_source?.hint_values || []) : []).map((o, i) => ({
      id: (cfg.option_ids || [])[i] || "opt-" + Math.random().toString(36).slice(2, 8),
      text: o, desc: (cfg.option_meta || {})[o]?.desc || "", image: (cfg.option_meta || {})[o]?.image || "",
      tags: ((cfg.option_meta || {})[o]?.tags || []).join("，") })),
    recommended_default: cfg.recommended_default || "",
    dimensions: (cfg.dimensions || []).filter(d => typeof d === "string").join("\n"),
    fbDims: (cfg.dimensions || []).filter(d => d && typeof d === "object").map(d => d.label || d.key),
    matrixValues: (cfg.values || []).map(row => [...row]),
    likert_left: cfg.likert?.left || "非常不满意",
    likert_right: cfg.likert?.right || "非常满意",
    likert_from: cfg.likert?.from ?? 1,
    likert_to: cfg.likert?.to ?? (cfg.likert?.steps || 5),
    display: cfg.display || "",
    fieldRows: (cfg.fields || card?.field_bindings?.fields || []).map(f => ({ key: f.key || "", label: f.label || "", required: !!f.required })),
    guideSteps: (cfg.steps || []).map(st => ({ title: st.title || "", body: st.body || "" })),
    placeholder: cfg.placeholder || "",
    slider_min: cfg.slider?.min ?? 0,
    slider_max: cfg.slider?.max ?? 100,
    slider_unit: cfg.slider?.unit || "",
    submit: card?.text_templates?.submit || "提交",

      // 基础项直接进所属区域；高级项按区域各自收进「高级」折叠
      const advByZone = {};
      specList.forEach(it => {
        const z = layZoneOf(it[0]) || zoneOf(it[0]);
        const holder = el("div", {});
        renderItem(it, holder);
        if (!holder.children.length) return;      // deps 未满足
        const node = holder.firstElementChild;
        if (specOpts(it).adv) (advByZone[z] = advByZone[z] || []).push(node);
        else push(z, node);
      });
      Object.keys(advByZone).forEach(z => {
        const advBody = el("div", { style: "padding-top:4px" });
        advByZone[z].forEach(n => advBody.appendChild(n));

          el("summary", {}, [`高级（${advByZone[z].length} 项）`]), advBody]));

    }
    // 组件专属参数按 zone 分发：基础项进所属区域，高级项仍收进各区的「高级」折叠
    // 标题是几乎每个组件都有的文字角色，统一在文字层给一套（选择器已有自己的一套）。
    // 放在这里是因为 enumRow 在上面才定义，提前调用会踩 TDZ。
    if (!IS_SELECTOR && !["metric.card", "text.emphasis", "control.confirm"].includes(ct)) {
      zpush("text", numRow("title.size", "标题字号", 12, 22, 15));
      zpush("text", enumRow("title.weight", "标题字重", [["", "常规"], ["500", "中黑"], ["700", "加粗"]], upd));

    }
    if (ct === "form.structured") {
      zpush("text", numRow("flabel.size", "字段标签字号", 11, 17, 13));
      zpush("text", enumRow("flabel.weight", "字段标签字重", [["", "中黑"], ["400", "常规"], ["600", "加粗"]], upd));

    drawSpecArea(zpush);

    // 按区域依次输出：每个区 = 一个折叠组，区内含该区全部属性

    const zoneTitle = (z, title, desc) => (z === "option" && PRESENT_TYPES.includes(ct))
      ? ["条目与标记", "每一条内容的呈现方式"] : [title, desc];
    const selectorMeta = LAY ? LAY.zones : [
      ["panel", "01 容器", "组件最外层的尺寸与视觉"],
      ["layout", "02 布局", "控制内容密度、模块间距与选项排列"],
      ["option", "03 选项", "选项容器、选择控件、间距与状态"],
      ["text", "04 文字", "标题、描述、选项名称与选项描述"],
      ["tag", "05 标签", "推荐标签的文字、背景、圆角与预设"],
      ["button", "06 按钮", "提交按钮的高度、底色、文字颜色与圆角"],

    // 单选画的是 Radio、多选画的是 Checkbox，面板上就该叫当下这一个，不摆「Radio / Checkbox」
    const PICK_CTRL = state.multiSelect ? "Checkbox" : "Radio";
    const subgroupMaps = LAY ? LAY.sub : {
        panel: [["尺寸", ["container.width"]], ["背景", ["panel.bg"]], ["内边距", ["spacing"]], ["圆角", ["radius"]], ["边框", ["panel.bc", "panel.border"]], ["阴影", ["shadow"]]],
        layout: [["内容密度", ["density"]], ["模块间距", ["module.gap"]], ["选项排列", ["options.layout"]]],
        text: [["标题", ["title.size", "title.weight", "title.color"]], ["标题描述", ["desc.size", "desc.color"]], ["选项名称", ["option.name.size", "option.name.weight", "option.name.color"]], ["选项描述", ["desc.show", "option.desc.size", "option.desc.color"]]],
        option: [["容器", ["height", "opt.radius", "opt.padding.x"]], [PICK_CTRL, ["radio.show", "radio.size", "radio.color"]], ["间距", ["opt.gap", "card.gap"]], ["状态 · 默认", ["opt.bg", "opt.bc"]], ["状态 · 选中", ["color.primary", "sel_style", "state.selected.bg", "state.selected.bc"]]],
        tag: [["文字", ["tag.text"]], ["背景", ["tag.bg"]], ["圆角", ["tag.radius"]], ["间距", ["tag.gap"]], ["预设样式", ["rec_chip", "tag.style"]]],
        button: [["高度", ["btn.height"]], ["底色", ["btn.bg"]], ["文字颜色", ["btn.fg"]], ["圆角", ["btn.radius"]]],
      };
    const subgroupOf = (zone, key) => {
      const hit = (subgroupMaps[zone] || []).find(([, keys]) => keys.includes(key));
      return hit ? hit[0] : "其他";
    };
    // 子分组已经表达了语义，卡片内只写具体属性，避免出现“圆角 → 圆角”一类重复名称。
    const selectorPropLabels = LAY ? { ...L_COMMON, ...(LAY.labels || {}) } : {
      "container.width": "最大宽度", "panel.bg": "背景色", "spacing": "四周留白", "radius": "圆角",
      "panel.bc": "边框颜色", "panel.border": "边框", "shadow": "阴影",
      "layout.direction": "内容方向", "layout.align": "内容位置", "density": "内容密度",
      "display": "展现形式", "module.gap": "模块间距", "options.layout": "选项排列",
      "title.size": "标题字号", "title.weight": "标题字重", "title.color": "标题颜色",
      "desc.size": "描述字号", "desc.color": "描述颜色", "option.name.size": "选项名称字号",
      "option.name.weight": "选项名称字重", "option.name.color": "选项名称颜色",
      "option.desc.size": "选项描述字号", "option.desc.color": "选项描述颜色", "desc.show": "卡片说明文字",
      "height": "选项最小高度", "opt.radius": "选项圆角",
      "opt.padding.x": "选项水平留白", "radio.show": PICK_CTRL, "radio.size": PICK_CTRL + " 尺寸",
      "radio.color": PICK_CTRL + " 颜色", "opt.gap": "选项间距",
      "card.gap": effectiveDisplay === "inline" ? "胶囊间距" : "卡片间距",
      "opt.bg": "默认背景色", "opt.bc": "默认边框色",
      "color.primary": "选中主色", "sel_style": "选中态样式",
      "state.selected.bg": "选中背景色", "state.selected.bc": "选中边框色",
      "tag.text": "标签文字颜色", "tag.bg": "标签背景色", "tag.radius": "标签圆角", "tag.gap": "标签间距",
      "rec_chip": "推荐标签", "tag.style": "标签风格",
      "btn.height": "按钮高度", "btn.bg": "按钮底色", "btn.fg": "按钮文字颜色", "btn.radius": "按钮圆角",
    };
    // 当同一模块下有多个属性时，模块名由子标题统一表达，属性只保留“显示 / 尺寸 / 颜色”等短名称。
    const selectorGroupedLabels = LAY ? { ...S_COMMON, ...(LAY.short || {}) } : {
      "height": "最小高度", "opt.radius": "圆角", "opt.padding.x": "水平留白",
      "radio.show": "显示", "radio.size": "尺寸", "radio.color": "颜色",
      "opt.gap": "选项间距", "card.gap": effectiveDisplay === "inline" ? "胶囊间距" : "卡片间距",
      "opt.bg": "背景色", "opt.bc": "边框色", "color.primary": "主色",
      "sel_style": "呈现方式",
      "state.selected.bg": "背景色", "state.selected.bc": "边框色",
      "title.size": "字号", "title.weight": "字重", "title.color": "颜色",
      "desc.size": "字号", "desc.color": "颜色", "option.name.size": "字号", "option.name.weight": "字重",
      "option.name.color": "颜色", "option.desc.size": "字号", "option.desc.color": "颜色",
      "desc.show": "显示",
      "rec_chip": "显示", "tag.style": "风格",
      "btn.height": "高度", "btn.bg": "底色", "btn.fg": "文字颜色", "btn.radius": "圆角",
    };
    const setSelectorPropLabel = (node, key, grouped = false) => {
      const text = (grouped && selectorGroupedLabels[key]) || selectorPropLabels[key];
      if (!text) return;
      if (node.classList && node.classList.contains("sty-bool")) {
        const children = [...node.childNodes];
        const valueLabel = children.find(x => x.nodeType === 1 && x.tagName === "SPAN" && !x.classList.contains("bool-demo"));
        if (valueLabel) valueLabel.textContent = "显示";
        const control = el("span", { class: "sty-bool-control" });
        children.forEach(child => control.appendChild(child));
        // “Radio / Checkbox”分组标题已表达对象本身；其他布尔项仍需保留属性名，避免只剩孤立的“显示”。
        if (!(grouped && key === "radio.show")) node.appendChild(el("span", { class: "sty-label sty-bool-name" }, [text]));
        node.appendChild(control);
        return;
      }
      const label = node.querySelector && node.querySelector(".sty-label");
      if (!label) return;
      const textNode = [...label.childNodes].find(x => x.nodeType === 3);
      if (textNode) textNode.nodeValue = text;
    };
    (USE_LAY ? selectorMeta : ZONE_META).forEach(([z, title0, desc0]) => {
      const items = ZBUF[z];
      if (!items || !items.length) return;
      const [title, desc] = zoneTitle(z, title0, desc0);
      if (!USE_LAY) {
        box.appendChild(groupHead(title, desc));
        items.forEach(n => box.appendChild(n));
      } else {
        const section = el("section", { class: "selector-style-section", "aria-label": title });
        section.appendChild(groupHead(title, desc));
        const buckets = new Map();
        items.forEach(n => {
          const key = n.getAttribute && n.getAttribute("data-sty-key") || "";
          const sg = subgroupOf(z, key);
          if (!buckets.has(sg)) buckets.set(sg, []);
          buckets.get(sg).push(n);
        });
        const subgroupOrder = [...(subgroupMaps[z] || []).map(([name]) => name), "其他"];
        subgroupOrder.forEach(sg => {
          const nodes = buckets.get(sg);
          if (!nodes || !nodes.length) return;
          const grouped = nodes.length > 1;
          if (grouped) section.appendChild(el("div", { class: "sty-subgroup" }, [sg]));
          nodes.forEach(n => {
            const key = n.getAttribute && n.getAttribute("data-sty-key") || "";
            setSelectorPropLabel(n, key, grouped);
            section.appendChild(el("div", { class: "sty-prop-card" }, [n]));
          });
        });
        box.appendChild(section);
      }
    });

    // —— 折叠分组：配置项多时也好配——每组可收起，默认只展开高频组 ——
    (function accordionize() {
      // 选择器采用连续的单列属性流：所有区域直接向下展开，不再使用 Tab / 手风琴式切换。
      if (IS_SELECTOR) return;
      // 改一个配置会重绘整个面板：用户手动展开/收起过哪些区要记住，不能每次弹回默认
      state.styOpen = state.styOpen || null;
      const DEFAULT_OPEN = new Set(["整体面板", "选项与控件", "条目与标记"]);
      const OPEN = state.styOpen ? new Set(state.styOpen) : DEFAULT_OPEN;
      const kids = [...box.children];
      const out = [];
      let cur = null;
      kids.forEach(k => {
        const isHead = k.classList && k.classList.contains("sty-group");
        const isStop = k.classList && k.classList.contains("sty-acc-stop");
        if (isHead) {
          const title = (k.querySelector("span") || {}).textContent || "";
          cur = el("details", { class: "sty-acc", ...(OPEN.has(title) ? { open: "" } : {}) });
          cur.addEventListener("toggle", (ev) => {
            const now = new Set([...box.querySelectorAll("details.sty-acc")]
              .filter(d => d.open)
              .map(d => (d.querySelector("summary .sty-group span") || {}).textContent || ""));
            state.styOpen = [...now];
          });
          k.classList.add("in-acc");
          cur.appendChild(el("summary", {}, [k]));
          out.push(cur);
        } else if (isStop) { cur = null; out.push(k); }
        else if (cur) cur.appendChild(k);
        else out.push(k);
      });
      // 每组补「N 项」计数，收起时也知道里面有什么体量
      out.forEach(d => {
        if (!d.classList || !d.classList.contains("sty-acc")) return;
        const n = d.querySelectorAll(":scope > .sty-section, :scope > .field, :scope > .sty-bool, "
          + ":scope > details .sty-section, :scope > details .field, :scope > details .sty-bool").length;
        const head = d.querySelector("summary .sty-group");
        if (head && n) head.appendChild(el("span", { class: "sty-acc-n num" }, [String(n) + " 项"]));
      });
      box.innerHTML = "";
      out.forEach(n2 => box.appendChild(n2));
    })();





    return box;
  }

  // ---------- 第 5 步：数据（接入契约，只读） ----------
  function stepSchema() {
    const box = el("div", {});
    const ct = state.component_type;
    const fixed = state.contentMode === "fixed";
    box.appendChild(el("div", { class: "sty-inherit" }, [
      UI.icon("palette", 14),
      el("span", {}, ["这是本组件与 agent 之间的数据契约：模型按 params_schema 传参，用户提交后按 submit_schema 回传。开发接入时看这里，日常配置不用改。"]),
    ]));
    // 字段表：把 JSON Schema 翻成「字段 / 类型 / 必填 / 说明」的表，开发与运营都能读
    const fieldTable = (schema) => {
      const props = (schema || {}).properties || {};
      const req = new Set((schema || {}).required || []);
      const keys = Object.keys(props);
      if (!keys.length) return el("div", { class: "muted", style: "padding:10px 2px" }, ["该组件无需模型传参"]);
      return el("table", { class: "data schema-table" }, [
        el("thead", {}, [el("tr", {}, ["字段", "类型", "必填", "说明"].map(h => el("th", {}, [h])))]),
        el("tbody", {}, keys.map(k => {
          const d = props[k] || {};
          const t = d.type === "array" ? `数组（${(d.items || {}).type || "对象"}）` : d.type || "-";
          const lim = [d.minItems != null ? `至少 ${d.minItems}` : "", d.maxItems != null ? `最多 ${d.maxItems}` : ""].filter(Boolean).join(" · ");
          return el("tr", {}, [
            el("td", {}, [el("code", { class: "schema-key" }, [k])]),
            el("td", { class: "muted" }, [t]),
            el("td", {}, [req.has(k) ? el("span", { class: "chip blue" }, ["必填"]) : el("span", { class: "muted" }, ["可选"])]),
            el("td", { class: "muted" }, [(d.description || "") + (lim ? `（${lim}）` : "")]),
          ]);
        })),
      ]);
    };
    // 这一步就是两段 JSON：入参一段、回传一段，直接摊开给开发看
    const pre = (obj) => el("pre", { class: "code num schema-code" }, [JSON.stringify(obj, null, 2)]);
    // 字段说明收进折叠：需要逐字段读含义时再展开，不占主位
    const fieldsFold = (node) => el("details", { class: "schema-raw" }, [
      el("summary", {}, ["字段说明"]), node,
    ]);
    const sec = (title, hint, node, copyObj) => el("div", { class: "schema-card" }, [
      el("div", { class: "schema-head" }, [
        el("code", { class: "schema-name" }, [title]),
        hint ? el("span", { class: "schema-hint" }, [hint]) : null,
        el("span", { style: "flex:1" }),
        copyObj !== undefined ? el("button", { class: "btn small", type: "button", onclick: () => {
          navigator.clipboard.writeText(JSON.stringify(copyObj, null, 2)); UI.toast("已复制" + title);
        } }, [UI.icon("copy", 13), "复制"]) : null]),
      node]);
    const host = el("div", {}, [el("div", { class: "muted" }, ["加载中……"])]);
    box.appendChild(host);
    (async () => {
      try {
        const schemaConfig = { display: selectorDisplayOf(ct) || state.display || undefined,
          content_mode: state.contentMode || "dynamic" };
        if (["select.single", "select.multi", "select.card"].includes(ct)) {
          schemaConfig.multi = state.multiSelect === undefined ? ct === "select.multi" : !!state.multiSelect;
          if (schemaConfig.multi) {
            schemaConfig.min_select = Number(state.minSelect) > 0 ? Number(state.minSelect) : 1;
            if (Number(state.maxSelect) > 0) schemaConfig.max_select = Number(state.maxSelect);
          }
          if (schemaConfig.content_mode === "fixed") {
            schemaConfig.options = (state.fixedOptions || []).map(x => String(x || "").trim()).filter(Boolean);
            const optionMeta = {};
            (state.fixedOptionRows || []).forEach(row => {
              const name = String(row?.text || "").trim();
              if (!name) return;
              const meta = {};
              if (String(row?.desc || "").trim()) meta.desc = String(row.desc).trim();
              if (String(row?.image || "").trim()) meta.image = String(row.image).trim();
              const tags = String(row?.tags || "").split(/[，,、]/).map(x => x.trim()).filter(Boolean);
              if (tags.length) meta.tags = tags;
              if (Object.keys(meta).length) optionMeta[name] = meta;
            });
            if (Object.keys(optionMeta).length) schemaConfig.option_meta = optionMeta;
          }
        }
        const r = await UI.api("/api/components/schema-preview", { method: "POST",
          body: { component_type: ct, config: schemaConfig,
            text_templates: { prompt: (state.fixedPrompt || "").trim(), submit: (state.submitLabel || "").trim() } } });
        host.innerHTML = "";
        host.appendChild(sec("params_schema", "模型调用本组件时要填的参数",
          el("div", {}, [pre(r.params_schema || {}), fieldsFold(fieldTable(r.params_schema))]), r.params_schema || {}));
        if (r.submit_schema && Object.keys(r.submit_schema).length) {
          host.appendChild(sec("submit_schema", "用户提交后回传给 agent 的结构",
            el("div", {}, [
              pre(r.submit_schema),
              fieldsFold(r.submit_schema.properties ? fieldTable(r.submit_schema) : el("table", { class: "data schema-table" }, [
                el("thead", {}, [el("tr", {}, ["字段", "内容"].map(h => el("th", {}, [h])))]),
                el("tbody", {}, Object.entries(r.submit_schema).map(([k, v]) => el("tr", {}, [
                  el("td", {}, [el("code", { class: "schema-key" }, [k])]),
                  el("td", { class: "muted" }, [String(v)]),
                ]))),
              ])),
            ]), r.submit_schema));
        } else {
          host.appendChild(sec("submit_schema", null,
            el("div", { class: "muted", style: "padding:10px 2px" }, ["展示类组件没有提交，不产生回传数据"])));
        }
      } catch (e) {
        host.innerHTML = "";
        host.appendChild(el("div", { class: "field-error" }, ["加载失败：" + e.message]));
      }
    })();
    return box;
  }

  // ---------- 第 3 步：配置组件 ----------
  // 选项行：文案 + 跳转链接（选填）；卡片选择器另配标题 / 文案 / 配图

        el("label", { class: "field", style: "margin-bottom:0" }, [
          el("span", { class: "label-text" }, ["选中「" + (r.text || `选项 ${i + 1}`) + "」后的 AI 跟进 prompt"]), promptIn]),
      ]);
    }
    function draw() {
      wrap.innerHTML = "";
      if (state.component_type === "suggest.followup" && state.optionRows.length) {
        const isSugHead = true;
        wrap.appendChild(el("div", { class: "opt-head" + (isSugHead ? " sug" : "") }, [
          el("span", {}, [isSugHead ? "引导文案" : "选项文案"]),
          el("span", {}, [isSugHead ? "去向" : "跳转链接（选填）"]),
          el("span", {}, [isSugHead ? "去向参数" : ""]), el("span", {}, [""]),
        ]));
      }
      state.optionRows.forEach((r, i) => {
        const textIn = el("input", { type: "text", value: r.text, placeholder: isCard ? `卡片标题 ${i + 1}（12 字内）` : isCommerce ? `商品名称 ${i + 1}` : isEntry ? `入口名称 ${i + 1}` : `选项 ${i + 1}`,

        textIn.oninput = () => { r.text = textIn.value; autosave(); };
        textIn.onchange = () => rebuild(); // 更新推荐默认项下拉
        const isSug = state.component_type === "suggest.followup";
        const apiIn = el("input", { type: "url", value: r.api || "", placeholder: "https://…", "aria-label": "跳转链接" });
        apiIn.oninput = () => { r.api = apiIn.value; autosave(); };
        // 追问引导器：去向显式可配（追问 / AI 跟进 / 跳转链接）
        if (isSug && !r._mode) r._mode = (r.api || "").trim() ? "link" : (r.prompt || "").trim() ? "prompt" : "ask";
        const aiBtn = !withAct ? null : el("button", { type: "button", class: "btn small ghost ghost-ai" + (r.prompt ? " on" : ""),
          title: "配置用户选中此项后 AI 的跟进话术（选填）",
          onclick: () => { r._open = !r._open; draw(); } }, [r.prompt ? "已配 AI 跟进" : "AI 跟进"]);
        const delBtn = UI.iconBtn("x", "删除此选项", () => { state.optionRows.splice(i, 1); autosave(); rebuild(); });

  const stepBar = el("div", { class: "ed-steps" });

  const foot = el("div", { class: "modal-foot", style: "display:flex;gap:8px;align-items:center" });

  function drawStepBar() {
    stepBar.innerHTML = "";
    const list = steps();
    const idx = list.findIndex(s => s.key === step);
    list.forEach((s, i) => {
      if (i) stepBar.appendChild(el("span", { class: "sep" }, [UI.icon("arrow", 12)]));
      // 步骤条可点跳转；新建时需先完成组件名称与容器选择
      const clickable = s.key === "pick" || (!!state.component_type && (!isNew || !!state.name.trim()));
      stepBar.appendChild(el("span", {
        class: "st" + (s.key === step ? " active" : i < idx ? " done" : "") + (clickable ? " click" : ""),
        ...(clickable ? { onclick: () => gotoStep(s.key) } : {}),
      }, [s.label]));
    });
    stepBar.appendChild(el("span", { class: "meta" }, [
      isNew && !savedCard ? null : el("span", { class: "num" }, [`配置 ${shortId(clientCardId)}`]),
      card && card.status === "offline" ? el("span", { class: "chip coral" }, ["已下线"]) : null,
    ]));

  function gotoStep(next) {
    // 自由跳转；离开新建第 1 步前必须填好名称并选好容器。
    if (isNew && step === "pick" && next !== "pick" && !state.name.trim()) {
      showFieldErrors([{ field: "name", message: "请填写组件名称" }]);
      UI.toast("请先填写组件名称", true);
      return;
    }
    if (next !== "pick" && !state.component_type) {
      UI.toast("请先选择一个容器", true);
      return;
    }
    step = next;
    autosave();
    rebuild(true);
  }

  function updateFoot() {
    const nextBtnEl = foot.querySelector("[data-next]");
    if (nextBtnEl && step === "pick") nextBtnEl.disabled = !state.component_type || !state.name.trim();
  }

  const V2_CT_SET = new Set([...V2_TEMPLATES.map(t => t.component_type), "select.multi", "select.card", "chart.bar"]);

    foot.innerHTML = "";
    if (legacyType) {
      foot.appendChild(el("div", { class: "muted", style: "color:var(--danger)" },
        ["该组件类型已下线，仅可查看历史数据，不能修改保存"]));

      foot.appendChild(el("button", { class: "btn", onclick: () => closeEditor() }, ["关闭"]));

    // 0913Mia调整：将交互 Tab 串入前后步骤
    const nextTo = { pick: ["content", "下一步"], content: ["interaction", "下一步"], interaction: ["style", "下一步"], style: ["schema", "下一步"] };
    const backTo = { content: isNew ? "pick" : null, interaction: "content", style: "interaction", schema: "style" };

    if (backTo[step]) foot.appendChild(el("button", { class: "btn", onclick: () => gotoStep(backTo[step]) }, ["上一步"]));
    foot.appendChild(errorsBox);
    foot.appendChild(spacer);
    // 0913Mia调整：交互 Tab 与其他配置 Tab 一样支持直接保存草稿
    if (["content", "interaction", "style", "schema"].includes(step)) {
      // 存完就回工作台：留在原地会让人以为没保存成功
      foot.appendChild(el("button", { class: "btn", onclick: (e) => save(false, e.currentTarget, true) }, ["保存草稿"]));

      const [to, label] = nextTo[step];
      const b = el("button", { class: "btn primary", "data-next": "1", onclick: () => gotoStep(to) }, [label]);

  const previewWidthKey = "sia.editor.previewWidth";
  const resizeHandle = el("div", { class: "ed-resizer", role: "separator", tabindex: "0",
    "aria-label": "调整右侧预览面板宽度", "aria-orientation": "vertical",
    title: "拖动调整右侧预览面板宽度；也可使用左右方向键" });
  const clampPreviewWidth = (split, width) => {
    const available = split.getBoundingClientRect().width;
    return Math.round(Math.max(320, Math.min(680, available - 370, width)));
  };
  const setPreviewWidth = (split, width, persist = false) => {
    const next = clampPreviewWidth(split, width);
    split.style.setProperty("--ed-preview-width", next + "px");

    resizeHandle.setAttribute("aria-valuemax", String(clampPreviewWidth(split, 680)));
    resizeHandle.setAttribute("aria-valuenow", String(next));

    resizeHandle.setPointerCapture(e.pointerId);
    resizeHandle.classList.add("dragging");
    document.body.classList.add("ed-resizing");
    const move = (ev) => setPreviewWidth(split, split.getBoundingClientRect().right - ev.clientX);
    const finish = (ev) => {
      move(ev);
      localStorage.setItem(previewWidthKey, resizeHandle.getAttribute("aria-valuenow"));
      resizeHandle.classList.remove("dragging");
      document.body.classList.remove("ed-resizing");
      resizeHandle.onpointermove = null;
      resizeHandle.onpointerup = null;
      resizeHandle.onpointercancel = null;
    };
    resizeHandle.onpointermove = move;
    resizeHandle.onpointerup = finish;
    resizeHandle.onpointercancel = finish;
  };

    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;

          (() => {

            return el("span", { class: "pv-title", style: "font-weight:600" }, [nm]);
          })(), UI.help("用户在对话中看到的效果，与线上同一套渲染器；预览中提交不产生数据"),
          (() => {
            // 回显按钮放在标题这一侧：它是条件显示的，摆在右边会把明暗切换和重置挤得左右乱跳
            const b = el("button", { class: "btn small ghost", type: "button", hidden: !state.echo_results,
              title: "看看用户提交后，大家的选择分布长什么样",
              onclick: () => {
                window.__pvEchoOn = !window.__pvEchoOn;
                b.textContent = window.__pvEchoOn ? "看提交前" : "看回显效果";
                renderPreview();
              } }, ["看回显效果"]);
            window.__pvEchoBtn = b;
            return b;
          })(),
          el("div", { style: "flex:1" }),
          (() => {
            // 明暗切换：主题有深色一套时才给。
            // 注意不能在这里直接判断就 return null——Brand 是异步加载的，

            const seg = el("div", { class: "segmented pv-mode" });

            setTimeout(syncSegVisible, 300);
            setTimeout(syncSegVisible, 1500);

            if (window.__pvDark) setTimeout(() => applyPreviewDark(previewBox, true), 0);
            [["light", "浅色模式"], ["dark", "深色模式"]].forEach(([k, nm]) => {
              const on = (k === "dark") === !!window.__pvDark;
              seg.appendChild(el("button", { type: "button", class: "seg" + (on ? " active" : ""),
                title: k === "dark" ? "看组件在深色模式下的样子" : "看组件在浅色模式下的样子",
                onclick: () => {
                  window.__pvDark = k === "dark";
                  [...seg.children].forEach((b2, i) => b2.classList.toggle("active", (i === 1) === !!window.__pvDark));
                  applyPreviewDark(previewBox, window.__pvDark);

          })(),
          (() => {
            // 恢复主题默认：作用对象就是这张示例卡，所以放在预览卡头部对齐（仅样式步显示）
            window.__pvResetBtn = el("button", { class: "btn small ghost", type: "button", style: "color:var(--primary)",
              title: "清除本实例的全部样式覆盖，回到产品主题默认", onclick: () => {
                Object.keys(state.styleOv).forEach(k => delete state.styleOv[k]);
                state.display = selectorDisplayOf(state.component_type) || ""; autosave(); rebuild();
              } }, ["重置"]);
            return window.__pvResetBtn;
          })(),
