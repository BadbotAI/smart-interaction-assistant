<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%231DA1F2'/%3E%3Crect x='10.5' y='3.6' width='9.6' height='7.3' rx='2.7' fill='none' stroke='%23fff' stroke-width='1.5' opacity='0.75'/%3E%3Cpath d='M3.4 12a3.7 3.7 0 0 1 3.7-3.7h6a3.7 3.7 0 0 1 3.7 3.7v2.3a3.7 3.7 0 0 1-3.7 3.7H9.5l-3.1 2.6c-.55.46-1.3.07-1.3-.64v-2.4A3.7 3.7 0 0 1 3.4 14.3z' fill='%23fff'/%3E%3Ccircle cx='7.4' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='10.25' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3Ccircle cx='13.1' cy='13.1' r='1.05' fill='%231DA1F2'/%3E%3C/svg%3E">
<title>组件工作台 · 智能交互平台</title>
<link rel="stylesheet" href="/web/shared.css">
<style>
  .card-row .name { font-weight: 600; font-size: var(--font-title); }
  .card-row .cr-line1 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .card-row .cr-line2 { margin-top: 5px; color: var(--text-secondary); font-size: var(--font-base);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 640px; }
  .card-row .cr-line3 { display: flex; gap: 0; align-items: baseline; flex-wrap: wrap; margin-top: 5px; font-size: var(--font-caption); font-variant-numeric: tabular-nums; }
  .card-row .cr-line3 > span + span::before { content: "·"; margin: 0 8px; color: var(--border-strong); }
  .card-row .cr-actions { display: flex; align-items: center; gap: 4px; align-self: flex-start; margin-top: -2px; }
  .card-row .cr-actions .sep-v { width: 1px; height: 16px; background: var(--border); margin: 0 8px; flex: none; }
  .card-row .cr-act-row { display: flex; gap: 6px; align-items: center; }
  .card-row .cr-act-row .toggle-label { font-size: var(--font-small); }
  .card-row .cr-act-row .btn.small { font-size: var(--font-small); }
  .card-row .main { flex: 1; min-width: 0; }
  .card-row .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 7px; }
  .card-row .actions { display: flex; gap: 6px; align-items: center; flex: none; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr 48px 32px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .field-row input[type=text] { padding: 5px 8px; font-size: var(--font-small); }
  .field-row .muted { font-size: var(--font-caption); }
  .preview-pane { background: var(--bg-page); border-radius: var(--radius-card); padding: 12px; }
  .preview-pane .bubble-user { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .preview-pane .bubble-user span { background: var(--primary); color: #fff; padding: 6px 12px; border-radius: var(--radius-card); font-size: var(--font-small); max-width: 80%; }
</style>
</head>
<body>
<div class="page">
<div id="workbenchMain">
  <div class="page-head" style="display:flex;justify-content:space-between;align-items:center;gap:16px">
    <div style="display:flex;align-items:center;gap:6px">
      <div class="page-title">组件工作台</div>
          </div>
    <div style="display:flex;gap:8px">
      <button class="btn primary" id="newBtn" style="white-space:nowrap">新建组件</button>
    </div>
  </div>



  <div class="card" style="padding:0;margin-bottom:16px">
    <div id="prodCover"></div>
  </div>
  <!-- 与组件模板页同构：tab 与筛选直接放在页面背景上，卡片各自成卡 -->
  <div class="wb-toolbar">
    <div id="statusTabs"></div>
    <div style="flex:1"></div>
    <span class="muted" id="listCount" style="font-size:var(--font-caption)"></span>
    <div class="wb-search">
      <span class="wb-search-ico" aria-hidden="true"></span>
      <input type="text" id="searchInput" placeholder="搜索组件实例" aria-label="搜索组件实例">
      <button class="btn small" id="searchBtn" hidden>搜索</button>
    </div>
    <button class="btn small" id="batchToggle">批量操作</button>
  </div>
  <div id="cardList"></div>
</div>
<div id="editorHost" hidden></div>
</div>

<script src="/web/tokens.js"></script>
<script src="/web/ui.js"></script>
<script src="/web/components.js"></script>
<script src="/web/testchat.js"></script>
<script>
UI.nav("cards");
const { el } = UI;

const STATUS_CHIP = {
  draft: ["草稿", "gray"], published: ["已上线", "blue"],
  offline: ["已下线", "coral"], archived: ["历史版本", "gray"], deleted: ["已删除", "red"],
};
const FIELD_LABEL = { name: "组件名称", description: "组件说明", trigger_description: "触发条件描述", trigger_examples: "示例问法",
  component_type: "交互组件", "text_templates.prompt": "交互提问文案", "text_templates.reply": "信息内容",
  options: "交互选项", fields: "采集字段", webhook: "Webhook 地址" };
const SELECT_TYPES = ["select.single", "select.multi", "select.card", "matrix.compare+select"];
// 支持群体回显的组件：选项类 / 对比 / 商品下单 / 入口跳转（统计多少人点开）
const ECHO_TYPES = [...SELECT_TYPES, "commerce.order", "entry.link"];
const OPTION_TYPES = [...SELECT_TYPES, "rank.priority", "picker.location", "suggest.followup", "commerce.order", "entry.link"];
// 每种基础类型的显示样式（MECE：本质定类型，展现做样式）
const LIKERT_PRESETS = [["1 ~ 5", 1, 5], ["0 ~ 5", 0, 5], ["0 ~ 3", 0, 3], ["1 ~ 10", 1, 10], ["0 ~ 10", 0, 10], ["-2 ~ +2", -2, 2]];

// ============ 列表（状态 tab + 数据概览合并） ============

// 示例时间统一用 ISO，时间线才能按所选格式（时分 / 日期 / 相对时间）渲染
function isoAgo(hours) { return new Date(Date.now() - hours * 3600e3).toISOString(); }

// 工作台卡片预览的示例参数：套用实例的样式覆盖与固定内容后渲染成真实缩略预览
const WB_DEMO = {
  "select.single": { prompt: "请选择处理方式", options: ["方案 A · 时效优先", "方案 B · 成本优先"], submit_label: "确认" },
  "select.multi": { prompt: "请勾选适用项", options: ["需要发票", "需要保价"], multi: true, submit_label: "提交" },
  "select.card": { prompt: "请选择方案", options: ["海运直达", "海铁联运"], submit_label: "确认",
    option_meta: { "海运直达": { desc: "35 天 · 成本低" }, "海铁联运": { desc: "26 天 · 快 9 天" } } },
  "form.structured": { prompt: "请补充以下信息", fields: [{ key: "n", label: "联系人", required: true }, { key: "p", label: "联系方式", required: true }], submit_label: "提交" },
  "control.confirm": { prompt: "确认取消本次订单？该操作不可撤销。", submit_label: "确认执行" },
  "feedback.binary": { prompt: "这条回答怎么样" },
  "feedback.preference": { candidates: [{ label: "方案 A", content: "优先保证时效，成本上浮约 8%。" }, { label: "方案 B", content: "优先控制成本，预计多用 2 天。" }] },
  "slider.range": { prompt: "本次预算大约多少？", min: 0, max: 5000, step: 100, unit: "元", default: 2000, submit_label: "确认" },
  "scale.likert": { prompt: "请为本次服务打分", scale: 5, low_label: "很不满意", high_label: "非常满意", submit_label: "提交" },
  "picker.datetime": { prompt: "希望什么时间上门取件？", submit_label: "确认" },
  "rank.priority": { prompt: "请按重要程度排序", items: ["运费成本", "送达时效", "服务质量"], submit_label: "提交" },
  "table": { title: "分区域概览", columns: ["区域", "数量", "环比"], rows: [["华东", "352", "2.3%"], ["华南", "332", "1.5%"]] },
  "chart.line": { title: "近半年走势", categories: ["4月", "5月", "6月", "7月", "8月", "9月"], series: [{ name: "金额", values: [122, 165, 148, 161, 178, 190] }] },
  "chart.bar": { title: "分区域对比", categories: ["华东", "华南", "华北"], series: [{ name: "数量", values: [352, 332, 372] }] },
  "chart.pie": { title: "构成占比", slices: [{ label: "华东", value: 42 }, { label: "华南", value: 27 }, { label: "其他", value: 31 }] },
  "chart.waterfall": { title: "利润构成", categories: ["营收", "运费", "仓储", "退款"], values: [420, -86, -54, -32] },
  "metric.card": { label: "本月累计金额", value: "1,286", unit: "万元", delta: "4.2%" },
  "timeline": { title: "处理进度", events: [
    { ts: isoAgo(50), title: "已受理" }, { ts: isoAgo(26), title: "处理中" }, { ts: isoAgo(2), title: "已完成" }] },
  "steps": { title: "操作指引", steps: ["填写信息", "上传凭证", "等待审核"], current_index: 1 },
  "matrix.compare": { title: "方案对比", options: ["方案 A", "方案 B"], dimensions: ["时效", "成本"], values: [[8, 6], [6, 9]] },
  "list.ordered": { title: "注意事项", items: ["保留原包装以便验收", "签收前拍照留证"] },
  "text.emphasis": { value: "本月履约率 98.6%，创近半年新高", tone: "positive" },
};
function tileEnv(c) {
  const cfg = (c.field_bindings || {}).config || {};
  const tt = c.text_templates || {};
  const params = { ...(WB_DEMO[c.component_type] || {}) };
  if (tt.prompt) params.prompt = tt.prompt;
  if (tt.submit) params.submit_label = tt.submit;
  if (tt.confirm) params.confirm_label = tt.confirm;
  if (tt.cancel) params.cancel_label = tt.cancel;
  if (cfg.content_mode === "fixed") {
    if ((cfg.options || []).length) {
      if (c.component_type === "rank.priority") params.items = cfg.options;
      else params.options = cfg.options;
    }
    if ((cfg.fields || []).length) params.fields = cfg.fields;
    if (cfg.recommended_default) params.recommended_default = cfg.recommended_default;
    if (cfg.present_params) Object.assign(params, cfg.present_params);
  }
  if (cfg.slider) {
    ["min", "max", "step", "unit", "default"].forEach(k => { if (cfg.slider[k] != null && cfg.slider[k] !== "") params[k] = cfg.slider[k]; });
  }
  if (cfg.likert) params.likert = cfg.likert;
  if (cfg.max_select) params.max_select = cfg.max_select;
  if (cfg.down_reasons) params.down_reasons = cfg.down_reasons;
  if (cfg.display === "card" || c.component_type === "select.card") params.display = "card";
  return { schema_version: "1.0.0", render_id: "wb-" + c.card_id, component_type: c.component_type,
    semantic_category: "present", trigger_source: "wb_preview", card_ref: null,
    params, style_overrides: c.style_overrides || {} };
}
let statusTab = "";
let wbCat = "all";
const WB_CATS = [
  ["all", "全部"],
  ["sel", "选择", ["select.single", "select.multi", "select.card", "feedback.preference", "rank.priority"]],
  ["form", "表单", ["form.structured", "picker.datetime", "slider.range", "scale.likert"]],
  ["cfm", "确认", ["control.confirm"]],
  ["fb", "反馈", ["feedback.binary"]],
  ["chart", "图表", ["chart.line", "chart.bar", "chart.pie", "chart.waterfall", "chart.area", "metric.card"]],
  ["tbl", "表格", ["table", "matrix.compare"]],
  ["flow", "流程", ["timeline", "steps"]],
  ["text", "文本", ["list.ordered", "text.emphasis"]],
];
let statsByCard = {};
const STATUS_TABS = [["", "全部"], ["published", "已上线"], ["offline", "已下线"], ["draft", "草稿箱"]];
function renderStatusTabs(counts = {}) {
  const bar = document.getElementById("statusTabs");
  bar.innerHTML = "";
  bar.className = "tab-bar";
  STATUS_TABS.forEach(([key, name]) => bar.appendChild(el("button", {
    class: "tab" + (key === statusTab ? " active" : ""),
    onclick: () => { if (key === statusTab) return; statusTab = key; loadCards(); },
  }, [name, counts[key] != null && key !== "" ? el("span", { class: "tab-count num" }, [String(counts[key])]) : null])));
}


function shortProductId2(pid) {
  const hex = String(pid).replace(/[^0-9a-f]/gi, "").slice(0, 8) || "0";
  return String(parseInt(hex, 16) % 1000000).padStart(6, "0");
}

function styleSummary(c) {
  const so = c.style_overrides || {};
  const parts = [];
  if (so["color.primary"]) parts.push("主色 " + so["color.primary"]);
  const isNum = (v) => Number.isFinite(Number(v));
  if (so.radius != null) parts.push(isNum(so.radius) ? `圆角${so.radius}px` : ({ none: "直角", sm: "小圆角", md: "标准圆角", lg: "大圆角", full: "全圆" }[so.radius] || so.radius));
  if (so.height != null) parts.push(isNum(so.height) ? `高度${so.height}px`
    : ({ compact: "紧凑高度", regular: "标准高度", large: "宽大高度" }[so.height] || ""));
  if (so.spacing != null) parts.push(isNum(so.spacing) ? `间距${so.spacing}px` : ({ compact: "紧凑", regular: "标准", loose: "宽松" }[so.spacing] || "") + "密度");
  if (so.shadow) parts.push("阴影" + ({ none: "无", sm: "轻", md: "中", lg: "重" }[so.shadow] || ""));
  if (so.font_scale != null) parts.push(Number(so.font_scale) >= 10 ? `字号${so.font_scale}px` : "字号" + ({ "-1": "小一档", "1": "大一档", "2": "大两档" }[so.font_scale] || ""));
  const disp = ((c.field_bindings || {}).config || {}).display;
  if (disp === "card") parts.push("卡片样式");
  const clean = parts.filter(Boolean);
  return clean.length ? clean.join(" · ") : "主题默认";
}

async function loadKpisAndTodos() {
  try {
    const [q, { cards: allCards }] = await Promise.all([
      UI.api("/api/dashboard/questions?days=30"), UI.api("/api/cards"),
    ]);
    statsByCard = {};
    q.questions.forEach(x => statsByCard[x.card_id] = x);
    // 与列表同口径：有生效快照即已上线
    const published = allCards.filter(c => c.status === "published" || (c.status === "draft" && c.version >= 1));
    const totalSubmitted = q.questions.reduce((s, x) => s + x.submitted, 0);
    const totalRendered = q.questions.reduce((s, x) => s + x.rendered, 0);
    const kpi = document.getElementById("kpiRow");
    if (!kpi) return;
    kpi.innerHTML = "";
    const tile = (label, value, help) => el("div", { class: "stat-tile" }, [
      el("div", { class: "stat-label" }, [label, help ? UI.help(help) : null]),
      el("div", { class: "stat-value" }, [String(value)]),
    ]);
    kpi.appendChild(tile("已上线配置", published.length));
    kpi.appendChild(tile("组件触发", totalRendered, "近 30 天组件被渲染到对话中的次数"));
    kpi.appendChild(tile("提交率", totalRendered && totalSubmitted <= totalRendered ? UI.fmtPct(totalSubmitted / totalRendered) : "-", "提交 / 触发，近 30 天"));
    const echoTile = tile("回显", `${published.filter(c => c.echo_results).length}/${published.length}`, "开启后用户提交时会看到群体选择分布；点击查看开启回显的配置列表");
    echoTile.style.cursor = "pointer";
    echoTile.onclick = () => {
      const list2 = published.filter(c => c.echo_results);
      UI.modal("开启回显的配置", el("div", {}, [
        list2.length ? el("div", {}, list2.map(c => el("div", { class: "echo-item", onclick: () => {
            document.querySelector(".modal-mask")?.remove();
            const rowEl = document.querySelector(`.card-row[data-cid="${c.card_id}"]`);
            if (rowEl) { rowEl.scrollIntoView({ behavior: "smooth", block: "center" }); rowEl.classList.add("card-flash"); setTimeout(() => rowEl.classList.remove("card-flash"), 2600); }
          } }, [
          el("span", { class: "cr-id num" }, ["ID:" + shortId(c.card_id)]),
          el("span", { style: "font-weight:600" }, [c.name]),
          UI.ctChip(c.component_type),
          el("span", { style: "flex:1" }),
          el("span", { class: "muted" }, ["点击定位"]),
        ])))
        : el("div", { class: "empty-state" }, [
            el("div", { class: "empty-title" }, ["还没有配置开启回显"]),
            el("div", {}, ["在配置的「数据收集」步打开群体回显后出现在这里"]),
          ]),
      ]));
    };
    kpi.appendChild(echoTile);
    // 异常态以标签形式标注在列表行上（loadCards 读 statsByCard 判定），此处刷新一次列表
    if (!window.__statsPainted) { window.__statsPainted = true; loadCards(); }
  } catch (e) { /* 概览失败不阻塞列表 */ }
}

// 配置异常判定：标注在列表行上（demo 口径）
function cardAnomalies(c, eff) {
  const out = [];
  const st = statsByCard[c.card_id];
  if (eff === "published" && st && st.rendered >= 10 && st.submitted <= st.rendered && st.submitted / st.rendered < 0.6)
    out.push({ label: "交互完成率低", title: `近 30 天完成率 ${Math.round(st.submitted / st.rendered * 100)}%，低于 60% 验收线，建议精简交互或检查触发场景` });
  if (c.component_type === "entry.link") {
    const acts = (((c.field_bindings || {}).config) || {}).option_actions || {};
    const bad = Object.entries(acts).filter(([, a]) => a && a.api && !/^https:\/\/\S+$/.test(String(a.api).trim()));
    if (bad.length) out.push({ label: "跳转异常", title: `${bad.length} 个入口的跳转链接不可用（需 https:// 完整地址）：${bad.map(([k]) => k).join("、")}` });
  }
  return out;
}

// 有生效快照就算已上线（编辑中的草稿不影响线上）
function effStatus(c) { return (c.status === "draft" && c.version >= 1) ? "published" : c.status; }

function shortId(cardId) {
  const hex = String(cardId).replace(/-/g, "").slice(0, 8);
  return String(parseInt(hex, 16) % 1000000).padStart(6, "0");
}

// 导航切换器（localStorage sia_product）优先；工作台内切换仍记 session
let curProduct = localStorage.getItem("sia_product") || sessionStorage.getItem("wb_product") || null;


function renderProductCover(products, brands, unboundCount) {
  const allCardsOf = () => {
    const p2 = products.find(x => x.product_id === curProduct);
    const ids = (p2 || {}).card_ids || [];
    const all = window.__allCards || [];
    const hit = all.filter(c => ids.includes(c.card_id));
    return hit.length ? hit : ids.map(id => ({ card_id: id, status: "published" }));
  };
  const box = document.getElementById("prodCover");
  box.innerHTML = "";
  if (!products.length) { box.hidden = true; return; }
  box.hidden = false;
  const opts = [...products.map(p => [p.product_id, p.name]), ["__unbound", `未绑定产品（${unboundCount}）`]];
  const isUnbound = curProduct === "__unbound";
  const p = products.find(x => x.product_id === curProduct);
  const pickProduct = (v) => { curProduct = v; sessionStorage.setItem("wb_product", v);
    if (v && v !== "__unbound") localStorage.setItem("sia_product", v); statusTab = ""; loadCards(); };
  // 产品名本身就是切换入口（点名字换产品），不再用一个语义不明的图标按钮
  const nameBtn = (label) => {
    const b = el("button", { class: "pc-name", type: "button", title: "点击切换产品",
      onclick: () => UI.menu(b, opts.map(([v, name]) => ({
        label: (v === curProduct ? "· " : "") + name,
        onClick: () => { if (v !== curProduct) pickProduct(v); } }))) },
      [el("span", {}, [label]), el("span", { class: "pc-caret" }, [UI.icon("chevron", 14)])]);
    return b;
  };
  if (isUnbound || !p) {
    box.appendChild(el("div", { class: "prod-cover unbound" }, [
      el("div", { class: "pc-id" }, ["·"]),
      el("div", { class: "pc-main" }, [
        nameBtn("未绑定产品"),
        el("div", { class: "pc-meta" }, ["这些组件还没归入任何产品，不会随任何产品的注册表下发"]),
      ]),
      el("a", { class: "btn small", href: "/web/products.html" }, ["管理产品"]),
    ]));
    return;
  }
  const brandSel = UI.fancySelect({ value: p.brand_file, width: "180px",
    options: brands.map(b => [b.file, b.brand_name || b.file]),
    onChange: async (v) => {
      try {
        await UI.api(`/api/products/${p.product_id}`, { method: "PUT", body: { brand_file: v } });
        UI.toast(`「${p.name}」已切换风格`);
        // 切风格后，产品卡自身（头像与强调色）与下方组件预览一起跟随新主题
        const c2 = await UI.brandColorOf(v);
        document.documentElement.style.setProperty("--ctx-p", c2.p);
        document.documentElement.style.setProperty("--ctx-a", c2.a);
        localStorage.setItem("brand_file", v);
        await Brand.load(v).catch(() => {});
        UI.emit("brands-changed", { file: v });
        loadCards();
      } catch (e) { UI.toast(e.data?.error || e.message, true); loadCards(); }
    } });
  const inProd = allCardsOf();
  const onlineN = inProd.filter(x => x.status === "published").length;
  box.appendChild(el("div", { class: "prod-cover" }, [

let _loadSeq = 0;
async function loadCards() {
  const seq = ++_loadSeq;
  if (!document.querySelector(".card-row")) UI.loading(document.getElementById("cardList"));
  const q = document.getElementById("searchInput").value.trim();
  const params = new URLSearchParams();
  if (q) params.set("q", q);
  const [{ cards: all }, prodRes, brandRes] = await Promise.all([
    UI.api("/api/cards?" + params),
    UI.api("/api/products").catch(() => ({ products: [] })),
    UI.api("/api/brands").catch(() => ({ brands: [] })),
  ]);
  window.__allCards = all;
  if (seq !== _loadSeq) return; // 已有更新的请求在途，丢弃过期响应
  const products = prodRes.products || [];
  const brands = brandRes.brands || [];
  // 产品封面：当前产品决定下方列表范围；「未绑定产品」是一个虚拟分组
  if (curProduct === null) curProduct = products.length ? products[0].product_id : "__unbound";
  if (curProduct !== "__unbound" && !products.find(p => p.product_id === curProduct)) {
    curProduct = products.length ? products[0].product_id : "__unbound";
  }
  const bound = new Set(products.flatMap(p => p.card_ids || []));
  const scoped = !products.length ? all
    : curProduct === "__unbound" ? all.filter(c => !bound.has(c.card_id))
    : all.filter(c => ((products.find(p => p.product_id === curProduct) || {}).card_ids || []).includes(c.card_id));
  // 组件预览始终跟随「当前正在看的产品」的风格主题（不是平台活跃主题）
  const curP = products.find(x => x.product_id === curProduct);
  if (curP && curP.brand_file && localStorage.getItem("brand_file") !== curP.brand_file) {
    localStorage.setItem("brand_file", curP.brand_file);
    Brand.load(curP.brand_file).then(() => {
      if (!window.__brandReloaded) { window.__brandReloaded = true; loadCards(); }
    }).catch(() => {});
  }
  renderProductCover(products, brands, all.filter(c => !bound.has(c.card_id)).length);
  const counts = { "": scoped.length };
  ["published", "offline", "draft"].forEach(k => counts[k] = scoped.filter(c => effStatus(c) === k).length);
  renderStatusTabs(counts);
  const cards = statusTab ? scoped.filter(c => effStatus(c) === statusTab) : scoped;
  const list = document.getElementById("cardList");
  list.innerHTML = "";
  // 搜索 / 筛选反馈：显示命中条数，让检索结果可感知
  document.getElementById("listCount").textContent = q ? `命中 ${cards.length} 条` : "";
  if (!cards.length) {
    if (q) {
      list.appendChild(el("div", { class: "empty-state" }, [
        el("div", { class: "empty-title" }, [`没有找到与「${q}」相关的组件实例`]),
        el("div", {}, ["换个关键词试试，或清空搜索查看全部。"]),
        el("button", { class: "btn", style: "margin-top:10px", onclick: () => {
          document.getElementById("searchInput").value = "";
          statusTab = "";
          loadCards();
        } }, ["清空搜索"]),
      ]));
    } else if (statusTab) {
      // 状态筛选下的真实空态：不是搜索问题，别引导用户改关键词
      const emptyCopy = {
        draft: ["暂无草稿", "编辑器里点「保存草稿」的实例会出现在这里"],
        published: ["暂无已上线的实例", "在编辑器里「保存并发布」后会出现在这里"],
        offline: ["暂无已下线的实例", "从「更多」菜单下线的实例会出现在这里"],
      }[statusTab] || ["该状态下暂无实例", ""];
      list.appendChild(el("div", { class: "empty-state" }, [
        el("div", { class: "empty-title" }, [emptyCopy[0]]),
        el("div", {}, [emptyCopy[1]]),
        el("button", { class: "btn primary", style: "margin-top:10px", onclick: () => newConfigWizard() }, ["新建组件"]),
      ]));
    } else {
      list.appendChild(el("div", { class: "empty-state" }, [
        el("div", { class: "empty-title" }, ["还没有交互配置"]),
        el("div", { style: "display:flex;gap:8px;justify-content:center;margin-top:10px" }, [
          el("button", { class: "btn primary", onclick: () => newConfigWizard() }, ["新建第一条配置"]),

        ]),
      ]));
    }
    return;
  }
  const cat = WB_CATS.find(x => x[0] === wbCat) || WB_CATS[0];
  const shown2 = wbCat === "all" ? cards : cards.filter(c => cat[2].includes(c.component_type));
  const nav = el("div", { class: "lib-cats", style: "top:190px" }, WB_CATS.map(([k, nm, types]) => {
    const n = k === "all" ? cards.length : cards.filter(c => types.includes(c.component_type)).length;
    if (k !== "all" && !n) return null;
    return el("button", { type: "button", class: "lib-cat" + (wbCat === k ? " on" : ""),
      onclick: () => { wbCat = k; loadCards(); } }, [nm,
      el("span", { class: "muted num", style: "font-size:11px" }, [String(n)])]);
  }));
  const gridBox = el("div", { class: "wb-grid" }, shown2.map(c => buildCardRow(c)));
  list.appendChild(el("div", { class: "lib-split" }, [nav, gridBox]));
}

// 单行构建：局部刷新用（状态开关切换后只替换该行，不重建整个列表）
// —— 批量操作：勾选集合 + 浮动操作条（上线 / 下线选中项） ——
const batchSel = new Set();
let batchMode = false;   // 默认关闭：复选框只在进入批量操作后出现
function setBatchMode(on) {
  batchMode = on;
  if (!on) { batchSel.clear(); batchBar(); }
  document.body.classList.toggle("batch-on", on);
  const b = document.getElementById("batchToggle");
  if (b) { b.textContent = on ? "退出批量" : "批量操作"; b.classList.toggle("primary", on); }
  loadCards();
}
function batchBar() {
  let bar = document.getElementById("batchBar");
  if (!bar) {
    bar = el("div", { id: "batchBar", class: "batch-bar", hidden: true });
    document.body.appendChild(bar);
  }
  bar.innerHTML = "";
  if (!batchSel.size) { bar.hidden = true; return; }
  bar.hidden = false;
  const run = async (action, label) => {
    const ids = [...batchSel];
    let ok = 0, fail = 0;
    for (const id of ids) {
      try { await UI.api(`/api/cards/${id}/transition`, { method: "POST", body: { action } }); ok++; }
      catch (e) { fail++; }
    }
    UI.toast(`${label}完成：成功 ${ok} 个${fail ? `，失败 ${fail} 个（状态不允许）` : ""}`, fail > 0);
    batchSel.clear(); batchBar(); loadCards();
  };
  bar.append(
    el("span", { style: "font-weight:600" }, [`已选 ${batchSel.size} 个`]),
    el("button", { class: "btn small ghost", onclick: () => {
      document.querySelectorAll(".wb-card .cr-check input").forEach(i => { if (!i.checked) i.click(); });
    } }, ["全选当前列表"]),
    el("button", { class: "btn small", onclick: () => run("publish", "批量上线") }, ["批量上线"]),
    el("button", { class: "btn small", onclick: () => run("offline", "批量下线") }, ["批量下线"]),
    el("button", { class: "btn small ghost", onclick: () => { setBatchMode(false); batchSel.clear(); batchBar();
      document.querySelectorAll(".cr-check input").forEach(i => i.checked = false); } }, ["取消选择"]),
  );
}

          })]));
        } catch (e) { pvBox.appendChild(el("div", { class: "muted" }, ["预览暂不可用"])); }
        return pvBox;
      })(),
      sm === "主题默认" ? null : el("div", { class: "wb-summary" }, ["样式：" + sm]),
      el("div", { class: "wb-foot" }, [
        el("span", { class: "muted", style: "font-size:var(--font-caption)" }, ["创建 " + UI.fmtTs(c.created_at)]),
        el("div", { style: "flex:1" }),
        el("button", { class: "btn small" + (editable ? "" : " dim"),
          onclick: () => { if (editable) openEditor(c.card_id); else UI.toast("已上线的配置不可编辑，请先下线", true); } }, ["编辑"]),
        moreButton(c, eff),
      ]),
    ]);
  }
}

function moreButton(c, eff) {
  // 统一菜单：复制 / 接入信息 / 删除。已上线实例不可直接删，给出「先下线」的明确路径
  const moreBtn = el("button", { class: "btn small", onclick: () => UI.menu(moreBtn, [
    { label: "复制为新实例", onClick: () => duplicateCard(c) },
    { label: "接入信息", onClick: () => showEmbedInfo(c, eff) },
    eff === "published"
      ? { label: "下线后删除", danger: true, onClick: async () => {
          const ok = await UI.confirm("下线并删除", `「${c.name}」正在线上。需要先下线才能删除，下线后 AI 将不再触发它。`,
            { okText: "下线并删除", danger: true });
          if (!ok) return;
          try {
            await UI.api(`/api/cards/${c.card_id}/transition`, { method: "POST", body: { action: "offline" } });
            await UI.api(`/api/cards/${c.card_id}/transition`, { method: "POST", body: { action: "delete" } });
            UI.toast("已下线并删除"); loadCards(); loadKpisAndTodos();
          } catch (e) { UI.toast(e.data?.error?.message || e.message, true); }
        } }
      : { label: c.version >= 1 ? "删除配置（含线上版本）" : "删除配置", danger: true, onClick: () => doTransition(c, "delete") },
  ]) }, ["更多"]);
  return moreBtn;
}

// 复制实例：克隆内容与样式，生成不重名的草稿
async function duplicateCard(c) {
  const base = (c.name.length > 12 ? c.name.slice(0, 12) : c.name) + " 副本";
  const taken = new Set((window.__allCards || []).map(x => x.name));
  let name = base, i = 2;
  while (taken.has(name)) name = base + " " + (i++);
  try {
    const r = await UI.api("/api/cards", { method: "POST", body: {
      name, component_type: c.component_type, description: c.description || "",
      model_invokable: true, style_overrides: c.style_overrides || {},
      field_bindings: c.field_bindings || { config: {} },
      text_templates: c.text_templates || {}, emit_targets: c.emit_targets || ["model", "dashboard"],
    } });
    UI.toast(`已复制为「${name}」（草稿）`);
    loadCards(); loadKpisAndTodos();
    if (r && r.card) openEditor(r.card.card_id);
  } catch (e) { UI.toast(e.data?.error?.message || e.message, true); }
}

async function doTransition(c, action, force = false, btn = null) {
  if (action === "offline" && !force) {
    const ok = await UI.confirm("下线配置", `「${c.name}」下线后 AI 不再触发，数据保留，可重新发布。`, { okText: "下线" });
    if (!ok) return;
  }
  if (action === "delete" && !force) {
    const ok = await UI.confirm("删除配置", `删除「${c.name}」？不可恢复，历史快照与数据保留用于审计。`, { okText: "删除", danger: true });
    if (!ok) return;
  }
  if (btn) btn.disabled = true;
  try {
    const resp = await UI.api(`/api/cards/${c.card_id}/transition`, { method: "POST", body: { action, force } });
    UI.toast({ publish: "已上线", offline: "已下线", delete: "已删除" }[action] || "完成");
    if (resp && resp.warning) setTimeout(() => UI.toast(resp.warning, true), 1200);
    loadCards(); loadKpisAndTodos();
  } catch (e) {
    const err = e.data?.error || {};
    if (err.code === "referenced") {
      const body = el("div", {}, [
        el("div", { class: "secondary" }, [err.message]),
        el("ul", { style: "padding-left:20px;margin:8px 0" },
          (err.refs || []).map(r => el("li", {}, [`${r.agent_id}（引用 v${r.version}）`]))),
        el("div", { style: "display:flex;gap:8px;margin-top:10px;justify-content:flex-end" }, [
          el("button", { class: "btn", onclick: () => mask.remove() }, ["取消"]),
          el("button", { class: "btn danger", onclick: () => { mask.remove(); doTransition(c, action, true); } },
            ["强制删除（运行时降级为纯文本）"]),
        ]),
      ]);
      const mask = UI.modal("配置被 Agent 引用", body);
    } else {
      UI.toast(err.message || e.message, true);
      if (err.errors) UI.modal("发布失败", el("div", {}, [
        el("div", { class: "secondary", style: "margin-bottom:8px" }, ["以下字段未通过校验，配置保持当前状态："]),
        ...err.errors.map(x => el("div", { class: "field-error" }, [`${FIELD_LABEL[x.field] || x.field}：${x.message}`])),
        el("button", { class: "btn primary", style: "margin-top:12px", onclick: () => { document.querySelector(".modal-mask")?.remove(); openEditor(c.card_id); } }, ["去修改"]),
      ]));
    }
  } finally { if (btn) btn.disabled = false; }
}

async function openEditor(cardId, prefill, initStep) {
  if (document.querySelector(".modal.editor")) return; // 防连点叠开多个编辑器
  if (!templateLibrary) templateLibrary = (await UI.api("/api/templates")).templates;
  let card = null;
  if (cardId) {
    try { card = (await UI.api(`/api/cards/${cardId}`)).card; }
    catch (e) { UI.toast("配置不存在或已删除", true); return; }
    if (card.status === "published" || (card.status === "draft" && card.version >= 1)) {
      UI.toast("已上线的配置不可编辑，请先在工作台下线", true);
      return;
    }
  }

  // 本地草稿静默恢复

  // ---------- 第 4 步：数据 Schema（接入契约，只读） ----------
  function stepSchema() {

    ]));

      const props = (schema || {}).properties || {};

        el("tbody", {}, keys.map(k => {
          const d = props[k] || {};
          const t = d.type === "array" ? `数组（${(d.items || {}).type || "对象"}）` : d.type || "-";
          const lim = [d.minItems != null ? `至少 ${d.minItems}` : "", d.maxItems != null ? `最多 ${d.maxItems}` : ""].filter(Boolean).join(" · ");
          return el("tr", {}, [
            el("td", {}, [el("code", { class: "schema-key" }, [k])]),

                el("div", { class: "muted", style: "margin-bottom:8px" }, ["按当前配置生成的示意；完整结构见组件详情的「提交回传结构」"]),
                el("pre", { class: "code num", style: "max-height:50vh;overflow:auto" }, [JSON.stringify(payload, null, 2)]),
              ]), null, { width: "480px" });
            } }, ["回传示例"]))(),
        ]),
        previewBox,
      ]),
    ]),
  ]);

  function collectPayload() {
    const question = state.question.trim();
    const options = getOptions();
    const dimensions = state.dimensions.split("\n").map(s => s.trim()).filter(Boolean);
    const fields = state.fieldRows.filter(f => f.key || f.label).map(f => ({
      key: (f.key || f.label).trim(), label: (f.label || f.key).trim(), type: "text", required: !!f.required }));
    const config = {};
    if (options.length) {
      config.options = options;
      // 选项位 id 与 options 对齐（发布时服务端据此识别「改名」并归并历史数据）
      config.option_ids = state.optionRows.filter(r => (r.text || "").trim()).map(r => r.id || "opt-" + Math.random().toString(36).slice(2, 8));
    }
    if (cfg.option_aliases) config.option_aliases = cfg.option_aliases; // 历史改名别名链透传
    const optionActions = {};
    state.optionRows.forEach(r => {
      const t = (r.text || "").trim();
      if (!t) return;
      const act = {};
      if ((r.prompt || "").trim()) act.prompt = r.prompt.trim();
      if ((r.api || "").trim()) act.api = r.api.trim();
      if (Object.keys(act).length) optionActions[t] = act;
    });
    if (Object.keys(optionActions).length) config.option_actions = optionActions;
    if (state.recommended_default.trim() && options.includes(state.recommended_default.trim())) config.recommended_default = state.recommended_default.trim();
    if (dimensions.length) config.dimensions = dimensions;
    if (state.component_type === "matrix.compare+select" && Array.isArray(state.matrixValues)) {
      const vals = options.map((o, i) => dimensions.map((d, j) => {
        const v = state.matrixValues[i]?.[j];
        return v == null || v === "" ? null : Number(v);
      }));
      if (vals.some(row => row.some(v => v != null))) config.values = vals;
    }
    if (state.display) config.display = state.display;
    if (state.component_type === "scale.likert")
      config.likert = { left: state.likert_left, right: state.likert_right, from: Number(state.likert_from), to: Number(state.likert_to) };
    const optionMeta = {};
    state.optionRows.forEach(r => {
      const t = (r.text || "").trim();
      if (!t) return;
      const m = { ...(r.desc?.trim() ? { desc: r.desc.trim() } : {}), ...(r.image?.trim() ? { image: r.image.trim() } : {}) };
      if (state.component_type === "commerce.order") {
        if (r.price !== "" && !isNaN(Number(r.price))) m.price = Number(r.price);
        if (r.price_original !== "" && !isNaN(Number(r.price_original))) m.price_original = Number(r.price_original);
        if (r.sales !== "" && !isNaN(Number(r.sales))) m.sales = Number(r.sales);
        const tg = (r.tags || "").split(/[，,]/).map(x => x.trim()).filter(Boolean);
        if (tg.length) m.tags = tg;
      }
      if (Object.keys(m).length) optionMeta[t] = m;
    });
    if (Object.keys(optionMeta).length) config.option_meta = optionMeta;
    if (fields.length) config.fields = fields;
    if (state.placeholder.trim()) config.placeholder = state.placeholder.trim();
    if (state.component_type === "slider.range")
      config.slider = { min: Number(state.slider_min) || 0, max: Number(state.slider_max) || 100, unit: state.slider_unit.trim() };
    if (state.webhook.trim()) config.webhook = state.webhook.trim();
    if (state.component_type === "guide.steps")
      config.steps = state.guideSteps.filter(st => st.title.trim() || st.body.trim())
        .map(st => ({ title: st.title.trim(), body: st.body.trim() }));
    const templates = { prompt: question || "请选择", submit: state.submit.trim() || "提交" };
    if (state.reply_text.trim()) templates.reply = state.reply_text.trim();
    if (state.component_type === "feedback.binary" && (state.fbDims || []).length)
      config.dimensions = state.fbDims.map((label, i) => ({ key: "dim_" + (i + 1), label }));
    return {
      card_id: clientCardId,
      name: state.name.trim(),
      description: state.description.trim().slice(0, 256),
      component_type: state.component_type,
      trigger_description: state.trigger_description.trim(),
      trigger_examples: state.trigger_examples.slice(0, 10),
      style_overrides: state.styleOv,
      model_invokable: true,
      echo_results: !!state.echo_results,
      option_source: { type: "static", values: options },
      field_bindings: { config, fields: config.fields || [] },
      text_templates: templates,
      emit_targets: ["model", "dashboard", "label_store"],
      label_polarity_map: { rule: "selection_accept", label_kind: "preference", confidence: 0.6 },
    };
  }

  function fieldKeyOf(err) {
    const alias = { "text_templates.prompt": "question", "text_templates.reply": "reply_text" };
    return alias[err.field] || err.field?.split(".")[0];
  }

  // v2.1 保存载荷：平台只管实例名 + 类型 + 样式（内容全参数化；编辑存量卡时不触碰其历史 config 其他键）
  function collectPayloadLite() {
    const cfg0 = card ? (((card.field_bindings || {}).config) || {}) : {};
    const config = { ...cfg0 };
    if (state.display) config.display = state.display; else delete config.display;
    config.content_mode = state.contentMode || "dynamic";
    delete config.options;
    delete config.fields;
    delete config.recommended_default;
    delete config.present_params;
    const IS_P = PRESENT_TYPES.includes(state.component_type);
    if (IS_P && config.content_mode === "fixed" && state.presentParams) {
      config.present_params = JSON.parse(JSON.stringify(state.presentParams));
    }
    if (!IS_P && config.content_mode === "fixed") {
      if (state.fixedRec && (state.fixedOptions || []).includes(state.fixedRec))
        config.recommended_default = state.fixedRec;
      if (state.component_type === "form.structured") {
        config.fields = (state.fixedFields || "").split("\n").map(l => l.trim()).filter(Boolean).map(l => {
          const [k, lb, rq, tp, ph] = l.split("|").map(x => (x || "").trim());
          const f = { key: k, label: lb || k, type: tp === "number" ? "number" : "text", required: rq === "必填" || rq === "required" };
          if (tp === "phone") { f.type = "text"; f.format = "phone"; }
          if (tp === "email") { f.type = "text"; f.format = "email"; }
          if (tp === "date") { f.type = "date"; }
          if (tp === "textarea") { f.type = "text"; f.multiline = true; }
          if (ph) f.placeholder = ph;
          return f;
        }).filter(f => f.key);
      } else if (state.component_type !== "scale.likert") {
        config.options = (state.fixedOptions || []).map(l => String(l).trim()).filter(Boolean);
      }
    }
    // 内容规则：滑杆范围 / 量表定义（display 已由通用逻辑写入）
    if (state.component_type === "slider.range" && state.sliderCfg) {
      const sc = state.sliderCfg;
      const sl = {};
      if (sc.min !== "" && sc.min != null) sl.min = Number(sc.min);
      if (sc.max !== "" && sc.max != null) sl.max = Number(sc.max);
      if (sc.step !== "" && sc.step != null && Number(sc.step) > 0) sl.step = Number(sc.step);
      if ((sc.unit || "").trim()) sl.unit = sc.unit.trim();
      if (sc.def !== "" && sc.def != null) sl.default = Number(sc.def);
      if (sl.min != null && sl.max != null && sl.min >= sl.max) delete sl.min;
      config.slider = sl;
    }
    if (state.component_type === "scale.likert" && state.likertCfg) {
      const lc = state.likertCfg;
      config.likert = { from: 1, to: Number(lc.to) || 5,
        left: (lc.left || "").trim() || "很不满意", right: (lc.right || "").trim() || "非常满意" };
    }
    // 偏好候选：有内容才算固定，否则留给模型
    if (state.component_type === "feedback.preference" && Array.isArray(state.prefCands)) {
      const cands = state.prefCands.filter(c => (c.label || "").trim())
        .map(c => ({ label: c.label.trim(), content: (c.content || "").trim() }));
      if (cands.some(c => c.content)) config.candidates = cands; else delete config.candidates;
    }
    // 组件级交互规则 / 内容补充
    delete config.max_select; delete config.down_reasons;
    if (state.component_type === "select.multi" && Number(state.maxSelect) > 0) config.max_select = Number(state.maxSelect);
    if (state.component_type === "feedback.binary") {
      const drs = (state.downReasons || "").split("\n").map(s => s.trim()).filter(Boolean).slice(0, 6);
      if (drs.length) config.down_reasons = drs;
    }
    // 赞踩的取值固定（赞/踩），本身可聚合，不要求固定内容
    const fixedEcho = state.component_type === "feedback.binary"
      ? !!state.echo_results
      : (config.content_mode === "fixed" && !!state.echo_results && !IS_P);
    return {
      card_id: clientCardId,
      name: state.name.trim(),
      description: (card?.description || "").trim(),
      component_type: state.component_type,
      style_overrides: state.styleOv,
      model_invokable: true,
      echo_results: fixedEcho,
      group_mode: fixedEcho ? { feedback_to_model: "distribution" } : null,
      field_bindings: { config, fields: config.fields || [] },
      text_templates: { ...(card?.text_templates || {}),
        prompt: ((config.content_mode === "fixed" || state.component_type === "feedback.binary") && (state.fixedPrompt || "").trim())
          ? state.fixedPrompt.trim()
          : ((card?.text_templates || {}).prompt || "请补充信息"),
        submit: (state.submitLabel || "").trim() || (card?.text_templates || {}).submit || "提交",
        // 确认组件的主按钮渲染读 confirm_label（来自 text_templates.confirm），必须同步写入
        ...(state.component_type === "control.confirm"
          ? { confirm: (state.submitLabel || "").trim() || (card?.text_templates || {}).confirm || "确认执行",
              ...((state.cancelLabel || "").trim() ? { cancel: state.cancelLabel.trim() } : {}) }
          : {}) },
      emit_targets: ["model", "dashboard", "label_store"],
    };
  }

  function clientValidate() {
    const errs = [];
    if (!state.name.trim()) errs.push({ field: "name", message: "请填写组件名称" });
    else if (state.name.trim().length > 15) errs.push({ field: "name", message: "名称不能超过 15 字" });
    if (!state.component_type) errs.push({ field: "component_type", message: "请选择一个组件" });
    return errs;
  }

  function showFieldErrors(errors) {
    Object.values(fieldErrs).forEach(n => n.textContent = "");
    Object.values(fieldWraps).forEach(n => n.classList.remove("has-error"));
    errorsBox.innerHTML = "";
    let first = null;
    for (const err of errors) {
      const key = fieldKeyOf(err);
      const box = fieldErrs[key];
      if (box) {
        box.textContent = err.message;
        fieldWraps[key]?.classList.add("has-error");
        first = first || fieldWraps[key] || box;
      } else errorsBox.appendChild(el("div", { class: "field-error" }, [`${FIELD_LABEL[err.field] || err.field}：${err.message}`]));
    }
    (first || errorsBox).scrollIntoView({ behavior: "smooth", block: "center" });
  }

  async function save(thenPublish, btn) {
    const cerrs = clientValidate();
    if (cerrs.length) {
      // 错误可能在前面的步骤：跳回第一个有错的步骤
      const stepOf = (e) => Object.keys(STEP_FIELDS).find(k => STEP_FIELDS[k].includes(fieldKeyOf(e)));
      const firstStep = ["pick", "content", "style"].find(k => cerrs.some(e => stepOf(e) === k));
      if (firstStep && firstStep !== step && steps().some(s2 => s2.key === firstStep)) { step = firstStep; rebuild(true); }
      showFieldErrors(cerrs);
      UI.toast(`还有 ${cerrs.length} 处需要修正`, true);
      return;
    }
    // 固定内容发布门槛：存草稿放行，发布前必须配完（否则线上渲染的是兜底示例）
    if (thenPublish && state.contentMode === "fixed") {
      const ct2 = state.component_type;
      let miss = "";
      if (["select.single", "select.multi", "rank.priority"].includes(ct2)) {
        const opts2 = (state.fixedOptions || []).map(s => String(s).trim()).filter(Boolean);
        if (!(state.fixedPrompt || "").trim()) miss = "题目还没填写";
        else if (opts2.length < 2) miss = ct2 === "rank.priority" ? "固定条目至少 2 项" : "固定选项至少 2 项";
      } else if (ct2 === "form.structured") {
        const fs2 = (state.fixedFields || "").split("\n").filter(Boolean);
        if (!fs2.length) miss = "还没有添加固定字段";
      } else if (ct2 === "scale.likert" && !(state.fixedPrompt || "").trim()) {
        miss = "题目还没填写";
      } else if (PRESENT_TYPES.includes(ct2)) {
        const pp2 = state.presentParams || {};
        const need = {
          "table": () => (pp2.columns || []).filter(Boolean).length < 2 || !(pp2.rows || []).length ? "至少 2 列和 1 行数据" : "",
          "chart.line": () => (pp2.categories || []).filter(Boolean).length < 2 ? "至少 2 个数据点" : "",
          "chart.bar": () => (pp2.categories || []).filter(Boolean).length < 2 ? "至少 2 个数据点" : "",
          "chart.pie": () => (pp2.slices || []).filter(x => x.label).length < 2 ? "至少 2 个占比项" : "",
          "chart.waterfall": () => (pp2.categories || []).filter(Boolean).length < 2 ? "至少 2 个增减条目" : "",
          "metric.card": () => !(pp2.label || "").trim() || pp2.value == null || pp2.value === "" ? "指标名与数值必填" : "",
          "timeline": () => !(pp2.events || []).filter(e => e.title).length ? "至少 1 条事件" : "",
          "steps": () => (pp2.steps || []).filter(Boolean).length < 2 ? "至少 2 个步骤" : "",
          "matrix.compare": () => (pp2.options || []).filter(Boolean).length < 2 || !(pp2.dimensions || []).filter(Boolean).length ? "至少 2 个方案和 1 个维度" : "",
          "list.ordered": () => !(pp2.items || []).filter(Boolean).length ? "至少 1 条条目" : "",
          "text.emphasis": () => !(pp2.value || "").trim() ? "结论正文必填" : "",
        }[ct2];
        if (need) miss = need();
      }
      if (miss) {
        step = "content"; rebuild(true);
        UI.toast("固定内容未配置完成：" + miss + "。可先存草稿，发布前需补齐", true);
        return;
      }
    }
    const payload = collectPayloadLite();
    await UI.withBusy(btn, async () => {
      try {
        let saved2;
        if (isNew && !savedCard) {
          saved2 = (await UI.api("/api/cards", { method: "POST", body: payload })).card;
        } else if (isNew && savedCard) {
          saved2 = (await UI.api(`/api/cards/${savedCard.card_id}`, {
            method: "PUT", body: { payload, lock_version: savedCard.lock_version } })).card;
        } else {
          saved2 = (await UI.api(`/api/cards/${card.card_id}`, {
            method: "PUT", body: { payload, lock_version: card.lock_version } })).card;
        }
        localStorage.removeItem(draftKey(cardId));
        savedCard = saved2;
        clientCardId = saved2.card_id;
        publishedNow = false;
        let pubWarning = null;
        if (thenPublish) {
          const pubResp = await UI.api(`/api/cards/${saved2.card_id}/transition`, { method: "POST", body: { action: "publish" } });
          pubWarning = pubResp && pubResp.warning;
          doneWarning = pubWarning;
          savedCard = { ...saved2, version: (saved2.version || 0) + 1, status: "published" };
          publishedNow = true;
        }
        loadCards(); loadKpisAndTodos();
        rebuild(false);
        if (isNew) {
          // v2：新实例自动加入当前产品（否则注册表漏组件）
          try {
            const prods = ((await UI.api("/api/products")).products || []);
            const pid = localStorage.getItem("sia_product") || (prods[0] || {}).product_id;
            const prod = prods.find(x => x.product_id === pid);
            if (prod && !(prod.card_ids || []).includes(clientCardId)) {
              await UI.api(`/api/products/${prod.product_id}`, { method: "PUT", body: { card_ids: [...(prod.card_ids || []), clientCardId] } });
            }
          } catch (e2) {}
        }
        UI.toast(thenPublish ? "已发布并加入当前产品" : (card?.status === "published" ? "已保存，线上不变" : "已保存为草稿"));
        if (thenPublish) setTimeout(() => closeEditor(), 700);   // 发布后回工作台，不再有额外的"获取接入信息"步
      } catch (e) {
        const errs = e.data?.errors || e.data?.error?.errors;
        if (e.status === 409 && errs?.some(x => x.code === "conflict")) {
          conflictDialog(errs.find(x => x.code === "conflict"), payload);
        } else if (e.status === 409 && errs?.some(x => x.code === "card_deleted")) {
          const ok = await UI.confirm("配置已被删除", "该配置已被他人删除。是否将当前内容另存为新配置？", { okText: "另存为新配置" });
          if (ok) {
            payload.card_id = crypto.randomUUID();
            const savedNew = (await UI.api("/api/cards", { method: "POST", body: payload })).card;
            UI.toast("已另存为新配置：" + savedNew.name);
            mask.remove(); loadCards();
          }
        } else if (errs) {
          // 跳回出错字段所在的步骤（如配置名称重名 → 触发条件步）
          const stepOf2 = (er) => Object.keys(STEP_FIELDS).find(k => STEP_FIELDS[k].includes(fieldKeyOf(er)));
          const firstStep2 = ["pick", "content", "style"].find(k => errs.some(er => stepOf2(er) === k));
          if (firstStep2 && firstStep2 !== step && steps().some(s2 => s2.key === firstStep2)) { step = firstStep2; rebuild(true); }
          showFieldErrors(errs);
          UI.toast("保存失败：请修正表单中标红的字段", true);
        } else {
          UI.toast("保存失败：" + e.message + "。请检查网络后重试，重复提交不会产生重复配置。", true);
        }
      }
    }, thenPublish ? "发布中……" : "保存中……");
  }

  function conflictDialog(conflict, payload) {
    const server = conflict.server_state || {};
    const diffs = [];
    for (const k of ["name", "trigger_description"]) {
      if ((server[k] || "") !== (payload[k] || "")) diffs.push([FIELD_LABEL[k] || k, server[k], payload[k]]);
    }
    const body2 = el("div", {}, [
      el("div", { class: "secondary", style: "margin-bottom:8px" }, [conflict.message]),
      diffs.length ? el("table", { class: "data" }, [
        el("thead", {}, [el("tr", {}, [el("th", {}, ["字段"]), el("th", {}, ["对方版本"]), el("th", {}, ["我的版本"])])]),
        el("tbody", {}, diffs.map(([k, a, b]) => el("tr", {}, [
          el("td", {}, [k]), el("td", {}, [String(a || "（空）")]), el("td", {}, [String(b || "（空）")])]))),
      ]) : el("div", { class: "muted" }, ["差异在更深层配置中"]),
      el("div", { style: "display:flex;gap:8px;margin-top:12px;justify-content:flex-end" }, [
        el("button", { class: "btn", onclick: () => { m2.remove(); mask.remove(); openEditor(cardId); } }, ["放弃我的修改，加载最新"]),
        el("button", { class: "btn danger", onclick: async () => {
          card.lock_version = server.lock_version;
          m2.remove(); save(false, null);
        } }, ["用我的版本覆盖"]),
      ]),
    ]);
    const m2 = UI.modal("版本冲突", body2);
  }

  function closeEditor() {
    localStorage.removeItem(draftKey(cardId));
    mask.remove();
    document.getElementById("editorHost").hidden = true;
    document.getElementById("workbenchMain").hidden = false;
    // 深链进入编辑器后返回时清理地址栏参数
    if (location.search) history.replaceState(null, "", location.pathname);
    loadCards(); loadKpisAndTodos();
    window.scrollTo(0, 0);
  }

  // 页面式编辑器：占据主内容区（左侧导航保留），返回工作台按钮在标题左侧
  const mask = el("div", { class: "editor-inline" }, [
    el("div", { class: "modal editor" }, [
      el("div", { class: "modal-head" }, [
        el("div", { style: "display:flex;align-items:center;gap:12px" }, [
          el("button", { class: "btn small", onclick: () => { const cb = mask.querySelector(".close-btn"); cb.onclick ? cb.onclick() : closeEditor(); } }, ["返回工作台"]),
          el("div", { class: "modal-title" }, [isNew ? "新建组件" : `编辑「${card.name}」`]),
        ]),
        el("button", { class: "close-btn", "aria-label": "关闭", hidden: "" }, ["×"]),
      ]),
      body,
      foot || null,
    ]),
  ]);
  const host = document.getElementById("editorHost");
  host.innerHTML = "";
  host.appendChild(mask);
  host.hidden = false;
  document.getElementById("workbenchMain").hidden = true;
  window.scrollTo(0, 0);
  mask.querySelector(".close-btn").onclick = closeEditor;
  rebuild();
}

// 同页联动：别处改了产品或主题，工作台立刻跟上（不必刷新页面）
UI.on("products-changed", () => loadCards());
UI.on("brands-changed", () => loadCards());
document.getElementById("batchToggle").onclick = () => setBatchMode(!batchMode);
document.getElementById("newBtn").onclick = () => newConfigWizard();
document.getElementById("searchInput").oninput = UI.debounce(() => loadCards(), 250);
document.getElementById("searchBtn").onclick = async (e) => {
  await UI.withBusy(e.currentTarget, () => loadCards(), "搜索中");
};
document.getElementById("searchInput").onkeydown = (e) => { if (e.key === "Enter") loadCards(); };
// 深链：工作台待办 ?status=draft 直接带筛选进入
const initStatus = new URLSearchParams(location.search).get("status");
if (initStatus && ["draft", "published", "offline"].includes(initStatus)) statusTab = initStatus;
loadKpisAndTodos();
loadCards().then(async () => {
  const params = new URLSearchParams(location.search);
  if (params.get("edit")) {
    openEditor(params.get("edit"), undefined, params.get("step"));
  } else if (params.get("new")) {
    let prefill = null;
    try { prefill = JSON.parse(localStorage.getItem("config_prefill") || "null"); } catch (e) {}
    localStorage.removeItem("config_prefill");
    // 深链：?new=1&ct=select.single 直接带组件进入（组件模板「创建配置」也走这里）
    if (!prefill && params.get("ct")) prefill = { component_type: params.get("ct") };
    if (prefill && prefill.component_type && !V2_TEMPLATES.some(t => t.component_type === prefill.component_type)) {
      // 非法 / 已下线类型的深链：回落到选择组件步，而不是进入残缺编辑器
      prefill = null;
    }
    if (prefill && prefill.component_type) {
      if (!templateLibrary) templateLibrary = (await UI.api("/api/templates")).templates;
      const tpl = templateLibrary.find(t => t.component_type === prefill.component_type);
      if (!prefill.config && tpl) prefill.config = tpl.default_config || {};
      openEditor(undefined, prefill, params.get("step"));
    } else newConfigWizard(prefill || {});
  } else if (params.get("focus")) {
    // 深链：从交互数据卡点名称跳回，定位列表行并高亮
    const row = document.querySelector(`.card-row[data-cid="${params.get("focus")}"]`);
    if (row) {
      row.scrollIntoView({ behavior: "smooth", block: "center" });
      row.classList.add("card-flash");
      setTimeout(() => row.classList.remove("card-flash"), 2600);
    } else UI.toast("没找到这条配置，可能在其他状态标签下");
    history.replaceState(null, "", location.pathname);
  }
});
</script>
</body>
</html>
